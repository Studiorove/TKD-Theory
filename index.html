<style>
  :root{
    --ink:#0A0C0A;
    --ink-2:#14170F;
    --ink-3:#1E2318;
    --line: rgba(237,233,223,0.10);
    --line-strong: rgba(237,233,223,0.18);
    --dobok:#E7E3D6;
    --dobok-dim: rgba(231,227,214,0.90);
    --dobok-faint: rgba(231,227,214,0.70);
    --accent:#9BFF1F;
    --accent-soft: rgba(155,255,31,0.14);
    --accent-line: rgba(155,255,31,0.5);
    --red:#A6433A;
    --red-soft: rgba(166,67,58,0.18);
    --green:#5C7A4F;
    --green-soft: rgba(92,122,79,0.18);
    --radius: 16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;color:var(--dobok);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(520px circle at 12% -8%, rgba(155,255,31,0.16), transparent 60%),
      radial-gradient(460px circle at 108% 18%, rgba(155,255,31,0.12), transparent 55%),
      radial-gradient(640px circle at 50% 128%, rgba(155,255,31,0.09), transparent 60%),
      var(--ink);
    background-attachment:fixed;
    min-height:100vh;
  }
  .bg-bolts{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.07;overflow:hidden;}
  .voice{font-family:'Oswald',sans-serif;font-weight:600;}
  .voice-caps{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.02em;font-style:italic;}
  #root{max-width:480px;margin:0 auto;min-height:100vh;padding:20px 20px 40px;position:relative;z-index:1;}
  h1,h2,h3{margin:0;font-weight:600;}
  p{margin:0;}
  button{font-family:'Inter',sans-serif;cursor:pointer;border:none;background:none;color:inherit;}
  input[type=text]{font-family:'Inter',sans-serif;}
  .eyebrow{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--dobok-faint);font-weight:600;}
  .btn-primary{background:var(--accent);color:#0A1204;font-weight:700;font-size:15px;padding:15px 20px;border-radius:12px;width:100%;text-align:center;transition:transform .15s ease;}
  .btn-primary:active{transform:scale(0.97);}
  .btn-primary:disabled{opacity:0.4;}
  .btn-ghost{background:transparent;border:1px solid var(--line-strong);color:var(--dobok);font-weight:600;font-size:14px;padding:13px 18px;border-radius:12px;width:100%;text-align:center;}
  .btn-ghost:active{background:var(--ink-3);}
  .chip{padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid var(--line-strong);color:var(--dobok-dim);}
  .chip.active{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);}
  .card{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
  .opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line-strong);background:var(--ink-3);font-size:14.5px;margin-top:9px;}
  .opt.correct{background:var(--green-soft);border-color:rgba(92,122,79,0.5);color:#D3E6C8;}
  .opt.wrong{background:var(--red-soft);border-color:rgba(166,67,58,0.5);color:#F0BDB6;}
  .opt.dim{opacity:0.45;}
  .type-input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line-strong);background:var(--ink-3);color:var(--dobok);font-size:15px;margin-top:14px;}
  .type-input:focus{outline:none;border-color:var(--accent-line);}
  .type-input.correct{background:var(--green-soft);border-color:rgba(92,122,79,0.6);color:#D3E6C8;}
  .type-input.wrong{background:var(--red-soft);border-color:rgba(166,67,58,0.6);color:#F0BDB6;}
  .result-label{font-size:13px;font-weight:700;margin-top:10px;letter-spacing:0.02em;}
  .result-label.correct{color:#8FC97D;}
  .result-label.wrong{color:#E29A92;}
  .topic-toggle{width:36px;height:21px;border-radius:11px;background:var(--ink-3);border:1px solid var(--line-strong);position:relative;flex-shrink:0;padding:0;}
  .topic-toggle .knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--dobok-faint);transition:left .15s ease,background .15s ease;}
  .topic-toggle.on{background:var(--accent-soft);border-color:var(--accent-line);}
  .topic-toggle.on .knob{left:17px;background:var(--accent);}
  .topic-row.off{opacity:0.45;}
  .err{font-size:12.5px;color:#F0BDB6;margin-top:6px;}
  .fade-in{animation:fadeIn .35s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  ::selection{background:var(--accent-soft);}
</style>

<script>

var GRADE_OPTIONS = [
  {key:"kup10", currentKup:10, patternDan:1, label:"10th Kup — White Belt"},
  {key:"kup9",  currentKup:9,  patternDan:1, label:"9th Kup — Yellow Tag"},
  {key:"kup8",  currentKup:8,  patternDan:1, label:"8th Kup — Yellow Belt"},
  {key:"kup7",  currentKup:7,  patternDan:1, label:"7th Kup — Green Tag"},
  {key:"kup6",  currentKup:6,  patternDan:1, label:"6th Kup — Green Belt"},
  {key:"kup5",  currentKup:5,  patternDan:1, label:"5th Kup — Blue Tag"},
  {key:"kup4",  currentKup:4,  patternDan:1, label:"4th Kup — Blue Belt"},
  {key:"kup3",  currentKup:3,  patternDan:1, label:"3rd Kup — Red Tag"},
  {key:"kup2",  currentKup:2,  patternDan:1, label:"2nd Kup — Red Belt"},
  {key:"kup1",  currentKup:1,  patternDan:1, label:"1st Kup — Black Tag"},
  {key:"dan2",  currentKup:0,  patternDan:2, label:"1st Dan"},
  {key:"dan3",  currentKup:0,  patternDan:3, label:"2nd Dan"},
  {key:"dan4",  currentKup:0,  patternDan:4, label:"3rd Dan"},
  {key:"dan5",  currentKup:0,  patternDan:5, label:"4th Dan"},
  {key:"dan6",  currentKup:0,  patternDan:6, label:"5th Dan"},
  {key:"dan7",  currentKup:0,  patternDan:7, label:"6th Dan (all content)"}
];
function gradeOption(key){
  for(var i=0;i<GRADE_OPTIONS.length;i++){ if(GRADE_OPTIONS[i].key===key) return GRADE_OPTIONS[i]; }
  return GRADE_OPTIONS[12]; // fallback: dan4
}

var TOPICS = {
  tenets: {name:"Tenets", kr:"Jungshin"},
  definition: {name:"Definition", kr:"Jung Eui"},
  composition: {name:"Composition", kr:"Goosung"},
  power: {name:"Theory of Power", kr:"Him Ui Wolli"},
  rank: {name:"System of Rank", kr:"Dan Gup Jedo"},
  test: {name:"Test", kr:"Simsa"},
  patterns: {name:"Patterns", kr:"Tul"},
  stance: {name:"Stance", kr:"Sogi"},
  tools: {name:"Attacking/Blocking Tools", kr:"Boowi"},
  vitals: {name:"Vital Spots", kr:"Kupso"},
  history: {name:"History & Origin", kr:"Yoksa"},
  philosophy: {name:"Philosophy & Moral Culture", kr:"Chul Hak"},
  terminology: {name:"Terminology", kr:"Yongo"},
  sparring: {name:"Sparring", kr:"Matsogi"},
  physical_fitness: {name:"Physical Fitness", kr:"Chae Ryok"},
  competition: {name:"Competition & Demonstration", kr:"KyongGi"},
  techniques: {name:"Hand & Foot Techniques", kr:"Kisul"},
  combinations: {name:"Testing Combinations", kr:"Gibon Yonsup"}
};

var DATA = [
{id:"t01",topic:"tenets",q:"What are the five tenets of Taekwon-Do, in order?",a:"Courtesy, Integrity, Perseverance, Self-Control, Indomitable Spirit.",short:"Courtesy, Integrity, Perseverance, Self-Control, Indomitable Spirit",mcOnly:true,hook:"Acronym: C-I-P-S-I. \"Careful Instructors Praise Strong Individuals.\"",distractors:["Courtesy, Honesty, Perseverance, Self-Control, Indomitable Spirit","Courtesy, Integrity, Patience, Self-Control, Indomitable Spirit","Respect, Integrity, Perseverance, Self-Control, Fighting Spirit"],kup:9},
{id:"t02",topic:"tenets",q:"Korean term for the Tenets of Taekwon-Do as a whole?",a:"Taekwon-Do Jungshin.",short:"Taekwon-Do Jungshin",accept:["jungshin"],kind:"korean",hook:"Jungshin = whole spirit. Think \"genuine\" spirit — Jung-shin, genu-ine.",kup:9},
{id:"t03",topic:"tenets",q:"Korean term for Courtesy?",a:"Ye Ui.",short:"Ye Ui",accept:["ye ui","yeui"],kind:"korean",hook:"Ye Ui opens the list of five tenets — courtesy always comes first, before integrity, perseverance, self-control, and indomitable spirit.",kup:9},
{id:"t04",topic:"tenets",q:"Korean term for Integrity?",a:"Yom Chi.",short:"Yom Chi",accept:["yom chi","yomchi"],kind:"korean",hook:"Yom Chi — think \"true chi\", your inner energy staying honest.",kup:9},
{id:"t05",topic:"tenets",q:"Korean term for Perseverance?",a:"In Nae.",short:"In Nae",accept:["in nae","innae"],kind:"korean",hook:"In Nae is third of the five tenets — right after integrity, right before self-control.",kup:9},
{id:"t06",topic:"tenets",q:"Korean term for Self-Control?",a:"Guk Gi.",short:"Guk Gi",accept:["guk gi","gukgi"],kind:"korean",hook:"Guk Gi is fourth of the five tenets — self-control, right before the final test of indomitable spirit.",kup:9},
{id:"t07",topic:"tenets",q:"Korean term for Indomitable Spirit?",a:"Baekjul Boolgul.",short:"Baekjul Boolgul",accept:["baekjul","boolgul","boogul"],kind:"korean",hook:"Baekjul Boolgul — imagine a bull (\"bool\") charging at its goal, unbreakable.",kup:9},
{id:"t08",topic:"tenets",q:"How many elements of courtesy does the encyclopaedia list for students to practise?",a:"Nine.",short:"Nine",accept:["nine","9"],kind:"number",hook:"Nine elements — same sacred number as the 9 Dan degrees (3×3)."},
{id:"t09",topic:"tenets",q:"Whose story illustrates Perseverance — learning from a spider before freeing Scotland?",a:"Robert the Bruce.",short:"Robert the Bruce",accept:["robert","bruce"],kind:"name",hook:"The spider spun its web six times before succeeding — try, try again."},
{id:"t10",topic:"tenets",q:"Lao-Tzu is quoted on Self-Control: the stronger is the person who wins over ___?",a:"Oneself, rather than someone else.",short:"Oneself",accept:["oneself","himself","yourself","self"],hook:"Lao-Tzu's line: beating your own reflection in the mirror matters more than beating others."},
{id:"t11",topic:"tenets",q:"What historical last stand illustrates Indomitable Spirit?",a:"Leonidas and the 300 Spartans at Thermopylae.",short:"Leonidas and the 300 Spartans",accept:["leonidas","300 spartans","spartans","thermopylae"],kind:"name",hook:"The film \"300\" — vastly outnumbered, still didn't yield. That's the image."},
{id:"t12",topic:"tenets",q:"Confucius is quoted on Indomitable Spirit — what does he call an act of cowardice?",a:"Failing to speak out against injustice.",short:"Failing to speak out against injustice",mcOnly:true,hook:"Staying silent while someone's wronged is itself framed as the coward's act.",distractors:["Losing a sparring match without complaint","Bowing incorrectly to a senior instructor","Forgetting the words of a pattern"]},
{id:"t13",topic:"tenets",q:"Name one example the text gives of an instructor lacking Integrity.",a:"Any of: misrepresenting techniques from lack of knowledge, camouflaging bad technique with a luxurious school or flattery, teaching for materialistic gain.",short:"Teaching for materialistic gain",mcOnly:true,hook:"Picture an instructor with dollar signs where the black belt should be.",distractors:["Training students too hard physically","Failing to demonstrate a technique perfectly","Losing to a lower grade in sparring"],kup:4},

{id:"d01",topic:"definition",q:"What does \"Tae\" mean?",a:"To jump or fly — to kick or smash with the foot.",short:"Jump or fly — kick with the foot",accept:["jump","fly","kick"],hook:"\"Tae\" — like \"take off\": leaping to kick."},
{id:"d02",topic:"definition",q:"What does \"Kwon\" mean?",a:"The fist — to punch or destroy with hand or fist.",short:"The fist — to punch",accept:["fist","punch"],hook:"\"Kwon\" — think Bruce Lee's fist, a striking \"Kwon\"."},
{id:"d03",topic:"definition",q:"What does \"Do\" mean?",a:"An art or way — the right way, built and paved by the sages of the past.",short:"An art or way",accept:["art","way"],hook:"\"Do\" — same suffix as Judo, Hapkido: \"the Way\", not just technique."},
{id:"d04",topic:"definition",q:"Taken together, what does \"Taekwon-Do\" indicate?",a:"The mental training and techniques of unarmed combat for self-defence and health.",short:"Mental training and unarmed combat techniques",mcOnly:true,hook:"Chain the three roots together: Tae (kick) + Kwon (fist) + Do (way) = the mental art of unarmed combat.",distractors:["Physical conditioning and weapons training","Meditation and armed combat techniques","Competitive sport and self-defence law"]},
{id:"d05",topic:"definition",q:"The encyclopaedia says the nearest description of Taekwon-Do is almost a ___?",a:"A cult.",short:"A cult",accept:["cult"],hook:"An oddly strong word choice — \"cult\" level devotion, not just a hobby."},
{id:"d06",topic:"definition",q:"What must always be stressed, to prevent Taekwon-Do being misused as a lethal weapon?",a:"Mental training.",short:"Mental training",accept:["mental training"],hook:"Same answer as what Tae+Kwon+Do point to together — the mental half of the art."},
{id:"d07",topic:"definition",q:"True or false — the text claims mastery lets you kill a wild bull bare-handed.",a:"False. It explicitly says that is not what mastery implies.",short:"False",accept:["false"],kind:"yesno",hook:"No bull — literally. A myth the book explicitly shoots down."},

{id:"c01",topic:"composition",q:"What five elements compose Taekwon-Do?",a:"Fundamental Movements, Patterns, Dallyon, Sparring, Self-Defence Techniques.",short:"Fundamental Movements, Patterns, Dallyon, Sparring, Self-Defence",mcOnly:true,hook:"Acronym: F-P-D-S-S. \"Fit Panthers Do Special Stunts.\"",distractors:["Fundamental Movements, Patterns, Meditation, Sparring, Self-Defence","Stances, Patterns, Dallyon, Sparring, Self-Defence","Fundamental Movements, Patterns, Dallyon, Competition, Self-Defence"],kup:3},
{id:"c02",topic:"composition",q:"Korean term for Composition of Taekwon-Do?",a:"Taekwon-Do Goosung.",short:"Taekwon-Do Goosung",accept:["goosung"],kind:"korean",hook:"Goosung names the whole five-part cycle (movements, patterns, dallyon, sparring, self-defence) — not just one piece of it."},
{id:"c03",topic:"composition",q:"In the military parallel, what does Fundamental Movements correspond to?",a:"An individual soldier's basic training.",short:"Individual soldier's basic training",accept:["basic training","individual"],hook:"Same as boot camp — basic training before anything else."},
{id:"c04",topic:"composition",q:"In the military parallel, what does Dallyon correspond to?",a:"Maintenance of equipment.",short:"Maintenance of equipment",accept:["maintenance","equipment"],hook:"Dallyon shows up twice in your syllabus: here as maintenance of equipment, and later in Red Tag terminology as Conditioning — same word, same idea of upkeep, applied to gear here and to the body there."},
{id:"c05",topic:"composition",q:"In the military parallel, what does Patterns correspond to?",a:"Platoon tactics.",short:"Platoon tactics",accept:["platoon"],hook:"Patterns = choreographed platoon movements, drilled as a unit."},
{id:"c06",topic:"composition",q:"In the military parallel, what does Sparring correspond to?",a:"Field exercises in simulated combat.",short:"Field exercises in simulated combat",accept:["field exercise","simulated combat"],hook:"Sparring = simulated combat, i.e. war games before the real thing."},
{id:"c07",topic:"composition",q:"In the military parallel, what does Self-Defence correspond to?",a:"Actual combat.",short:"Actual combat",accept:["actual combat","combat"],hook:"Self-defence = no more practice — this is the real deal."},
{id:"c08",topic:"composition",q:"The cycle of Taekwon-Do's composition is said to have no beginning or end, like what?",a:"The Deity.",short:"The Deity",accept:["deity","god"],hook:"Picture an infinity symbol — no start, no end, same as how a deity is described."},

{id:"p01",topic:"power",q:"What percentage of their potential does the average person use, per the Theory of Power?",a:"10 to 20 percent.",short:"10 to 20 percent",accept:["10","20"],kind:"number",hook:"Same idea as the old \"we only use 10% of our brain\" myth — applied to physical power here."},
{id:"p02",topic:"power",q:"Name the six factors that produce power.",a:"Reaction Force, Concentration, Equilibrium, Breath Control, Mass, Speed.",short:"Reaction Force, Concentration, Equilibrium, Breath Control, Mass, Speed",mcOnly:true,hook:"Acronym: R-C-E-B-M-S. \"Really Cool Elephants Breathe Mighty Sighs.\"",distractors:["Reaction Force, Concentration, Balance, Breath Control, Mass, Speed","Reaction Force, Focus, Equilibrium, Breath Control, Mass, Speed","Reaction Force, Concentration, Equilibrium, Timing, Mass, Speed"]},
{id:"p03",topic:"power",q:"Korean term for Reaction Force?",a:"Bandong Ryok.",short:"Bandong Ryok",accept:["bandong"],kind:"korean",hook:"Bandong Ryok has two parts: Bandong (reaction) plus Ryok (force) — mirroring the Newton's-law explanation you already learned: equal and opposite.",kup:2},
{id:"p04",topic:"power",q:"What physical law underlies Reaction Force?",a:"Newton's Law — every force has an equal and opposite force.",short:"Newton's Law",accept:["newton"],hook:"Newton's 3rd law — the same one everyone learns in school: equal and opposite.",kup:2},
{id:"p05",topic:"power",q:"In a reverse punch, what does the pulling hand do to add reaction force?",a:"It's pulled sharply back to the hip at the moment of impact.",short:"Pulled sharply to the hip",accept:["hip"],hook:"Like a slingshot — pulling one hand back loads the other's launch.",kup:2},
{id:"p06",topic:"power",q:"Korean term for Concentration?",a:"Jip Joong.",short:"Jip Joong",accept:["jip joong","dip joong"],kind:"korean",hook:"Jip Joong is the two-syllable version of the water-hose analogy in the explanation above: concentrate the force onto the smallest point.",kup:2},
{id:"p07",topic:"power",q:"Why does a smaller water-hose outlet produce a stronger jet — and how does that relate to Concentration?",a:"Force focused on a smaller area increases its effect; blows are concentrated onto the smallest possible target area of the tool.",short:"Force on a smaller area is stronger",mcOnly:true,hook:"The garden-hose trick — cover the end with your thumb, the jet gets stronger.",distractors:["Force spread over a wider area is stronger","Speed matters more than target size","Larger tools always generate more force"],kup:2},
{id:"p08",topic:"power",q:"Korean term for Equilibrium?",a:"Kyun Hyung.",short:"Kyun Hyung",accept:["kyun hyung"],kind:"korean",hook:"Kyun Hyung is the only Theory of Power term for balance — pair it with dynamic and static stability, the two types you already learned.",kup:2},
{id:"p09",topic:"power",q:"What two types of stability make up Equilibrium?",a:"Dynamic stability and static stability.",short:"Dynamic and static stability",accept:["dynamic","static"],hook:"Static TV noise (still) vs. a dynamic duo (moving) — two kinds of stability.",kup:2},
{id:"p10",topic:"power",q:"At the point of impact, where should the heel of the rear foot be?",a:"Never off the ground.",short:"Never off the ground",accept:["ground","floor"],hook:"\"Roots planted\" — like a tree, the heel never lifts.",kup:2},
{id:"p11",topic:"power",q:"Korean term for Breath Control?",a:"Hohup Jojul.",short:"Hohup Jojul",accept:["hohup"],kind:"korean",hook:"Hohup Jojul — \"Ho-hup!\" is basically the sound of a sharp exhale.",kup:2},
{id:"p12",topic:"power",q:"What is the key breathing rule at the moment of impact?",a:"Never inhale while focusing a block or blow — exhale sharply instead.",short:"Never inhale at impact",accept:["exhale","inhale"],hook:"Same idea as a kiai shout — always sharp exhale, never a gasp in.",kup:2},
{id:"p13",topic:"power",q:"Korean term for Mass?",a:"Zilyang.",short:"Zilyang",accept:["zilyang"],kind:"korean",hook:"Zilyang — picture a weightlifter groaning under heavy \"z\" mass.",kup:2},
{id:"p14",topic:"power",q:"How is body weight increased during a blow, per the Mass principle?",a:"By turning the hip and using a springing knee action — raising the hip, then dropping it at impact.",short:"Hip rotation and knee spring",mcOnly:true,hook:"Same motion as a baseball swing — hip torque driving the follow-through.",distractors:["Shoulder rotation and elbow snap","Forward lean and arm extension","Foot pivot and ankle flex"],kup:2},
{id:"p15",topic:"power",q:"To properly increase body weight, the moving foot should trace which shape — sine wave or sawtooth wave?",a:"A sine wave.",short:"Sine wave",accept:["sine"],hook:"Literally a wave shape — smooth ocean swell, not jagged sawteeth.",kup:2},
{id:"p16",topic:"power",q:"Korean term for Speed?",a:"Sokdo.",short:"Sokdo",accept:["sokdo"],kind:"korean",hook:"Sokdo is the shortest of the six Theory of Power terms — short word, for the simplest idea: raw speed.",kup:2},
{id:"p17",topic:"power",q:"What is the power formula given in the Theory of Power?",a:"P = 1/2 MV\u00b2 — power equals half of mass times velocity squared.",short:"P = 1/2 MV\u00b2",accept:["mv","1/2","half"],hook:"Same formula shape as kinetic energy in physics class — half mass times velocity squared.",kup:2},
{id:"p18",topic:"power",q:"If speed triples while mass stays constant, by what factor does power increase?",a:"By a factor of nine (speed is squared in the formula).",short:"Nine",accept:["nine","9"],kind:"number",hook:"Speed is squared in the formula: 3² = 9."},
{id:"p19",topic:"power",q:"If mass triples while speed stays constant, by what factor does power increase?",a:"By a factor of three.",short:"Three",accept:["three","3"],kind:"number",hook:"Mass isn't squared — tripling it just triples the power, no more."},
{id:"p20",topic:"power",q:"The 1973 MIT Strobo experiment found kick execution time was shorter than what?",a:"Normal human reflex time — meaning some kicks can't be blocked by reaction alone.",short:"Normal reflex time",accept:["reflex"],hook:"Faster than you can blink — that's the whole point of the finding."},
{id:"p21",topic:"power",q:"What was normal reflex time found to be, at the quickest?",a:"About two-tenths (0.2) of a second.",short:"About 0.2 seconds",accept:["0.2","2/10","0,2"],kind:"number",hook:"About the time it takes to blink an eye."},
{id:"p22",topic:"power",q:"Why should a student watch the opponent's eyes rather than their limbs?",a:"Because technique execution can be faster than reflex time, so the attack must be read before it starts.",short:"Technique is faster than reflex — must be read early",mcOnly:true,hook:"Poker players read eyes, not hands — same logic here.",distractors:["Reflex is always faster than technique","Eye contact has no tactical value","Watching the hands gives the earliest warning"]},

{id:"r01",topic:"rank",q:"Korean term for System of Rank?",a:"Dan Gup Jedo.",short:"Dan Gup Jedo",accept:["dan gup jedo","dan gup"],kind:"korean",hook:"Dan Gup Jedo literally names the two halves of the ranking ladder: Dan (degree) and Gup (grade) — the term describes exactly what it is."},
{id:"r02",topic:"rank",q:"How many total ranks make up the promotional scale?",a:"Nineteen — ten gups and nine dans.",short:"Nineteen",accept:["19","nineteen"],kind:"number",hook:"10 gups + 9 dans = 19 — one shy of 20, always still climbing."},
{id:"r03",topic:"rank",q:"Which gup is lowest, and which is highest?",a:"10th grade is lowest, 1st grade is highest.",short:"10th lowest, 1st highest",accept:["10th","1st"],kind:"number",hook:"Countdown like a rocket launch: 10...9...8... — closer to 1 means closer to black belt."},
{id:"r04",topic:"rank",q:"Why is the number 9 considered significant for the degree system?",a:"9 is 3 x 3, and 3 is the most esteemed number in Oriental philosophy — heaven, mortals, earth.",short:"3 x 3 — three is the most esteemed number",accept:["3","three","9"],hook:"3×3 — same triple structure as the trigrams on the Korean flag (heaven, earth, human).",kup:1},
{id:"r05",topic:"rank",q:"What mathematical property of 9 does the text point out?",a:"Multiply 9 by any single digit and the resulting digits always sum to 9.",short:"Digits of any multiple of 9 sum to 9",mcOnly:true,hook:"The classic school math trick: any multiple of 9, digits always sum back to 9.",distractors:["Digits of any multiple of 3 sum to 9","9 cannot be divided evenly by any number","Multiples of 9 always end in an even digit"]},
{id:"r06",topic:"rank",q:"Per the text, is a 1st degree black belt an expert or a novice?",a:"A novice — merely a starting point, the foundation only.",short:"Novice",accept:["novice"],hook:"Getting your black belt is like tying your shoes for the first proper run — the start, not the finish."},
{id:"r07",topic:"rank",q:"At which degree does a student cross into the \"expert\" class?",a:"4th degree.",short:"4th degree",accept:["4th","fourth"],hook:"4 legs make a stable table — 4th degree is where the foundation becomes solid enough to call \"expert\"."},
{id:"r08",topic:"rank",q:"Which degrees make up the \"masters\" class?",a:"7th through 9th degree.",short:"7th to 9th degree",accept:["7th","9th","seventh","ninth"],hook:"Like the 9th inning — the final stretch, reserved for masters closing out the game."},
{id:"r09",topic:"rank",q:"Total hours required by the 18-month course (1.5 hrs/day, 6 days/week)?",a:"702 hours.",short:"702 hours",accept:["702"],kind:"number",hook:"702 — treat it like a memorable phone code, three digits at a glance."},
{id:"r10",topic:"rank",q:"Total hours required by the 12-month course (4 hrs/day, 6 days/week)?",a:"1248 hours.",short:"1248 hours",accept:["1248"],kind:"number",hook:"1248 — a doubling sequence: 1, 2, 4, 8."},

{id:"e01",topic:"test",q:"Who conducts grade (gup) testing?",a:"The student's own gym or dojang.",short:"The student's own gym",accept:["gym","dojang"],hook:"Same as any school test set by your own teacher — no external board involved yet."},
{id:"e02",topic:"test",q:"Who conducts degree testing up to 3rd Dan?",a:"A promotion board of 3 to 7 members from the national association or federation.",short:"A board of 3 to 7 members",accept:["3","7","board"],hook:"Picture a small judging panel, like a handful of competition judges."},
{id:"e03",topic:"test",q:"Who tests 4th to 8th degree?",a:"The promotion committee of the International Taekwon-Do Federation.",short:"ITF promotion committee",accept:["itf","international taekwon-do federation","promotion committee"],hook:"Once you hit 4th degree, your test \"goes international\" — local gym to global federation."},
{id:"e04",topic:"test",q:"How is 9th degree granted?",a:"By unanimous consent of a 9-member special committee, all holders of 7th or 8th degree.",short:"9 members, 7th/8th degree holders",accept:["9","nine","unanimous"],hook:"Mirrors a supreme-court-style council — a small high-ranking panel."},
{id:"e05",topic:"test",q:"Is the power test permitted for children?",a:"No — it's strictly prohibited, due to risk of bone or muscle damage.",short:"No",accept:["no"],kind:"yesno",hook:"Obvious child-safety logic — same reasoning as a seatbelt law."},
{id:"e06",topic:"test",q:"How high may an instructor test students, relative to their own degree?",a:"Up to half their own degree — e.g. a 4th Dan may test up to 2nd.",short:"Half their own degree",accept:["half"],hook:"An instructor can only pass on half of what they hold."},
{id:"e07",topic:"test",q:"What is the passing mark for a grade or degree test?",a:"60 points.",short:"60 points",accept:["60"],kind:"number",hook:"Same as school grading — 60% is a classic pass line."},
{id:"e08",topic:"test",q:"What happens for every 10 points above or below the passing mark?",a:"Automatic promotion or reduction accordingly.",short:"Automatic promotion or reduction",accept:["promotion","reduction","10"],hook:"Like a video game — score thresholds bump your level up or down automatically."},
{id:"e09",topic:"test",q:"What is the highest gup a 1st Dan instructor may teach?",a:"5th grade.",short:"5th grade",accept:["5th"],kind:"number",hook:"1st Dan = half of the entry grade (10th) → 5th."},
{id:"e10",topic:"test",q:"What is the highest gup a 3rd Dan instructor may teach?",a:"1st grade.",short:"1st grade",accept:["1st"],kind:"number",hook:"3rd Dan almost reaches the very top gup (1st) — same half-your-degree logic scaled up."},
{id:"e11",topic:"test",q:"What's the minimum degree to qualify as an International (Class A) umpire?",a:"4th degree, plus passing the ITF umpire course and having match experience.",short:"4th degree",accept:["4th"],kind:"number",hook:"Same \"4th = expert\" marker as the rank system — expert enough to judge internationally."},
{id:"e12",topic:"test",q:"What's the minimum degree to qualify as a National (Class B) umpire?",a:"2nd degree, qualified by the parent association.",short:"2nd degree",accept:["2nd"],kind:"number",hook:"National umpire — one tier below the international bar."},
{id:"e13",topic:"test",q:"What must an umpire wear when judging?",a:"White long-sleeved shirt, solid blue tie, blue pants, white shoes, white socks.",short:"White shirt, blue tie, blue pants, white shoes",mcOnly:true,hook:"Think of a referee's kit — clean, formal, blue-and-white like the ITF flag.",distractors:["Black shirt, red tie, black pants, white shoes","White shirt, black tie, white pants, black shoes","Blue shirt, white tie, blue pants, black shoes"]},
{id:"pn01",topic:"patterns",q:"What does the pattern CHON-JI mean, and how many movements does it have?",a:"\"Heaven and Earth\" — interpreted as the creation of the world. It has 19 movements and is the first pattern, practised from 9th grade.",short:"Heaven and Earth, 19 movements",kind:"korean",hook:"Literally: heaven (Chon) and earth (Ji) — the very beginning, fittingly the first pattern taught.",kup:9},
{id:"pn02",topic:"patterns",q:"Who is the pattern DAN-GUN named after?",a:"Dan-Gun, the legendary founder of Korea, said to have founded the nation in 2333 BC.",short:"The legendary founder of Korea",kind:"phrase",hook:"Same name as the pattern — the founder of the whole nation, fittingly an early pattern.",kup:8},
{id:"pn03",topic:"patterns",q:"Who is the pattern DO-SAN named after, and what do its 24 movements represent?",a:"The patriot Ahn Chang-Ho (1876–1938); the 24 movements represent his life devoted to Korean education and independence.",short:"Ahn Chang-Ho",kind:"phrase",hook:"Dan-Gun's own legend: he began the nation, so his pattern begins the black-belt-bound journey through the syllabus.",kup:7},
{id:"pn04",topic:"patterns",q:"Who was Won-Hyo, and when did he introduce Buddhism to the Silla Dynasty?",a:"The noted monk who introduced Buddhism to the Silla Dynasty in 686 AD.",short:"A monk who introduced Buddhism to Silla, 686 AD",kind:"phrase",hook:"Do-San's 24 movements represent his life's devotion to Korean education — the same movement count as Se-Jong's pattern, but for a completely different reason (there, it's the 24 letters of the alphabet).",kup:6},
{id:"pn05",topic:"patterns",q:"Who is YUL-GOK named after, and what do its 38 movements represent?",a:"The pseudonym of philosopher and scholar Yi I (1536–1584), \"the Confucius of Korea\"; the 38 movements refer to his birthplace on the 38th parallel.",short:"Yi I, 38th parallel",kind:"number",hook:"38 movements, 38th parallel — the number is literally his birthplace latitude.",kup:5},
{id:"pn06",topic:"patterns",q:"Who is JOONG-GUN named after, and what do the 32 movements represent?",a:"Patriot Ahn Joong-Gun, who assassinated Hiro-Bumi Ito, first Japanese governor-general of Korea; the 32 movements represent his age at execution.",short:"Ahn Joong-Gun, age 32 at execution",kind:"number",hook:"32 = his age at execution. A short, unfinished number for a life cut short.",kup:4},
{id:"pn07",topic:"patterns",q:"Who is TOI-GYE named after, and what do its 37 movements represent?",a:"Pen name of scholar Yi Hwang (16th century), authority on neo-Confucianism; the 37 movements refer to his birthplace on the 37th parallel.",short:"Yi Hwang, 37th parallel",kind:"number",hook:"Toi-Gye, Yul-Gok — both scholar patterns encode their birthplace latitude directly into the movement count.",kup:3},
{id:"pn08",topic:"patterns",q:"What does the pattern HWA-RANG refer to, and what do its 29 movements represent?",a:"The Hwa-Rang youth group from the Silla Dynasty (early 7th century); the 29 movements refer to the 29th Infantry Division, where Taekwon-Do matured.",short:"Hwa-Rang youth group, 29th Infantry Division",kind:"phrase",hook:"29th Infantry Division is where Taekwon-Do matured — same number as the pattern's movements.",kup:2},
{id:"pn09",topic:"patterns",q:"Who is CHOONG-MOO named after, and why does the pattern end with a left-hand attack?",a:"Admiral Yi Soon-Sin, inventor of the first armoured battleship (Kobukson) in 1592; it ends left-handed to symbolize his death before his full potential could be shown.",short:"Admiral Yi Soon-Sin",kind:"phrase",hook:"Kobukson — the \"turtle ship\" — is considered a forerunner of the modern submarine.",kup:1},
{id:"pn10",topic:"patterns",q:"Who is KWANG-GAE named after, and what do its 39 movements represent?",a:"Kwang-Gae-Toh-Wang, 19th King of the Koguryo Dynasty, who regained lost territories including much of Manchuria; the 39 movements refer to 391 AD, the year he took the throne.",short:"19th King of Koguryo, 391 AD",kind:"number",hook:"391 AD → \"39\" movements. Chop off the last digit of the year and you get the count.",dan:1},
{id:"pn11",topic:"patterns",q:"Who is PO-EUN named after?",a:"Chong Mong-Chu (1400), a loyal subject, poet, and pioneer in physics, famed for a poem about unwavering loyalty.",short:"Chong Mong-Chu",kind:"phrase",hook:"Po-Eun's poem about unwavering loyalty is one of Korea's most quoted lines — loyalty is the whole story here.",dan:1},
{id:"pn12",topic:"patterns",q:"Who is GE-BAEK named after?",a:"A great general in the Baek Je Dynasty (660 AD), known for severe and strict military discipline.",short:"A general in the Baek Je Dynasty",kind:"phrase",hook:"660 AD, Baek Je — a general remembered purely for iron discipline.",dan:1},
{id:"pn13",topic:"patterns",q:"Who is EUI-AM named after, and what do the 45 movements represent?",a:"Son Byong Hi, leader of the March 1, 1919 independence movement; the 45 movements refer to his age when he renamed Dong Hak to Chondo Kyo in 1905.",short:"Son Byong Hi, age 45",kind:"number",hook:"45 = his age when he renamed his movement — a name change marking a turning point.",dan:2},
{id:"pn14",topic:"patterns",q:"Who is CHOONG-JANG named after, and why does it end with a left-hand attack?",a:"General Kim Duk Ryang of the Lee Dynasty; it ends left-handed to symbolize his tragic death at 27, before reaching full maturity.",short:"General Kim Duk Ryang, died at 27",kind:"number",hook:"27 — a tragically young number, matching the pattern's mournful left-hand ending.",dan:2},
{id:"pn15",topic:"patterns",q:"What does the philosophical idea of JUCHE represent?",a:"That man is the master of everything and decides his own destiny; the diagram represents Baekdu Mountain.",short:"Man is the master of his own destiny",kind:"phrase",hook:"Juche — \"you check\" your own destiny. Self-determination is the whole idea.",dan:2},
{id:"pn16",topic:"patterns",q:"What historical date does SAM-IL denote, and what do its 33 movements represent?",a:"March 1, 1919, the start of Korea's independence movement; the 33 movements stand for the 33 patriots who planned it.",short:"March 1, 1919; 33 patriots",kind:"number",hook:"33 patriots, March 1st — the date is baked directly into the movement count.",dan:3},
{id:"pn17",topic:"patterns",q:"Who is YOO-SIN named after, and what do the 68 movements represent?",a:"General Kim Yoo Sin, a Silla Dynasty commander; the 68 movements refer to 668 AD, the year Korea was united.",short:"General Kim Yoo Sin, 668 AD",kind:"number",hook:"668 AD unification → \"68\" movements. Same trick as Kwang-Gae: last two digits of the year.",dan:3},
{id:"pn18",topic:"patterns",q:"Who is CHOI-YONG named after?",a:"General Choi Yong, Premier and Commander-in-Chief during the 14th-century Koryo Dynasty, executed by his own subordinate commanders.",short:"General Choi Yong",kind:"phrase",hook:"Choi Yong — betrayed by his own men. A general undone from within.",dan:3},
{id:"pn19",topic:"patterns",q:"Who is YON-GAE named after, and what do the 49 movements represent?",a:"General Yon Gae Somoon of the Koguryo Dynasty; the 49 movements refer to 649 AD, when he forced the Tang Dynasty out after destroying nearly 300,000 of their troops.",short:"General Yon Gae Somoon, 649 AD",kind:"number",hook:"649 AD, ~300,000 troops destroyed — the movement count (49) is the year's last two digits again.",dan:4},
{id:"pn20",topic:"patterns",q:"Who is UL-JI named after, and what do the 42 movements represent?",a:"General Ul-Ji Moon Dok, who defeated a nearly one-million-strong Tang invasion force in 612 AD using guerrilla tactics; the 42 movements represent the author's age when he designed the pattern.",short:"General Ul-Ji Moon Dok",kind:"phrase",hook:"612 AD, ~1 million invaders — but here the movement count (42) is the founder's own age, not the year.",dan:4},
{id:"pn21",topic:"patterns",q:"Who is MOON-MOO named after, and what do the 61 movements represent?",a:"The 30th king of the Silla Dynasty, buried at sea by his own will to defend Korea against Japan; the 61 movements refer to 661 AD, when he took the throne.",short:"The 30th king of Silla, 661 AD",kind:"number",hook:"661 AD → \"61\" movements — same last-two-digits pattern as several others.",dan:4},
{id:"pn22",topic:"patterns",q:"Who is SO-SAN named after, and what do the 72 movements represent?",a:"The monk Choi Hyong Ung (1520–1604), who organized a corps of monk soldiers; the 72 movements represent his age when he did so.",short:"Monk Choi Hyong Ung, age 72",kind:"number",hook:"72 = his age organizing monk soldiers — a late-life act of resistance.",dan:5},
{id:"pn23",topic:"patterns",q:"Who is SE-JONG named after, and what do its 24 movements represent?",a:"King Se-Jong, who invented the Korean alphabet in 1443; the 24 movements refer to the 24 letters of that alphabet.",short:"King Se-Jong, 24 Korean letters",kind:"number",hook:"24 letters, 24 movements — the alphabet and the pattern mirror each other exactly.",dan:5},
{id:"pn24",topic:"patterns",q:"What does the pattern TONG-IL denote?",a:"The resolution of the unification of Korea, which has been divided since 1945.",short:"Unification of Korea",kind:"phrase",hook:"Tong-Il = \"unification\" — the very last pattern in the syllabus, symbolizing the end goal.",dan:6},
{id:"pn25",topic:"patterns",q:"How many patterns are there in Taekwon-Do in total?",a:"Twenty-four.",short:"Twenty-four",kind:"number",hook:"24 patterns for 24 hours — same number as the letters in Se-Jong's alphabet, easy to cross-reference."},
{id:"pn26",topic:"patterns",q:"Why are there specifically 24 patterns?",a:"The 24 patterns represent 24 hours — one full day — symbolizing the founder's entire life.",short:"They represent 24 hours, one day",kind:"phrase",hook:"24 hours = 24 patterns = one full day = a symbolic whole life."},
{id:"pn27",topic:"patterns",q:"What is the Korean word for \"Pattern\"?",a:"Tul.",short:"Tul",kind:"korean",hook:"Tul — short, blunt word, like a tool being drawn and used."},
{id:"pn28",topic:"patterns",q:"All pattern diagrams in the encyclopaedia assume the student is facing which direction?",a:"Direction \"D\".",short:"Direction D",kind:"phrase",mcOnly:true,hook:"Picture a compass — the student is always oriented toward point D on the diagram."},
{id:"st01",topic:"stance",q:"What is the Korean word for Stance?",a:"Sogi.",short:"Sogi",kind:"korean",hook:"Sogi is the umbrella word — every other stance name in this list pairs with Sogi, so this term unlocks the pattern behind all the rest."},
{id:"st02",topic:"stance",q:"Korean term for Close Stance (feet together)?",a:"Moa Sogi.",short:"Moa Sogi",kind:"korean",hook:"Moa Sogi is the narrowest stance in the list — feet fully together, tighter than every other stance width you'll learn."},
{id:"st03",topic:"stance",q:"Korean term for Parallel Stance?",a:"Narani Sogi.",short:"Narani Sogi",kind:"korean",hook:"Narani Sogi keeps the feet parallel and shoulder-width apart — think of it as the default resting stance between techniques."},
{id:"st04",topic:"stance",q:"Korean term for Walking Stance?",a:"Gunnun Sogi.",short:"Gunnun Sogi",kind:"korean",hook:"Gunnun Sogi is the widest, most-used stance in patterns — you'll meet it more than any other stance in this list."},
{id:"st05",topic:"stance",q:"Korean term for L-Stance?",a:"Niunja Sogi.",short:"Niunja Sogi",kind:"korean",hook:"Niunja Sogi — the stance shape resembles the Korean letter it's named after."},
{id:"st06",topic:"stance",q:"Korean term for Fixed Stance?",a:"Gojung Sogi.",short:"Gojung Sogi",kind:"korean",hook:"Gojung Sogi is fixed and grounded — contrast it with Gunnun Sogi's forward motion; this one plants and holds."},
{id:"st07",topic:"stance",q:"Korean term for Sitting Stance?",a:"Annun Sogi.",short:"Annun Sogi",kind:"korean",hook:"Annun Sogi is low and seated, used side-on in patterns like Chon-Ji — unlike the forward-facing Gunnun Sogi."},
{id:"st08",topic:"stance",q:"Korean term for Diagonal Stance?",a:"Sasun Sogi.",short:"Sasun Sogi",kind:"korean",hook:"Sasun Sogi is angled diagonally — the only stance in the list that isn't square-on or side-on to the target."},
{id:"st09",topic:"stance",q:"Korean term for Crouched Stance?",a:"Oguryo Sogi.",short:"Oguryo Sogi",kind:"korean",hook:"Oguryo Sogi is the most compact, crouched stance in the list — pulled in tighter than any other."},
{id:"st10",topic:"stance",q:"Korean term for X-Stance?",a:"Kyocha Sogi.",short:"Kyocha Sogi",kind:"korean",hook:"Kyocha Sogi is the only stance where the legs actually cross — a shape you won't confuse with any other."},
{id:"st11",topic:"stance",q:"Korean term for Rear Foot Stance?",a:"Dwitbal Sogi.",short:"Dwitbal Sogi",kind:"korean",hook:"Dwitbal Sogi — \"Dwit\" = rear/behind, \"bal\" = foot. Rear-foot stance, literally."},
{id:"st12",topic:"stance",q:"Korean term for Low Stance?",a:"Nachuo Sogi.",short:"Nachuo Sogi",kind:"korean",hook:"Nachuo Sogi is simply the lowest stance in the whole list — lower than Annun Sogi (sitting) and Oguryo Sogi (crouched)."},
{id:"st13",topic:"stance",q:"Korean term for Vertical Stance?",a:"Soojik Sogi.",short:"Soojik Sogi",kind:"korean",hook:"Soojik Sogi is the most upright stance in the list — the direct contrast to Nachuo Sogi, the lowest."},
{id:"st14",topic:"stance",q:"Korean term for Open Stance?",a:"Palja Sogi.",short:"Palja Sogi",kind:"korean",hook:"Palja Sogi — feet splayed open, like the letter \"V\"."},
{id:"st15",topic:"stance",q:"In a Walking Stance, roughly how wide apart should the feet be (between the big toes)?",a:"About one and a half shoulder widths.",short:"One and a half shoulder widths",kind:"phrase",hook:"1.5 shoulder widths — halfway between a normal stride and doing the splits."},
{id:"st16",topic:"stance",q:"In a Walking Stance, how far outward should the rear foot's toes point at most?",a:"25 degrees — beyond that weakens the leg joint against a rear attack.",short:"25 degrees",kind:"number",hook:"25 degrees — think of a slightly-open door, not fully swung out."},
{id:"tl01",topic:"tools",q:"Korean term for Forefist?",a:"Ap Joomuk.",short:"Ap Joomuk",kind:"korean",hook:"Ap Joomuk — \"Ap\" = front, the front-knuckle fist.",kup:10},
{id:"tl02",topic:"tools",q:"Korean term for Back Fist?",a:"Dung Joomuk.",short:"Dung Joomuk",kind:"korean",hook:"Dung Joomuk — \"Dung\" = back, so literally back-of-fist."},
{id:"tl03",topic:"tools",q:"Korean term for Knife-Hand?",a:"Sonkal.",short:"Sonkal",kind:"korean",hook:"Sonkal — \"Son\" = hand, \"kal\" = knife. Literally hand-knife.",kup:10},
{id:"tl04",topic:"tools",q:"Korean term for Palm?",a:"Sonbadak.",short:"Sonbadak",kind:"korean",hook:"Sonbadak — \"Son\" = hand, \"badak\" = floor/surface — the flat surface of the hand.",kup:6},
{id:"tl05",topic:"tools",q:"Korean term for Footsword?",a:"Balkal.",short:"Balkal",kind:"korean",hook:"Balkal — same \"kal\" (knife) as Sonkal, but for the foot (\"Bal\").",kup:10},
{id:"tl06",topic:"tools",q:"Korean term for Ball of the Foot?",a:"Apkumchi.",short:"Apkumchi",kind:"korean",hook:"Apkumchi — \"Ap\" = front, the front pad of the foot.",kup:10},
{id:"tl07",topic:"tools",q:"Korean term for Instep?",a:"Baldung.",short:"Baldung",kind:"korean",hook:"Baldung — \"Bal\" = foot, \"dung\" = back — the back/top of the foot."},
{id:"tl08",topic:"tools",q:"Korean term for Back Heel?",a:"Dwichook.",short:"Dwichook",kind:"korean",hook:"Dwichook — \"Dwi\" = rear/back, the back of the heel.",kup:7},
{id:"tl09",topic:"tools",q:"Korean term for Knee (as an attacking tool)?",a:"Moorup.",short:"Moorup",kind:"korean",hook:"Moorup — think \"more up\" — the knee drives upward into the target."},
{id:"tl10",topic:"tools",q:"Korean term for Elbow?",a:"Palkup.",short:"Palkup",kind:"korean",hook:"Palkup shares its Pal (arm) root with Palmok (forearm) — both arm-related tools, Palkup zooming in on just the elbow.",kup:6},
{id:"tl11",topic:"tools",q:"Korean term for Forearm?",a:"Palmok.",short:"Palmok",kind:"korean",hook:"Palmok — \"Pal\" = arm, \"mok\" = neck/section — the arm's own \"neck\" segment."},
{id:"tl12",topic:"tools",q:"Korean term for Thumb?",a:"Umji.",short:"Umji",kind:"korean",hook:"Umji — short, blunt word for a short, blunt digit: the thumb."},
{id:"tl13",topic:"tools",q:"Korean term for Fingertips?",a:"Sonkut.",short:"Sonkut",kind:"korean",hook:"Sonkut — \"Son\" = hand, \"kut\" = end/tip — the very tip of the hand.",kup:8},
{id:"tl14",topic:"tools",q:"What is the Korean term for \"attacking tools\"?",a:"Gong Gyok Boowi.",short:"Gong Gyok Boowi",kind:"korean",hook:"Gong Gyok Boowi — \"Gong Gyok\" sounds aggressive, like \"go get\" — the attacking side."},
{id:"tl15",topic:"tools",q:"What is the Korean term for \"blocking tools\"?",a:"Makgi Boowi.",short:"Makgi Boowi",kind:"korean",hook:"Makgi Boowi — same \"Makgi\" as in block names elsewhere — the blocking side."},
{id:"tl16",topic:"tools",q:"Attacking and blocking tools are divided into which three categories?",a:"Hand parts, foot parts, and miscellaneous parts.",short:"Hand parts, foot parts, miscellaneous parts",kind:"phrase",mcOnly:true,hook:"Hand, foot, misc — the same three-way split used everywhere else in the book's structure."},
{id:"vs01",topic:"vitals",q:"What is the Korean term for Vital Spots?",a:"Kupso.",short:"Kupso",kind:"korean",hook:"Kupso names the whole category — every specific vital spot you learn (Mori, Mok, Gasum, Bokboo) is a type of Kupso."},
{id:"vs02",topic:"vitals",q:"Vital spots are divided into which two groups?",a:"Major and minor.",short:"Major and minor",kind:"phrase",mcOnly:true,hook:"Major/minor — same split used in music, easy to reuse mentally."},
{id:"vs03",topic:"vitals",q:"How is a \"major\" vital spot defined?",a:"Injury to it can lead to death or permanent disability.",short:"Can lead to death or permanent disability",kind:"phrase",mcOnly:true,hook:"Death or permanent disability — the worst-case category, remember it as the \"red flag\" one."},
{id:"vs04",topic:"vitals",q:"How is a \"minor\" vital spot defined?",a:"Injury to it isn't life-threatening but causes pain and temporary disability.",short:"Pain and temporary disability, not life-threatening",kind:"phrase",mcOnly:true,hook:"Pain but temporary — the \"you'll live\" category."},
{id:"vs05",topic:"vitals",q:"How many bones make up the human skull, per the encyclopaedia?",a:"28 bones.",short:"28",kind:"number",hook:"28 skull bones — same as the days in a lunar month, an easy peg."},
{id:"vs06",topic:"vitals",q:"How many of the skull's bones protect the brain specifically?",a:"Eight.",short:"Eight",kind:"number",hook:"8 of 28 bones guard the brain — less than a third of the skull is doing the heavy lifting."},
{id:"vs07",topic:"vitals",q:"How many vertebrae make up the cervical (neck) spine?",a:"Seven.",short:"Seven",kind:"number",hook:"7 cervical vertebrae — humans and giraffes both have exactly 7, regardless of neck length."},
{id:"vs08",topic:"vitals",q:"How many vertebrae make up the lumbar (abdominal) spine?",a:"Five.",short:"Five",kind:"number",hook:"5 lumbar vertebrae — one for each finger on a hand resting on the lower back."},
{id:"vs09",topic:"vitals",q:"Korean term for the Head (as a vital-spot region)?",a:"Mori.",short:"Mori",kind:"korean",hook:"Mori — same word used for \"Head\" back in the Attacking Tools section (the head as a misc. tool)."},
{id:"vs10",topic:"vitals",q:"Korean term for the Neck (as a vital-spot region)?",a:"Mok.",short:"Mok",kind:"korean",hook:"Mok — short and sharp, like the neck itself: a narrow, vulnerable point."},
{id:"vs11",topic:"vitals",q:"Korean term for the Chest (as a vital-spot region)?",a:"Gasum.",short:"Gasum",kind:"korean",hook:"Gasum sits right after Mok (neck) in the same body-region list — one step down from the throat."},
{id:"vs12",topic:"vitals",q:"Korean term for the Abdomen (as a vital-spot region)?",a:"Bokboo.",short:"Bokboo",kind:"korean",hook:"Bokboo — \"Bok\" appears in other body-related Korean terms tied to the torso."},
{id:"hs01",topic:"history",q:"Who founded Taekwon-Do?",a:"General Choi Hong Hi.",short:"General Choi Hong Hi",kind:"name",hook:"Same surname as pattern Choi-Yong — different Choi, but the name recurs through the book."},
{id:"hs02",topic:"history",q:"When was General Choi Hong Hi born?",a:"November 9th, 1918.",short:"November 9, 1918",kind:"number",hook:"1918 — same era as the end of WWI, easy historical peg."},
{id:"hs03",topic:"history",q:"What martial art did the founder learn as a teenager, before Karate?",a:"Taek Kyon, learned at age 15.",short:"Taek Kyon",kind:"phrase",hook:"Taek Kyon first, Karate second — native art before foreign influence, in that order."},
{id:"hs04",topic:"history",q:"What martial art did the founder study while in Japan, becoming a black belt in it?",a:"Karate.",short:"Karate",kind:"phrase",hook:"Japan → Karate → black belt — a straight line of cause and effect."},
{id:"hs05",topic:"history",q:"On what date was the name \"Taekwon-Do\" officially given?",a:"April 11, 1955.",short:"April 11, 1955",kind:"number",hook:"April 11, 1955 — think \"4-11\" like an emergency call sign for the art's \"birth\"."},
{id:"hs06",topic:"history",q:"What year was Korea liberated from Japanese occupation?",a:"1945.",short:"1945",kind:"number",hook:"1945 — same year as WWII's end, a natural double-peg."},
{id:"hs07",topic:"history",q:"What incident led to the founder's imprisonment by the Japanese?",a:"The Pyongyang Student Soldier's Incident, a national liberation movement he initiated.",short:"Pyongyang Student Soldier's Incident",kind:"phrase",hook:"\"Pyongyang Student Soldier\" — a movement started by a student soldier, in Pyongyang."},
{id:"hs08",topic:"history",q:"In 1959, the founder led a military demonstration team on tour to which two countries?",a:"South Vietnam and Taiwan.",short:"South Vietnam and Taiwan",kind:"phrase",mcOnly:true,hook:"Vietnam and Taiwan — both are Asian nations the founder visited to spread the art abroad."},
{id:"hs09",topic:"history",q:"How many basic ideals did the founder formulate during the 1959 tour?",a:"Three.",short:"Three",kind:"number",hook:"Three ideals, like a three-legged stool — self-confidence, brotherhood, peace."},
{id:"ph01",topic:"philosophy",q:"What is stated as the utmost purpose of Taekwon-Do?",a:"To eliminate fighting by discouraging the stronger's oppression of the weaker, built on humanity, justice, morality, wisdom and faith.",short:"Eliminate fighting; stop the strong oppressing the weak",mcOnly:true,hook:"The whole point in one line: stop the strong preying on the weak."},
{id:"ph02",topic:"philosophy",q:"How many philosophical guidelines/cornerstones does the founder set out for serious students?",a:"Nine.",short:"Nine",kind:"number",hook:"9 guidelines — same sacred number as the 9 Dan degrees."},
{id:"ph03",topic:"philosophy",q:"Complete the guideline: \"Be gentle to the ___, tough to the ___.\"",a:"Be gentle to the weak, tough to the strong.",short:"Weak; strong",hook:"Weak gets gentleness, strong gets toughness — the opposite of a bully's instinct."},
{id:"ph04",topic:"philosophy",q:"Complete the guideline: \"Always finish what you begin, be it ___ or ___.\"",a:"Large or small.",short:"Large or small",hook:"Large or small — no task is too small to finish properly."},
{id:"ph05",topic:"philosophy",q:"Complete the guideline: \"Teach attitude and skill with ___ rather than words.\"",a:"Action.",short:"Action",hook:"Actions, not words — \"show, don't tell\" applied to teaching."},
{id:"tm01",topic:"terminology",kup:10,q:"Korean term for Obverse (same-side technique)?",a:"Baro.",short:"Baro",kind:"korean",hook:"Baro is always paired with its opposite, Bandae — learn the two together, not separately."},
{id:"tm02",topic:"terminology",kup:10,q:"Korean term for Reverse (opposite-side technique)?",a:"Bandae.",short:"Bandae",kind:"korean",hook:"Bandae is always paired with its opposite, Baro — same-side versus opposite-side."},
{id:"tm03",topic:"terminology",kup:10,q:"Korean term for Inner Forearm?",a:"An palmok.",short:"An palmok",kind:"korean",hook:"An palmok — \"An\" = inner, like being \"in\" the forearm's inside edge."},
{id:"tm04",topic:"terminology",kup:10,q:"Korean term for Outer Forearm?",a:"Bakat palmok.",short:"Bakat palmok",kind:"korean",hook:"Bakat shares its root with Bakuro (outward) — both point away from the body's centre."},
{id:"tm05",topic:"terminology",kup:10,q:"Korean term for High Section?",a:"Nopunde.",short:"Nopunde",kind:"korean",hook:"Nopunde — \"Nope, up there!\" — the high section."},
{id:"tm06",topic:"terminology",kup:10,q:"Korean term for Middle Section?",a:"Kaunde.",short:"Kaunde",kind:"korean",hook:"Kaunde sits between Nopunde (high) and Najunde (low) — the middle of a three-part scale."},
{id:"tm07",topic:"terminology",kup:10,q:"Korean term for Low Section?",a:"Najunde.",short:"Najunde",kind:"korean",hook:"Najunde — \"Na, down there\" — the low section."},
{id:"tm08",topic:"terminology",kup:9,q:"Korean term for Normal Motion?",a:"Pontonguro.",short:"Pontonguro",kind:"korean",hook:"Pontonguro — a long word for a plain, ordinary (normal) motion."},
{id:"tm09",topic:"terminology",kup:9,q:"Korean term for Self Defence?",a:"Hosinsul.",short:"Hosinsul",kind:"korean",hook:"Hosinsul — \"Ho\" + \"sin\" — protecting yourself from sin/harm, self defence."},
{id:"tm10",topic:"terminology",kup:9,q:"Korean term for Power Test?",a:"Wi-Ryok.",short:"Wi-Ryok",kind:"korean",hook:"Wi-Ryok — short, sharp word for a short, sharp power test."},
{id:"tm11",topic:"terminology",kup:9,q:"Korean term for Inward?",a:"Anuro.",short:"Anuro",kind:"korean",hook:"Anuro — \"An\" again = inner/inward, same root as An palmok."},
{id:"tm12",topic:"terminology",kup:9,q:"Korean term for Outward?",a:"Bakuro.",short:"Bakuro",kind:"korean",hook:"Bakuro — \"Bak\" again = outer/outward, same root as Bakat."},
{id:"tm13",topic:"terminology",kup:8,q:"Korean term for Thrust?",a:"Tulgi.",short:"Tulgi",kind:"korean",hook:"Tulgi shares its root with Yobap Tulgi (side front thrust) — the general word for a straight thrusting action."},
{id:"tm14",topic:"terminology",kup:8,q:"Korean term for Continuous Motion?",a:"Yonsok tongjak.",short:"Yonsok tongjak",kind:"korean",hook:"Yonsok tongjak — \"Yonsok\" recurs for anything continuous/consecutive."},
{id:"tm15",topic:"terminology",kup:8,q:"Korean term for Fast Motion?",a:"Pparun tongjak.",short:"Pparun tongjak",kind:"korean",hook:"Pparun tongjak is the direct opposite of Neurin tongjak (slow motion) — always learn the pair together."},
{id:"tm16",topic:"terminology",kup:8,q:"Korean numbers one through five?",a:"Hanna, Dool, Set, Net, Dasot.",short:"Hanna, Dool, Set, Net, Dasot",mcOnly:true,hook:"Counting 1-5 — Hanna, Dool, Set, Net, Dasot — practise them like a countdown."},
{id:"tm17",topic:"terminology",kup:8,q:"Korean numbers six through ten?",a:"Yosut, Il gup, Yodul, Ahop, Yol.",short:"Yosut, Il gup, Yodul, Ahop, Yol",mcOnly:true,hook:"Yol (10) closes out the count from Hanna through Yol — the complete set of ten."},
{id:"tm18",topic:"terminology",kup:7,q:"Korean term for Flying High Side Piercing Kick?",a:"Twimyo nopi yop cha jirugi.",short:"Twimyo nopi yop cha jirugi",kind:"korean",hook:"Twimyo nopi yop cha jirugi — literally jump (twimyo) + high (nopi) + side (yop) + kick."},
{id:"tm19",topic:"terminology",kup:7,q:"Korean term for Slow Motion?",a:"Neurin tongjak.",short:"Neurin tongjak",kind:"korean",hook:"Neurin tongjak is the direct opposite of Pparun tongjak (fast motion) — learn the pair together, not apart."},
{id:"tm20",topic:"terminology",kup:7,q:"Korean term for Double (as in a technique)?",a:"Ijung.",short:"Ijung",kind:"korean",hook:"Ijung — short word, doubled meaning — double."},
{id:"tm21",topic:"terminology",kup:7,q:"Korean term for Sliding?",a:"Mikulmyo.",short:"Mikulmyo",kind:"korean",hook:"Mikulmyo describes a smooth transfer of weight — distinct from the sharper, snapping motions elsewhere in this list."},
{id:"tm22",topic:"terminology",kup:6,q:"Korean term for Consecutive Kick?",a:"Yonsok chagi.",short:"Yonsok chagi",kind:"korean",hook:"Yonsok chagi — same \"Yonsok\" root as continuous motion, but chagi = kick."},
{id:"tm23",topic:"terminology",kup:6,q:"Korean term for Connecting Motion?",a:"Yon gyol tongjak.",short:"Yon gyol tongjak",kind:"korean",hook:"Yon gyol tongjak shares its Yon root with Yonsok tongjak (continuous motion) — both link movements together, just at a different rhythm."},
{id:"tm24",topic:"terminology",kup:6,q:"Korean term for Two Step Sparring?",a:"Ibo matsogi.",short:"Ibo matsogi",kind:"korean",hook:"Ibo matsogi sits between Ilbo matsogi (one step) and Jayoo matsogi (free) — the middle stage of sparring training."},
{id:"tm25",topic:"terminology",kup:6,q:"Korean term for Warning (in sparring)?",a:"Ju ui.",short:"Ju ui",kind:"korean",hook:"Ju ui — short, sharp sound, like a referee's warning whistle."},
{id:"tm26",topic:"terminology",kup:6,q:"Korean term for Foul (in sparring)?",a:"Gam jum.",short:"Gam jum",kind:"korean",hook:"Gam jum is the point-deduction term — pair it with Ju ui (warning), the lighter version of the same penalty system."},
{id:"tm27",topic:"terminology",kup:6,q:"Korean term for Belt?",a:"Ti.",short:"Ti",kind:"korean",hook:"Ti — the shortest word for the simplest item: the belt itself."},
{id:"tm28",topic:"terminology",kup:5,q:"Korean term for Free Sparring?",a:"Jayoo matsogi.",short:"Jayoo matsogi",kind:"korean",hook:"Jayoo matsogi is the most advanced of the three sparring terms — after Ilbo (one step) and Ibo (two step)."},
{id:"tm29",topic:"terminology",kup:5,q:"Korean term for Flying Overhead Front Snap Kick?",a:"Twimyo nopi ap chagi.",short:"Twimyo nopi ap chagi",kind:"korean",hook:"Twimyo nopi ap chagi — same jump+high root as the side version, but ap = front."},
{id:"tm30",topic:"terminology",kup:4,q:"Korean term for One Step Sparring?",a:"Ilbo matsogi.",short:"Ilbo matsogi",kind:"korean",hook:"Ilbo matsogi — \"Il\" = one, same number root as Ilgup/Il gup (seven) — one step sparring."},
{id:"tm31",topic:"terminology",kup:4,q:"Korean term for Special Technique?",a:"Tuk gi.",short:"Tuk gi",kind:"korean",hook:"Tuk gi — short word for a special, standout technique."},
{id:"tm32",topic:"terminology",kup:3,q:"Korean term for Conditioning?",a:"Dallyon.",short:"Dallyon",kind:"korean",hook:"Dallyon is the same word you met earlier as maintenance of equipment in the composition cycle — same idea, now applied to conditioning the body itself."},
{id:"sp01",topic:"sparring",kup:8,q:"Describe the four steps of bowing in to a class.",a:"Stand at attention and shout 'Charyot'; check the class is at attention; address the instructor by the correct title for their degree; shout 'Kyong Ye' and everyone bows while saying 'Taekwon'.",short:"Charyot, check attention, address instructor, Kyong Ye",mcOnly:true,hook:"Charyot (attention) → check → address → Kyong Ye (bow) — same four beats every single class."},
{id:"sp02",topic:"sparring",kup:8,q:"What are the two reasons for the Taekwon-Do handshake?",a:"To show you have no hidden agenda, and to show the weight of your respect for the other person.",short:"No hidden agenda; weight of respect",mcOnly:true,hook:"No hidden agenda, weight of respect — a handshake that means something, not just habit."},
{id:"sp03",topic:"sparring",kup:8,q:"What title is used to address a 1st to 3rd degree instructor?",a:"Boosabum (Assistant Instructor).",short:"Boosabum",kind:"korean",hook:"Boosabum — the longest title for the most junior instructor rank (1st-3rd)."},
{id:"sp04",topic:"sparring",kup:8,q:"What title is used to address a 4th to 6th degree instructor?",a:"Sabum (Instructor).",short:"Sabum",kind:"korean",hook:"Sabum — drop the \"Boo\" once you're a full Instructor (4th-6th)."},
{id:"sp05",topic:"sparring",kup:8,q:"What title is used to address a 7th to 8th degree instructor?",a:"Sahyun (Master).",short:"Sahyun",kind:"korean",hook:"Sahyun sits third in the four-title ladder: Boosabum, Sabum, Sahyun, Sasung — each one step more senior than the last."},
{id:"sp06",topic:"sparring",kup:8,q:"What title is used to address a 9th degree instructor?",a:"Sasung (Grand Master).",short:"Sasung",kind:"korean",hook:"Sasung — the shortest, top title: Grand Master (9th)."},
{id:"sp07",topic:"sparring",kup:6,q:"List three fouls in sparring.",a:"Any three of: heavy contact, attacking a fallen opponent, leg sweeping, holding/grabbing, intentional attack to an illegal target, unsportsmanlike conduct.",short:"Heavy contact, attacking a fallen opponent, leg sweeping",mcOnly:true,hook:"Heavy contact, hitting someone down, sweeping — the obvious \"that's not sportsmanship\" list."},
{id:"sp08",topic:"sparring",kup:6,q:"What happens when a competitor commits a foul?",a:"They're given a minus point. Three fouls in a match results in disqualification.",short:"Minus point; 3 fouls = disqualified",mcOnly:true,hook:"Three strikes and you're out — literally, three fouls ends the match."},
{id:"sp09",topic:"sparring",kup:6,q:"What happens when a competitor receives a warning?",a:"A warning is recorded. Every three warnings results in a point deducted from their score.",short:"Every 3 warnings = 1 point deducted",mcOnly:true,hook:"Warnings stack in threes, same rhythm as the foul rule but one step gentler."},
{id:"sp10",topic:"sparring",kup:6,q:"List three warning offences in sparring.",a:"Any three of: falsely claiming a point, stepping out of the ring, falling down, faking injury, avoiding sparring, adjusting equipment without consent, unintentional illegal target attack.",short:"Falsely claiming a point, stepping out of the ring, falling down",mcOnly:true,hook:"Faking, stalling, stepping out — the \"trying to cheat the system\" list."},
{id:"sp11",topic:"sparring",kup:5,q:"List three offences that cause disqualification during sparring.",a:"Any three of: misconduct against officials, uncontrolled/excessive contact, receiving three fouls, being under the influence of alcohol or drugs, losing temper, insulting an opponent or official, biting or scratching, attacking with the knee/elbow/forehead, causing loss of consciousness.",short:"Uncontrolled contact, 3 fouls, losing temper",mcOnly:true,hook:"The serious-enough-to-end-it list — contact, temper, substances, biting."},
{id:"sp12",topic:"sparring",kup:4,q:"How are points scored in sparring?",a:"One point for a hand technique to a legal target; two points for a kick to the body; three points for a kick to a legal target on the head.",short:"1 hand, 2 body kick, 3 head kick",mcOnly:true,hook:"1-2-3 like counting up: hand, body kick, head kick — value rises with difficulty."},
{id:"sp13",topic:"sparring",kup:4,q:"How is scoring for pattern competition structured?",a:"Competitors start with a perfect 10 points. Judges deduct points in increments of 0.2 or 0.5 for errors observed during the performance.",short:"Start at 10, deduct 0.2 or 0.5 per error",mcOnly:true,hook:"Start at a perfect 10, like a gymnastics score, then judges chip away."},
{id:"sp14",topic:"sparring",kup:4,q:"In black belt pattern competition, how are the two patterns chosen?",a:"The first is chosen at random from patterns of their grade; the second is chosen at random from all remaining patterns up to their current grade.",short:"One random from their grade, one from all patterns up to it",mcOnly:true,hook:"One roll of the dice from your own grade, one from everything below it."},
{id:"sp15",topic:"sparring",kup:4,q:"What are the three lines of the body used in judging?",a:"Centre line, chest line, and shoulder line.",short:"Centre line, chest line, shoulder line",mcOnly:true,hook:"Centre, chest, shoulder — three vertical lines, like a target painted on the body."},
{id:"sp16",topic:"sparring",kup:4,q:"What is the Korean term for sine wave?",a:"Hwaldung pahdo.",short:"Hwaldung pahdo",kind:"korean",hook:"Hwaldung pahdo — literally \"active wave\" — matches the physical sine-wave motion."},
{id:"sp17",topic:"sparring",kup:4,q:"Briefly explain sine wave.",a:"The body relaxes at the start of a movement, raising the centre of gravity to create potential energy, which converts to kinetic energy as the body drops — increasing the power of the technique.",short:"Relax, raise, drop to convert potential into kinetic energy",mcOnly:true,hook:"Rise then drop — same physics as a pendulum gaining speed on the way down."},
{id:"sp18",topic:"sparring",kup:2,q:"List five characteristics of an ideal Taekwon-Do student.",a:"Any five of: never tire of learning, willing to sacrifice for the art, set a good example, be loyal and never criticise the instructor, practise what's taught, remember conduct reflects on the art, discard techniques the instructor disapproves of, never be disrespectful, always be eager to ask questions, never betray the instructor.",short:"Never tire of learning, willing to sacrifice, set a good example",mcOnly:true,hook:"Never tire, never betray — the two bookends of the whole list."},
{id:"cm01",topic:"composition",kup:3,q:"What is the Korean term for the cycle of Taekwon-Do?",a:"Soonhwan Do.",short:"Soonhwan Do",kind:"korean",hook:"Soonhwan Do — \"soon\" and \"circle\" sound-alike, a cycle that turns."},
{id:"cm02",topic:"composition",kup:6,q:"What are the three reasons the Taekwon-Do belt wraps around the waist only once?",a:"To pursue one goal until completion (Ohdoilkwan); to serve one master with unshakable loyalty (Ilpyondanshim); to gain victory with one blow (Ilkyokpilsung). Decided by the ITF board on 1 July 1985.",short:"One goal, one master, one blow",mcOnly:true,hook:"One goal, one master, one blow — the belt only wraps once because everything else in the philosophy is also singular."},
{id:"ph06",topic:"philosophy",kup:9,q:"What is the Taekwon-Do student oath?",a:"I shall observe the tenets of Taekwon-Do. I shall respect my instructors and seniors. I shall never misuse Taekwon-Do. I shall be a champion of freedom and justice. I shall build a more peaceful world.",short:"Observe tenets, respect seniors, never misuse, champion freedom/justice, build peace",mcOnly:true,hook:"Five lines, one per tenet-adjacent value — observe, respect, never misuse, champion, build."},
{id:"ph07",topic:"philosophy",kup:8,q:"What does the way Taekwon-Do is written on the back of the Dobok represent?",a:"The 'evergreen tree' — the tree never sheds its leaves and always shows its true colours, just as a student is expected to always be at their best.",short:"The evergreen tree",mcOnly:true,hook:"Evergreen never sheds its leaves — same idea as \"always show your true colours\"."},
{id:"ph08",topic:"philosophy",kup:6,q:"What animal is symbolic in Taekwon-Do, and why?",a:"The turtle — it has for centuries been the Oriental symbol of longevity. The ITF plaque represents the turtle's shell.",short:"The turtle — symbol of longevity",mcOnly:true,hook:"Turtles live long — the ITF's own badge is shaped like a turtle shell for exactly that reason."},
{id:"ph09",topic:"philosophy",kup:3,q:"Why is black piping worn on the black belt Dobok?",a:"Historically in Korea, black was the colour of the royal classes. The colour order (blue, red, black) reflects the higher echelons of the Silla hierarchy — just as royalty was duty-bound to protect their people, the black belt student is charged with a duty of care for colour belt students.",short:"Black was the royal colour — duty of care",mcOnly:true,hook:"Black was royal in old Korea — the belt colour order literally borrows the old court hierarchy."},
{id:"ph10",topic:"philosophy",kup:4,q:"List the nine training secrets of Taekwon-Do.",a:"Study the theory of power thoroughly; understand the purpose and method of each movement; coordinate eyes, hands, feet and breath; choose the correct attacking tool for each vital spot; use correct angle and distance; keep arms and legs slightly bent while moving; begin movements with a backward motion; use knee spring to create sine wave; exhale briefly at the moment of each blow.",short:"Theory of power, coordination, correct tool, angle/distance, sine wave, exhale on impact",mcOnly:true,hook:"Nine secrets, same sacred number as the nine Dan degrees."},
{id:"ph11",topic:"philosophy",kup:4,q:"According to the club syllabus, what five elements of courtesy should a Taekwon-Do student practise?",a:"Be polite to one another; encourage a sense of justice and humanity; distinguish instructor from student, senior from junior, elder from younger; behave according to etiquette; respect others' possessions.",short:"Politeness, justice, respecting seniority, etiquette, respecting possessions",mcOnly:true,hook:"Five and five — courtesy elements echo the five tenets in structure, not content."},
{id:"ph12",topic:"philosophy",kup:1,q:"What is the significance of the word 'Do' in Taekwon-Do?",a:"It comes from the Chinese word 'Dao', meaning the road or the way. A person's life is like a road they must travel — mental training helps identify the principles to guide them toward happiness.",short:"From Dao — the road or way",mcOnly:true,hook:"Do = Dao = the road. Every life is a road with a destination."},
{id:"ph13",topic:"philosophy",kup:1,q:"What are the four facets of Taekwon-Do?",a:"A competitive activity (a sport); a form of self-defence (a martial art); a means of improving one's behaviour (a way of life); a tool for social development.",short:"Sport, martial art, way of life, social development",mcOnly:true,hook:"Sport, art, life, society — four completely different reasons to train."},
{id:"ph14",topic:"philosophy",kup:1,q:"List the five qualities of a virtuous person.",a:"Humanity, Righteousness, Propriety, Wisdom, and Trust.",short:"Humanity, Righteousness, Propriety, Wisdom, Trust",mcOnly:true,hook:"Humanity, Righteousness, Propriety, Wisdom, Trust — same five as classical Confucian virtue."},
{id:"ph15",topic:"philosophy",kup:1,q:"List four characteristics of the ideal instructor.",a:"Any four of: strong moral and ethical standard, clear outlook and philosophy on life, responsible attitude, scientific mind in matters of technique, knowledge of vital spots, unshakeable integrity, dedication to spreading Taekwon-Do, and being trusted and respected by seniors and juniors alike.",short:"Strong morals, clear philosophy, scientific mind, integrity",mcOnly:true,hook:"Morals, philosophy, science, integrity — the instructor version of the five tenets."},
{id:"hs10",topic:"history",kup:1,q:"When was the ITF officially formed?",a:"22nd March 1966.",short:"22nd March 1966",kind:"number",hook:"1966 — same decade the ITF itself was founded, easy era-peg."},
{id:"hs11",topic:"history",kup:1,q:"Name the nine founding member countries of the ITF.",a:"Vietnam, Malaysia, Singapore, West Germany, United States, Turkey, Italy, Egypt, and Korea.",short:"Vietnam, Malaysia, Singapore, West Germany, US, Turkey, Italy, Egypt, Korea",mcOnly:true,hook:"Nine countries, same number as the nine training secrets — coincidence, but useful for recall."},
{id:"hs12",topic:"history",kup:1,q:"When and where was the AETF formed?",a:"June 1979, in Oslo, Norway.",short:"June 1979, Oslo, Norway",kind:"number",hook:"Oslo, Norway — a cold, northern founding for a federation spreading worldwide."},
{id:"pw01",topic:"power",kup:3,q:"Explain the stamping motion.",a:"It's used to accentuate hip movement and increase the mass of an attack. The attacker's foot is raised to knee level, then rapidly brought down to the floor in a stamping motion.",short:"Accentuates hip movement, increases mass",mcOnly:true,hook:"Stamp the foot down like squashing something — that's literally the motion."},
{id:"or01",topic:"history",q:"What Korean term historically described open hand fighting in the Koguryo Dynasty?",a:"Soo Bak-Gi.",short:"Soo Bak-Gi",hook:"Soo Bak-Gi — the everyday-people's version of open hand fighting, distinct from Taek Kyon."},
{id:"or02",topic:"history",q:"What is open hand fighting called in Japan?",a:"Judo, Karate, Aikido, or Jujitsu.",short:"Judo, Karate, Aikido, Jujitsu",mcOnly:true,hook:"Japan alone has four names — reflecting how many distinct styles branched from similar roots."},
{id:"or03",topic:"history",q:"What is open hand fighting called in China?",a:"Kung-Fu (or Daeji-Chon).",short:"Kung-Fu"},
{id:"or04",topic:"history",q:"Who is credited by legend with introducing hand-fighting discipline to the Shaolin Temple, and roughly when?",a:"Bodhidharma (Daruma), a Buddhist monk, arriving around 520 AD.",short:"Bodhidharma (Daruma), around 520 AD",kind:"name",hook:"Daruma is remembered for the same theme running through this whole chapter: physical and mental discipline through hardship."},
{id:"or05",topic:"history",q:"What elite warrior corps was formed during the reign of Chin Heung, 24th King of Silla?",a:"The Hwa Rangdo.",short:"Hwa Rangdo"},
{id:"or06",topic:"history",q:"Who set forth the five-point code of conduct followed by the Hwa Rangdo?",a:"The Buddhist monk and scholar Won Kang.",short:"Won Kang",kind:"name"},
{id:"or07",topic:"history",q:"List the five points of the Hwa Rangdo code of conduct.",a:"Be loyal to your king; be obedient to your parents; be honourable to your friends; never retreat in battle; make a just kill.",short:"Loyalty to king, obedience to parents, honour to friends, never retreat, just kill",mcOnly:true,hook:"Five short commandments — loyalty outward, honour inward, courage in battle."},
{id:"or08",topic:"history",q:"In Greek history, what was pancratium?",a:"A fighting system combining wrestling and boxing (originally combined with shadow-boxing, \"skiamachia\"), in which the whole body was used as a weapon.",short:"Combined wrestling and boxing, whole body as weapon",mcOnly:true},
{id:"or09",topic:"history",q:"By roughly what date does evidence show Egyptians practising a form of open hand fighting similar to boxing?",a:"About 3,000 BC, per mural paintings and hieroglyphic inscriptions.",short:"About 3,000 BC",kind:"number"},
{id:"mc01",topic:"philosophy",q:"What is the Korean term for Moral Culture?",a:"Jungshin Sooyang.",short:"Jungshin Sooyang",kind:"korean"},
{id:"mc02",topic:"philosophy",q:"List the five virtues recognised since ancient times, per the Moral Culture chapter.",a:"Humanity, Righteousness, Propriety, Wisdom, and Trust.",short:"Humanity, Righteousness, Propriety, Wisdom, Trust",mcOnly:true,hook:"Same five as the qualities of a virtuous person elsewhere in the book — one consistent list."},
{id:"mc03",topic:"philosophy",q:"What is the Korean term for Humanity (one of the five virtues)?",a:"In.",short:"In",kind:"korean"},
{id:"mc04",topic:"philosophy",q:"What is the Korean term for Righteousness?",a:"Ui.",short:"Ui",kind:"korean"},
{id:"mc05",topic:"philosophy",q:"What is the Korean term for Propriety?",a:"Ye.",short:"Ye",kind:"korean"},
{id:"mc06",topic:"philosophy",q:"What is the Korean term for Wisdom (one of the five virtues)?",a:"Ji.",short:"Ji",kind:"korean"},
{id:"mc07",topic:"philosophy",q:"What is the Korean term for Trust?",a:"Shin.",short:"Shin",kind:"korean"},
{id:"mc08",topic:"philosophy",q:"According to Confucius, virtue is like what?",a:"The north star — all the other stars revolve around it in an orderly fashion.",short:"The north star",kind:"phrase",hook:"Fixed and central — everything else orbits around it, just like virtue anchors character."},
{id:"mc09",topic:"philosophy",q:"What analogy did Mencius use to argue that man is basically good?",a:"Even a ruthless robber, seeing an innocent child about to fall into a well, will instinctively try to save it — forgetting his intention to rob the house.",short:"Robber saving a child from a well",mcOnly:true},
{id:"pf01",topic:"physical_fitness",q:"What increased-ventilation effect does Taekwon-Do training produce, and name two of its benefits?",a:"An aerobic effect — benefits include helping the lungs operate more efficiently, enlarging blood vessels, increasing red blood cell/haemoglobin supply, conditioning the heart, and promoting better sleep.",short:"Aerobic effect — e.g. more efficient lungs, better blood supply",mcOnly:true,hook:"\"Aero\" = air — literally training your body to use air better."},
{id:"pf02",topic:"physical_fitness",q:"Roughly how many calories does a vigorous hour of Taekwon-Do training burn?",a:"About 600 calories per hour.",short:"About 600 calories",kind:"number",hook:"600 — one of the highest burn rates of any sport, according to the book."},
{id:"pf03",topic:"physical_fitness",q:"How many calories does the book say it takes to lose one pound of body weight?",a:"About 3,500 calories.",short:"About 3,500 calories",kind:"number"},
{id:"pf04",topic:"physical_fitness",q:"List three of Moloy's eight characteristics of good sports performance that Taekwon-Do develops.",a:"Any three of: muscular strength, dynamic energy, ability to change direction, agility, flexibility, peripheral vision, concentration, understanding of body mechanics.",short:"Muscular strength, dynamic energy, agility",mcOnly:true},
{id:"pf05",topic:"physical_fitness",q:"Besides demoralising an opponent, what physiological purpose does the Taekwon-Do \"Yell\" serve?",a:"It tightens the lower abdominal muscles to prevent injury from a counter-attack, and the exhalation equalises pressure in the thorax, protecting the vital organs.",short:"Tightens abdomen, equalises thoracic pressure, protects organs",mcOnly:true,hook:"Same principle as a weightlifter's grunt — a forced exhale that braces the body."},
{id:"cp01",topic:"competition",q:"What is the Korean term for Competition?",a:"KyongGi.",short:"KyongGi",kind:"korean"},
{id:"cp02",topic:"competition",q:"Give two reasons full-contact sparring with complete protective equipment is considered unfeasible in Taekwon-Do competition.",a:"Any two of: it would require covering the whole body like medieval armour; it would restrict freedom of movement; attacking tools like the knife-hand or fingertips couldn't be used with gloves; it would remove pain as a training and reflex aid; it would exclude women, seniors, and those with disabilities from competing.",short:"Restricts movement, limits attacking tools, removes pain-driven reflexes",mcOnly:true},
{id:"cp03",topic:"competition",q:"What four related tests might a full assessment of a student's skill include, and what does each measure?",a:"Sparring (courage, aggressiveness, accuracy, speed); patterns (balance, characteristic beauty, concentration); breaking (power); special techniques (coordination, acrobatic skill, resolve).",short:"Sparring, patterns, breaking, special techniques",mcOnly:true},
{id:"cp04",topic:"competition",q:"In official ITF competition, individual and team match participation is reserved for which degrees?",a:"4th degree and below.",short:"4th degree and below",kind:"number"},
{id:"cp05",topic:"competition",q:"How many regular competitors make up a team in competition, plus how many reserves?",a:"Five regular competitors, plus one reserve.",short:"5 regular, 1 reserve",kind:"number"},
{id:"dm01",topic:"competition",q:"What is the Korean term for Demonstration?",a:"Sibum.",short:"Sibum",kind:"korean"},
