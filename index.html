{id:"dm02",topic:"competition",q:"What breaking method is absolutely prohibited in Taekwon-Do?",a:"Breaking with the forehead.",short:"Breaking with the forehead",kind:"phrase",hook:"The head is a vital spot everywhere else in the book — breaking with it contradicts everything else taught."},
{id:"dm03",topic:"competition",q:"What is the real purpose of breaking demonstrations, according to the book?",a:"To prove the power of each blow, both to the spectators and to the student themselves — not to use tricks or dishonest shortcuts.",short:"To prove the power of the blow, honestly",mcOnly:true},
{id:"dm04",topic:"competition",q:"During a demonstration, why should techniques be performed without rehearsal?",a:"Because a Taekwon-Do expert should be able to use techniques reflexively in real combat, so they should be shown to spectators immediately, without a rehearsed run-through.",short:"To show reflexive, real combat ability",mcOnly:true},
{id:"ht01",topic:"techniques",q:"Korean term for Obverse Punch?",a:"Baro Jirugi.",short:"Baro Jirugi",kind:"korean",hook:"Same side as the leading foot."},
{id:"ht02",topic:"techniques",q:"Korean term for Reverse Punch?",a:"Bandae Jirugi.",short:"Bandae Jirugi",kind:"korean",hook:"Opposite side to the leading foot — the classic power punch."},
{id:"ht03",topic:"techniques",q:"Korean term for Vertical Punch?",a:"Sewo Jirugi.",short:"Sewo Jirugi",kind:"korean",hook:"Fist rotated to strike vertically rather than horizontally."},
{id:"ht04",topic:"techniques",q:"Korean term for Upset Punch?",a:"Dwijibo Jirugi.",short:"Dwijibo Jirugi",kind:"korean",hook:"Dwijibo Jirugi shares Dwi with other rear-related terms, but here it means the fist is flipped upside-down, not reversed in direction."},
{id:"ht05",topic:"techniques",q:"Korean term for Angle Punch?",a:"Giokja Jirugi.",short:"Giokja Jirugi",kind:"korean",hook:"Struck at a diagonal angle, not straight."},
{id:"ht06",topic:"techniques",q:"Korean term for Knuckle Fist Punch?",a:"Songarak Joomuk Jirugi.",short:"Songarak Joomuk Jirugi",kind:"korean",hook:"Songarak Joomuk — \"Songarak\" = finger/knuckle, \"Joomuk\" = fist — a knuckle-first fist."},
{id:"ht07",topic:"techniques",q:"Korean term for Long Fist Punch?",a:"Ghin Joomuk Jirugi.",short:"Ghin Joomuk Jirugi",kind:"korean",hook:"Ghin Joomuk pairs long with fist — contrast it with Songarak Joomuk (knuckle fist), a completely different fist shape."},
{id:"ht08",topic:"techniques",q:"Korean term for Side Front Thrust?",a:"Yobap Tulgi.",short:"Yobap Tulgi",kind:"korean",hook:"Yobap Tulgi — \"Yobap\" = side, \"Tulgi\" = thrust, straight in from the side."},
{id:"ht09",topic:"techniques",q:"Korean term for Front Elbow Strike?",a:"Ap Palkup Taerigi.",short:"Ap Palkup Taerigi",kind:"korean",hook:"Ap Palkup — \"Ap\" = front, same root as Ap Joomuk (forefist)."},
{id:"ht10",topic:"techniques",q:"Korean term for Inward Strike?",a:"Anuro Taerigi.",short:"Anuro Taerigi",kind:"korean",hook:"Same \"Anuro\" root as inward blocks and kicks."},
{id:"ht11",topic:"techniques",q:"Korean term for Outward Strike?",a:"Bakuro Taerigi.",short:"Bakuro Taerigi",kind:"korean",hook:"Same \"Bakuro\" root as outward blocks and kicks."},
{id:"ht12",topic:"techniques",q:"Korean term for Side Downward Strike?",a:"Yop Naeryo Taerigi.",short:"Yop Naeryo Taerigi",kind:"korean",hook:"Yop Naeryo — \"Yop\" = side, \"Naeryo\" = downward, same root as the axe kick."},
{id:"ht13",topic:"techniques",q:"Korean term for Horizontal Strike?",a:"Soopyong Taerigi.",short:"Soopyong Taerigi",kind:"korean",hook:"Soopyong — a flat, level word for a flat, level strike."},
{id:"ht14",topic:"techniques",q:"Korean term for Front Strike?",a:"Ap Taerigi.",short:"Ap Taerigi",kind:"korean",hook:"Ap Taerigi — \"Ap\" = front, same root recurring across the whole hand-technique list."},
{id:"ht15",topic:"techniques",q:"Korean term for Crescent Strike?",a:"Bandal Taerigi.",short:"Bandal Taerigi",kind:"korean",hook:"Bandal literally translates to half-moon — the strike traces that same crescent arc."},
{id:"ht16",topic:"techniques",q:"Korean term for Side Back Strike?",a:"Yopdwi Taerigi.",short:"Yopdwi Taerigi",kind:"korean",hook:"Yopdwi — \"Yop\" (side) + \"dwi\" (back) fused into one direction."},
{id:"ht17",topic:"techniques",q:"Korean term for Low Block?",a:"Najunde Makgi.",short:"Najunde Makgi",kind:"korean",hook:"Same \"Najunde\" root as the low section term."},
{id:"ht18",topic:"techniques",q:"Korean term for High Block?",a:"Nopunde Makgi.",short:"Nopunde Makgi",kind:"korean",hook:"Same \"Nopunde\" root as the high section term."},
{id:"ht19",topic:"techniques",q:"Korean term for Outward Block?",a:"Bakuro Makgi.",short:"Bakuro Makgi",kind:"korean",hook:"Bakuro Makgi — same \"Bakuro\" (outward) root as Bakuro Taerigi and Bakuro Chagi."},
{id:"ht20",topic:"techniques",q:"Korean term for Rising Block?",a:"Chookyo Makgi.",short:"Chookyo Makgi",kind:"korean",hook:"Chookyo Makgi is the only block in this list that rises to guard the head — the opposite direction to Naeryo Chagi (downward kick)."},
{id:"ht21",topic:"techniques",q:"Korean term for Double Forearm Block?",a:"Doo Palmok Makgi.",short:"Doo Palmok Makgi",kind:"korean",hook:"\"Doo\" = two/double, same as elsewhere in the book."},
{id:"ht22",topic:"techniques",q:"Korean term for Wedging Block?",a:"Hechyo Makgi.",short:"Hechyo Makgi",kind:"korean",hook:"Hechyo Makgi splits two tools apart — picture the opposite motion to Doo Palmok Makgi, which brings both forearms together."},
{id:"ht23",topic:"techniques",q:"Korean term for Scooping Block?",a:"Duro Makgi.",short:"Duro Makgi",kind:"korean",hook:"Duro Makgi scoops upward and under — distinct from Golcho Makgi (hooking block), which catches and pulls instead."},
{id:"ht24",topic:"techniques",q:"Korean term for Hooking Block?",a:"Golcho Makgi.",short:"Golcho Makgi",kind:"korean",hook:"Golcho Makgi hooks and pulls the opponent's attack — contrast with Duro Makgi, which scoops rather than hooks."},
{id:"ht25",topic:"techniques",q:"Korean term for Pushing Block?",a:"Miro Makgi.",short:"Miro Makgi",kind:"korean",hook:"Miro Makgi pushes the attack away rather than striking it — the gentlest of the block names in this list."},
{id:"ht26",topic:"techniques",q:"Korean term for Twin Knife-Hand Block?",a:"Sang Sonkal Makgi.",short:"Sang Sonkal Makgi",kind:"korean",hook:"\"Sang\" = twin/paired, appearing wherever two tools work together."},
{id:"ht27",topic:"techniques",q:"Korean term for Circular Block?",a:"Dollimyo Makgi.",short:"Dollimyo Makgi",kind:"korean",hook:"Dollimyo Makgi shares its Dolli root with Dollyo Chagi (turning kick) — both describe a circular, rotating motion."},
{id:"ft01",topic:"techniques",q:"Korean term for High Kick?",a:"Nopunde Chagi.",short:"Nopunde Chagi",kind:"korean",hook:"Nopunde — same root as the High Section term already learned."},
{id:"ft02",topic:"techniques",q:"Korean term for Middle Kick?",a:"Kaunde Chagi.",short:"Kaunde Chagi",kind:"korean",hook:"Kaunde — same root as the Middle Section term."},
{id:"ft03",topic:"techniques",q:"Korean term for Low Kick?",a:"Najunde Chagi.",short:"Najunde Chagi",kind:"korean",hook:"Najunde — same root as the Low Section term and Low Block."},
{id:"ft04",topic:"techniques",q:"Korean term for Front Snap Kick?",a:"Apcha Busigi.",short:"Apcha Busigi",kind:"korean",hook:"Apcha Busigi — \"Ap\" = front, \"Busigi\" = snap — the classic front snap kick."},
{id:"ft05",topic:"techniques",q:"Korean term for Side Piercing Kick?",a:"Yopcha Jirugi.",short:"Yopcha Jirugi",kind:"korean",hook:"Yopcha Jirugi — \"Yop\" = side, \"Jirugi\" = piercing thrust."},
{id:"ft06",topic:"techniques",q:"Korean term for Side Thrusting Kick?",a:"Yopcha Tulgi.",short:"Yopcha Tulgi",kind:"korean",hook:"Yopcha Tulgi — same side root, \"Tulgi\" = thrust, a close cousin of the piercing kick."},
{id:"ft07",topic:"techniques",q:"Korean term for Side Pushing Kick?",a:"Yopcha Milgi.",short:"Yopcha Milgi",kind:"korean",hook:"Yopcha Milgi shares Milgi with Miro Makgi (pushing block) — both describe a push rather than a strike."},
{id:"ft08",topic:"techniques",q:"Korean term for Back Piercing Kick?",a:"Dwitcha Jirugi.",short:"Dwitcha Jirugi",kind:"korean",hook:"Dwitcha Jirugi — \"Dwit\" = rear/back, same root as Dwitbal (rear-foot stance)."},
{id:"ft09",topic:"techniques",q:"Korean term for Back Snap Kick?",a:"Dwitcha Busigi.",short:"Dwitcha Busigi",kind:"korean",hook:"Dwitcha Busigi — same \"Busigi\" (snap) root as the front snap kick, aimed backward."},
{id:"ft10",topic:"techniques",q:"Korean term for Turning Kick?",a:"Dollyo Chagi.",short:"Dollyo Chagi",kind:"korean",hook:"Dollyo Chagi shares its Dolli root with Dollimyo Makgi (circular block) — one's a kick, one's a block, same rotating idea."},
{id:"ft11",topic:"techniques",q:"Korean term for Side Turning Kick?",a:"Yop Dollyo Chagi.",short:"Yop Dollyo Chagi",kind:"korean",hook:"Yop Dollyo — side version of the standard turning kick."},
{id:"ft12",topic:"techniques",q:"Korean term for Reverse Turning Kick?",a:"Bandae Dollyo Chagi.",short:"Bandae Dollyo Chagi",kind:"korean",hook:"Same \"Bandae\" (reverse/opposite) root as Reverse Punch."},
{id:"ft13",topic:"techniques",q:"Korean term for Reverse Hooking Kick?",a:"Bandae Dollyo Gorochagi.",short:"Bandae Dollyo Gorochagi",kind:"korean",hook:"Bandae Dollyo Gorochagi — reverse turning plus a hooking finish."},
{id:"ft14",topic:"techniques",q:"Korean term for Downward Kick?",a:"Naeryo Chagi.",short:"Naeryo Chagi",kind:"korean",hook:"The classic \"axe kick\" — Naeryo means downward."},
{id:"ft15",topic:"techniques",q:"Korean term for Upward Kick?",a:"Ollyo Chagi.",short:"Ollyo Chagi",kind:"korean",hook:"Ollyo Chagi is the direct opposite of Naeryo Chagi (downward kick) — learn the pair together, rising versus falling."},
{id:"ft16",topic:"techniques",q:"Korean term for Twisting Kick?",a:"Bituro Chagi.",short:"Bituro Chagi",kind:"korean",hook:"Bituro Chagi twists through the target — distinct from Dollyo Chagi's full turning rotation."},
{id:"ft17",topic:"techniques",q:"Korean term for Vertical Kick?",a:"Sewo Chagi.",short:"Sewo Chagi",kind:"korean",hook:"Same \"Sewo\" root as Vertical Punch."},
{id:"ft18",topic:"techniques",q:"Korean term for Pressing Kick?",a:"Noollo Chagi.",short:"Noollo Chagi",kind:"korean",hook:"Noollo Chagi presses down and holds rather than snapping back — a controlled, sustained kick unlike the sharper snap kicks."},
{id:"ft19",topic:"techniques",q:"Korean term for Outward Kick?",a:"Bakuro Chagi.",short:"Bakuro Chagi",kind:"korean",hook:"Bakuro Chagi — same outward root as the hand and block versions."},
{id:"ft20",topic:"techniques",q:"Korean term for Inward Kick?",a:"Anuro Chagi.",short:"Anuro Chagi",kind:"korean",hook:"Anuro Chagi — same inward root as the hand and block versions."},
{id:"ft21",topic:"techniques",q:"Korean term for Sweeping Kick?",a:"Suroh Chagi.",short:"Suroh Chagi",kind:"korean",hook:"Suroh — a sweeping sound for a sweeping kick."},
{id:"ft22",topic:"techniques",q:"Korean term for Stamping Kick?",a:"Cha Bapgi.",short:"Cha Bapgi",kind:"korean",hook:"Same idea as the stamping motion from Red Tag theory — \"Bapgi\" = stamp."},
{id:"ft23",topic:"techniques",q:"Korean term for Grasping Kick?",a:"Butjapgo Chagi.",short:"Butjapgo Chagi",kind:"korean",hook:"Butjapgo Chagi is unique in this list — the only kick that grasps the target before completing the technique."},
{id:"ft24",topic:"techniques",q:"Korean term for Pick-Shape Kick?",a:"Gokaeng-I Chagi.",short:"Gokaeng-I Chagi",kind:"korean",hook:"Gokaeng-I — named for its hook/pick shape, like a small pickaxe."},
{id:"ft25",topic:"techniques",q:"Korean term for Double Kick?",a:"I-Jung Chagi.",short:"I-Jung Chagi",kind:"korean",hook:"Same \"I-Jung\" root (double) as elsewhere in the syllabus."},
{id:"ft26",topic:"techniques",q:"Korean term for Triple Kick?",a:"Samjung Chagi.",short:"Samjung Chagi",kind:"korean",hook:"\"Sam\" = three, the same number root as Sam-Il (March 1st, 3rd pattern set)."},
{id:"ft27",topic:"techniques",q:"Korean term for Flying Kick?",a:"Twimyo Chagi.",short:"Twimyo Chagi",kind:"korean",hook:"\"Twimyo\" appears on every flying technique — jump first, kick second."},
{id:"bt01",topic:"test",q:"How many sections make up ITA Black Belt Testing, and name them?",a:"Nine: Physical Competency, Fundamental Movements, Patterns, Step-Sparring, Free Sparring, Self Defence, Special Technique, Power Test, and Theory.",short:"9 sections: Physical Competency, Fundamental Movements, Patterns, Step-Sparring, Free Sparring, Self Defence, Special Technique, Power Test, Theory",mcOnly:true,hook:"Nine sections — same sacred number that keeps showing up throughout the grading system."},
{id:"bt02",topic:"test",q:"Which section must every candidate pass to be successful in ITA Black Belt Testing, regardless of other results?",a:"Patterns.",short:"Patterns",kind:"phrase",hook:"No matter what else goes right or wrong, Patterns is the one section with zero flexibility."},
{id:"bt03",topic:"test",q:"For Step-Sparring, Special Technique, and Power Test, how are candidates marked?",a:"On their strongest two of the three sections — candidates may attempt all three or just two of their choice.",short:"Strongest two of three sections",mcOnly:true},
{id:"bt04",topic:"test",q:"What happens if a candidate fails 3 sections of ITA Black Belt Testing?",a:"A partial pass — they are not promoted, but may re-test just the failed sections within the next 12 months.",short:"Partial pass — retest failed sections within 12 months",mcOnly:true,hook:"Three fails is the softer landing — a partial pass, not a full do-over."},
{id:"bt05",topic:"test",q:"What happens if a candidate's repeat test (after a partial pass) is also unsuccessful?",a:"They must repeat the full exam.",short:"Must repeat the full exam",mcOnly:true},
{id:"bt06",topic:"test",q:"What happens if a candidate fails 4 or more sections of ITA Black Belt Testing?",a:"A full re-test.",short:"Full re-test",mcOnly:true,hook:"Four fails skips the partial-pass option entirely — straight to a full re-test."},
{id:"bt07",topic:"test",q:"What must a candidate pass before applying for ITA Black Belt Testing?",a:"A preliminary black belt test in their own region.",short:"A regional preliminary black belt test",mcOnly:true},
{id:"bt08",topic:"test",q:"What four physical tests make up the Physical Competency section of ITA Black Belt Testing?",a:"A 10-second side piercing kick hold on each leg; 20 side piercing kicks each leg into a shield; 25 push-ups; 15 burpees.",short:"10-sec side kick hold, 20 side kicks, 25 push-ups, 15 burpees",mcOnly:true,hook:"The only section with a strength-and-conditioning flavour, before any technique is even shown."},
{id:"bt09",topic:"test",q:"In Patterns testing, how many times can a candidate be asked to repeat a single pattern?",a:"Up to a maximum of 3 performances.",short:"Up to 3 performances",kind:"number"},
{id:"bt10",topic:"test",q:"For 1st Kup black belt testing, which patterns must a candidate perform?",a:"The pattern of their own grade, plus three patterns designated by the narrator.",short:"Their own grade's pattern, plus 3 designated by the narrator",mcOnly:true},
{id:"bt11",topic:"test",q:"For 1st Degree and above, how many patterns does a candidate perform in testing?",a:"Three patterns of their own grade, plus two designated by the narrator.",short:"3 of their own grade, plus 2 designated",mcOnly:true},
{id:"bt12",topic:"test",q:"For candidates testing specifically for 6th Degree, how is the patterns requirement different?",a:"Two patterns of their own grade, plus three other patterns — rather than the usual three-plus-two split.",short:"2 of their own grade, plus 3 others",mcOnly:true,hook:"6th Degree flips the usual 3-and-2 split into 2-and-3 — worth remembering as the exception."},
{id:"bt13",topic:"test",q:"In Step-Sparring testing, how many types must each group perform?",a:"Two — every group performs 1-step sparring, plus either 2-step or 3-step (examiners may ask to see all types at their discretion).",short:"Two types: 1-step, plus 2-step or 3-step",mcOnly:true},
{id:"bt14",topic:"test",q:"In 3-step sparring, how much should a middle punch attack overlap the defender's front foot when measuring distance?",a:"Half (½) overlapping.",short:"Half (½) overlap",mcOnly:true},
{id:"bt15",topic:"test",q:"In 3-step sparring, how much should a high punch attack overlap the defender's front foot?",a:"Fully overlapping.",short:"Fully overlapping",mcOnly:true,hook:"High punch needs the longest reach, so it gets the fullest overlap of the four distances."},
{id:"bt16",topic:"test",q:"In 3-step sparring, how much should a knifehand outward strike attack overlap the defender's front foot?",a:"A quarter (¼) overlap.",short:"A quarter (¼) overlap",mcOnly:true},
{id:"bt17",topic:"test",q:"In 3-step sparring, how is distance set for a low front kick or downward knifehand attack?",a:"Stand approximately 1.5 feet away and go into ready position, rather than overlapping the foot.",short:"Stand about 1.5 feet away",mcOnly:true},
{id:"bt18",topic:"test",q:"In 3-step sparring between partners of significantly different height, which stance should the taller person use?",a:"L-stance — the shorter partner uses walking stance instead.",short:"L-stance (taller); walking stance (shorter)",mcOnly:true},
{id:"bt19",topic:"test",q:"In 2-step sparring testing, how many hand and foot attacks are used on each occasion?",a:"One hand attack and one foot attack.",short:"One hand attack, one foot attack",mcOnly:true},
{id:"bt20",topic:"test",q:"For the self-defence and step-sparring sections of testing, are candidates allowed to bring their own partner?",a:"Yes — the partner must present in full dobok.",short:"Yes, in full dobok",mcOnly:true},
{id:"bt21",topic:"test",q:"How many attempts are given for the Special Technique (Tuk Gi) test?",a:"Two.",short:"Two attempts",kind:"number"},
{id:"bt22",topic:"test",q:"Is there a mark deduction if a Special Technique break succeeds only on the second attempt?",a:"No — there's no deduction if the break happens on the 2nd attempt.",short:"No deduction"},
{id:"bt23",topic:"test",q:"How many special techniques must a 1st Kup candidate perform, versus a 1st Degree candidate and above?",a:"1st Kup performs one technique of their choice; 1st Degree and above perform two.",short:"1st Kup: one; 1st Degree+: two",mcOnly:true},
{id:"bt24",topic:"test",q:"What thickness of timber is required for Special Technique breaking, for a senior versus a junior candidate?",a:"2cm for a senior candidate, 1cm for a junior candidate.",short:"2cm senior, 1cm junior",kind:"number"},
{id:"bt25",topic:"test",q:"How many attempts are given for the Power Test (Wi Ryok)?",a:"Two.",short:"Two attempts",kind:"number",hook:"Same allowance as Special Technique — two chances, no penalty for using the second."},
{id:"bt26",topic:"test",q:"What is the minimum timber board thickness for the Power Test, unless stated otherwise?",a:"20mm.",short:"20mm",kind:"number"},
{id:"bt27",topic:"test",q:"In the Power Test, how many boards must a Male Senior break for hand technique, and for foot technique?",a:"Two white boards for hand technique, and two for foot technique.",short:"2 boards hand, 2 boards foot",mcOnly:true},
{id:"bt28",topic:"test",q:"In the Power Test, what does a Female Junior break for hand technique?",a:"One white board (or one 1cm-thick timber board, supplied by the candidate).",short:"1 board, 1cm thick",mcOnly:true},
{id:"bt29",topic:"test",q:"Per the ITA theory guidelines, when can marks be deducted in the theory section regardless of the answer's substance?",a:"If candidates don't know their Korean terminology in the fundamentals and kicking sections of the grading.",short:"Not knowing Korean terminology in fundamentals/kicking",mcOnly:true,hook:"A separate penalty from getting the theory wrong — not knowing the Korean names costs marks on its own."},
{id:"bt30",topic:"test",q:"What standard is expected of theory for candidates testing for 4th Dan and higher, and why?",a:"An exemplary level across all aspects of ITF Taekwon-Do — because those promoted to this level become examiners for the ITA.",short:"Exemplary — 4th Dan+ become examiners themselves",mcOnly:true,hook:"The stakes rise at 4th Dan because you stop being tested on theory and start being the one who tests it."},
{id:"st17",topic:"stance",q:"Korean term for One-Leg Stance?",a:"Waebal Sogi.",short:"Waebal Sogi",kind:"korean",hook:"Waebal Sogi is the only stance in the list performed balanced on a single leg.",kup:1},
{id:"st18",topic:"stance",q:"Korean term for Bending Ready Stance?",a:"Goboryo Junbi Sogi.",short:"Goboryo Junbi Sogi",kind:"korean",hook:"A specific ready posture used before certain black belt combinations — distinct from the general \"Junbi Sogi\" (ready stance) idea.",kup:1},
{id:"tm33",topic:"terminology",q:"Korean term for U-shaped Block?",a:"Digutcha Makgi.",short:"Digutcha Makgi",kind:"korean",hook:"\"Digut\" refers to the Korean letter shaped like a U — the block traces that same shape.",kup:1},
{id:"tm34",topic:"terminology",q:"Korean term for U-shape Punch?",a:"Digutja Jirugi.",short:"Digutja Jirugi",kind:"korean",hook:"Same \"Digut\" (U-shape) root as Digutcha Makgi, but here applied to a punch instead of a block.",kup:1},
{id:"tm35",topic:"terminology",q:"Korean term for Checking Block?",a:"Momchau Makgi.",short:"Momchau Makgi",kind:"korean",hook:"\"Momchau\" means to stop or check — pair it with Momchau Chagi, the checking kick.",kup:1},
{id:"tm36",topic:"terminology",q:"Korean term for Checking Kick?",a:"Momchau Chagi.",short:"Momchau Chagi",kind:"korean",hook:"Shares its \"Momchau\" (checking/stopping) root with Momchau Makgi — same idea, applied to the foot.",kup:1},
{id:"tm37",topic:"terminology",q:"Korean term for W-shape (mountain-shape) Block?",a:"San Makgi.",short:"San Makgi",kind:"korean",hook:"\"San\" means mountain — the block's silhouette echoes a jagged mountain range.",kup:1},
{id:"tm38",topic:"terminology",q:"Korean term for Nine-shape Block?",a:"Ghutja Makgi.",short:"Ghutja Makgi",kind:"korean",kup:1},
{id:"tm39",topic:"terminology",q:"Korean term for Double Arc-hand Block?",a:"Doobandalson Makgi.",short:"Doobandalson Makgi",kind:"korean",hook:"\"Doo\" (double) plus \"Bandalson\" (arc-hand) — the same \"Doo\" root as Doo Palmok Makgi (double forearm block).",kup:1},
{id:"tm40",topic:"terminology",q:"What does the tool name \"Sondung\" refer to?",a:"The back of the hand, used as a striking surface (backhand).",short:"Back of the hand (backhand)",kind:"phrase",hook:"\"Son\" = hand, \"dung\" = back — the same \"dung\" root as Dung Joomuk (back fist).",kup:1},
{id:"tm41",topic:"terminology",q:"What does the modifier \"Sun\" mean when paired with a tool, as in Sun Palkup?",a:"Straight — Sun Palkup means a straight elbow strike.",short:"Straight (as in Sun Palkup, straight elbow)",kind:"phrase",kup:1},
{id:"tm42",topic:"terminology",q:"Korean term for shifting the stance forward (advancing without a full step)?",a:"Jajunbal Nagagi.",short:"Jajunbal Nagagi",kind:"korean",kup:1},
{id:"tm43",topic:"terminology",q:"Korean term for double stepping (two small steps before a technique)?",a:"Omgyo Didigi.",short:"Omgyo Didigi",kind:"korean",hook:"Distinct from Ibo (two-step sparring) — this is a footwork adjustment within a single technique, not a sparring format.",kup:1},
{id:"cb101",topic:"combinations",dan:1,q:"What does this call-out mean, and what should you do?<br><br><span style=\"font-style:italic;color:var(--accent);\">Naeryo Chagi from back leg, Yop Cha Jirugi, Gojung so Digutcha Makgi</span>",a:"Downward kick from back leg, side piercing kick (same leg) stepping forward into fixed stance, U-shaped block. (1st Kup testing for 1st Degree, combination #1)",short:"Downward kick from back leg, side piercing kick (same leg) stepping forward into fixed stance, U-shaped block",keywords:["downward kick","side piercing kick","u-shaped block"],korean:"Naeryo Chagi from back leg, Yop Cha Jirugi, Gojung so Digutcha Makgi"},
{id:"cb102",topic:"combinations",dan:1,q:"What does this call-out mean, and what should you do?<br><br><span style=\"font-style:italic;color:var(--accent);\">Gunnun so Kaunde Ap cha Busugi, Kaunde Baro Ap Joomok Jirugi & Kaunde Bandae Jirugi Barun Tongjak</span>",a:"Walking stance middle front snap kick, obverse then reverse middle front punch, in fast motion. (1st Kup testing for 1st Degree, combination #2)",short:"Walking stance middle front snap kick, obverse then reverse middle front punch, in fast motion",keywords:["front snap kick","reverse punch","fast motion"],korean:"Gunnun so Kaunde Ap cha Busugi, Kaunde Baro Ap Joomok Jirugi & Kaunde Bandae Jirugi Barun Tongjak"},
{id:"cb103",topic:"combinations",dan:1,q:"What does this call-out mean, and what should you do?<br><br><span style=\"font-style:italic;color:var(--accent);\">Bandae Dollyo Chagi, Annun so Kaunde Sonkal Yop Taerigi, Balbgi Tongjak, then Dwiro Tora</span>",a:"Reverse turning kick, sitting stance middle knifehand side strike performed with stamping motion, then turn about. (1st Kup testing for 1st Degree, combination #3)",short:"Reverse turning kick, sitting stance middle knifehand side strike performed with stamping motion, then turn about",keywords:["reverse turning kick","knifehand side strike","stamping motion"],korean:"Bandae Dollyo Chagi, Annun so Kaunde Sonkal Yop Taerigi, Balbgi Tongjak, then Dwiro Tora"},
{id:"cb104",topic:"combinations",dan:1,q:"What does this call-out mean, and what should you do?<br><br><span style=\"font-style:italic;color:var(--accent);\">I-jung Yop Cha Jirugi, Niunja so Kaunde Sonkal Daebi Makgi</span>",a:"Double side piercing kick, step into L-stance performing middle knifehand guarding block. (1st Kup testing for 1st Degree, combination #4)",short:"Double side piercing kick, step into L-stance performing middle knifehand guarding block",keywords:["double side piercing kick","knifehand guarding block"],korean:"I-jung Yop Cha Jirugi, Niunja so Kaunde Sonkal Daebi Makgi"},
{id:"cb105",topic:"combinations",dan:1,q:"What does this call-out mean, and what should you do?<br><br><span style=\"font-style:italic;color:var(--accent);\">Gunnun so Kyocha Joomok Noollo Makgi, Sang Joomuk Sewo Jirugi, Yonsok Tongjak</span>",a:"Walking stance x-fist pressing block, vertical punch with twin fist, performed with continuous motion. (1st Kup testing for 1st Degree, combination #5)",short:"Walking stance x-fist pressing block, vertical punch with twin fist, performed with continuous motion",keywords:["x-fist pressing block","vertical punch","continuous motion"],korean:"Gunnun so Kyocha Joomok Noollo Makgi, Sang Joomuk Sewo Jirugi, Yonsok Tongjak"},

{id:"cb107",topic:"combinations",dan:1,q:"What does this call-out mean, and what should you do?<br><br><span style=\"font-style:italic;color:var(--accent);\">Yop Cha Jirugi, Bandae Dollyo Goro Chagi, Twigi Kyocha so Nopunde Dung Joomok Yop Taerigi</span>",a:"Side piercing kick (kicking from the back leg, moving forward), reverse hooking kick, jump forward into x-stance with a high side strike using the back fist. (1st Kup testing for 1st Degree, combination #7)",short:"Side piercing kick (kicking from the back leg, moving forward), reverse hooking kick, jump forward into x-stance with a high side strike using the back fist",keywords:["side piercing kick","reverse hooking kick","back fist"],korean:"Yop Cha Jirugi, Bandae Dollyo Goro Chagi, Twigi Kyocha so Nopunde Dung Joomok Yop Taerigi"},
{id:"cb108",topic:"combinations",dan:1,q:"What does this call-out mean, and what should you do?<br><br><span style=\"font-style:italic;color:var(--accent);\">Dollyo Chagi, Twio Dolmyo Yop Dollyo Chagi (360 degree), Niunja so Kaunde Bakat Palmok Daebi Makgi</span>",a:"Turning kick, place the foot forward then jumping 360-degree turning kick, L-stance middle forearm guarding block. (1st Kup testing for 1st Degree, combination #8)",short:"Turning kick, place the foot forward then jumping 360-degree turning kick, L-stance middle forearm guarding block",keywords:["turning kick","360","forearm guarding block"],korean:"Dollyo Chagi, Twio Dolmyo Yop Dollyo Chagi (360 degree), Niunja so Kaunde Bakat Palmok Daebi Makgi"},
{id:"cb201",topic:"combinations",dan:2,q:"What does this call-out mean, and what should you do?<br><br><span style=\"font-style:italic;color:var(--accent);\">Gunnun So Kaunde Doo Palmok Makgi, Gunnun so Najunde Bakat Palmok Bandae Makgi, Annun So Dung Joomok Ap Taerigi</span>",a:"Walking stance middle double forearm block, maintaining the stance execute a low outer forearm reverse block, pivot to sitting stance and execute a front strike with the backfist. (1st Degree testing for 2nd Degree, combination #1)",short:"Walking stance middle double forearm block, maintaining the stance execute a low outer forearm reverse block, pivot to sitting stance and execute a front strike with the backfist",keywords:["double forearm block","reverse block","backfist"],korean:"Gunnun So Kaunde Doo Palmok Makgi, Gunnun so Najunde Bakat Palmok Bandae Makgi, Annun So Dung Joomok Ap Taerigi"},
{id:"cb202",topic:"combinations",dan:2,q:"What does this call-out mean, and what should you do?<br><br><span style=\"font-style:italic;color:var(--accent);\">Najunde Bituro Chagi, Gunnun so Ap Palkup Bandae Taerigi, then Dwiro Toro</span>",a:"Low twisting kick, step forwards into walking stance executing a front reverse elbow strike, then turn about. (1st Degree testing for 2nd Degree, combination #2)",short:"Low twisting kick, step forwards into walking stance executing a front reverse elbow strike, then turn about",keywords:["low twisting kick","elbow strike"],korean:"Najunde Bituro Chagi, Gunnun so Ap Palkup Bandae Taerigi, then Dwiro Toro"},

{id:"cb206",topic:"combinations",dan:2,q:"What does this call-out mean, and what should you do?<br><br><span style=\"font-style:italic;color:var(--accent);\">Gunnun so Ibo Omgyo Didigi, Nopunde Sonbadak Golcho Makgi, Nachuo so Nopunde Opun Sonkut Bandae Tulgi, then Dwiro Tora</span>",a:"Walking stance double stepping high obverse hooking block, step back to low stance and execute high reverse flat fingertip thrust, then turn about. (1st Degree testing for 2nd Degree, combination #6)",short:"Walking stance double stepping high obverse hooking block, step back to low stance and execute high reverse flat fingertip thrust, then turn about",keywords:["hooking block","fingertip thrust"],korean:"Gunnun so Ibo Omgyo Didigi, Nopunde Sonbadak Golcho Makgi, Nachuo so Nopunde Opun Sonkut Bandae Tulgi, then Dwiro Tora"},

var LEVEL_BANDS = [
  {maxLevel:19, name:"Novice"},
  {maxLevel:39, name:"Advanced Beginner"},
  {maxLevel:59, name:"Competent"},
  {maxLevel:79, name:"Proficient"},
  {maxLevel:100, name:"Expert"}
];
function bandForLevel(levelNum){
  for(var i=0;i<LEVEL_BANDS.length;i++){ if(levelNum <= LEVEL_BANDS[i].maxLevel) return LEVEL_BANDS[i].name; }
  return LEVEL_BANDS[LEVEL_BANDS.length-1].name;
}

var LEVELS = [
  {label:"Level 1"}, {label:"Level 2"}, {label:"Level 3"}, {label:"Level 4"},
  {label:"Level 5"}, {label:"Level 6"}, {label:"Level 7"}, {label:"Level 8"},
  {label:"Level 9"}, {label:"Level 10"}, {label:"Level 11"}, {label:"Level 12"},
  {label:"Level 13"}, {label:"Level 14"}, {label:"Level 15"}, {label:"Level 16"},
  {label:"Level 17"}, {label:"Level 18"}, {label:"Level 19"}
];
var LEVEL_WEIGHTS = [2,2,2,2,3,3,3,4,4,5,15,20,30,40,50,60,70,80,90];
var XP_UNIT = 8;
var LEVEL_THRESHOLDS = (function(){
  var out = [0]; var sum = 0;
  for(var i=0;i<LEVEL_WEIGHTS.length;i++){ sum += LEVEL_WEIGHTS[i]*XP_UNIT; out.push(sum); }
  return out;
})();

var SESSION_SIZE = 6;
var STORAGE_KEY = "sohnjip-progress-v2";
var todayISO = function(){ return new Date().toISOString().slice(0,10); };
var daysBetween = function(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); };
var BOX_INTERVALS = [0,1,3,7,16,30];

function normalize(s){
  return (s||"").toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
}

function levenshtein(a,b){
  var m=a.length,n=b.length;
  var dp=[]; for(var i=0;i<=m;i++){dp.push([i]);}
  for(var j=0;j<=n;j++){dp[0][j]=j;}
  for(i=1;i<=m;i++){
    for(j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
    }
  }
  return dp[m][n];
}

var NUMBER_WORDS = {zero:"0",one:"1",two:"2",three:"3",four:"4",five:"5",six:"6",seven:"7",eight:"8",nine:"9",ten:"10",eleven:"11",twelve:"12",thirteen:"13",fourteen:"14",fifteen:"15",sixteen:"16",seventeen:"17",eighteen:"18",nineteen:"19",twenty:"20",thirty:"30",forty:"40",fifty:"50",sixty:"60",seventy:"70",eighty:"80",ninety:"90"};
function wordsToDigits(text){
  return text.split(" ").map(function(tok){ return NUMBER_WORDS.hasOwnProperty(tok) ? NUMBER_WORDS[tok] : tok; }).join(" ");
}

function checkTyped(input, card){
  var norm = normalize(input);
  if(!norm) return false;
  if(card.keywords){
    for(var k=0;k<card.keywords.length;k++){
      if(norm.indexOf(normalize(card.keywords[k])) === -1) return false;
    }
    return true;
  }
  // For "how many" style facts, accept the number itself (digit or word form),
  // regardless of the surrounding wording in the full short answer.
  if(card.kind === "number"){
    var shortConv = wordsToDigits(normalize(card.short));
    var digitGroups = shortConv.match(/\d+/g) || [];
    if(digitGroups.length === 1){
      var target = digitGroups[0];
      var inputConv = wordsToDigits(norm);
      var inputTokens = inputConv.split(/[^0-9]+/).filter(function(t){ return t.length>0; });
      if(inputTokens.indexOf(target) !== -1) return true;
    }
  }
  if(card.accept){
    for(var i=0;i<card.accept.length;i++){
      if(norm.indexOf(normalize(card.accept[i])) !== -1) return true;
    }
  }
  var shortNorm = normalize(card.short);
  if(norm === shortNorm) return true;
  // Accept a longer, more detailed answer as long as it contains the core correct answer.
  if(shortNorm.length >= 3 && norm.indexOf(shortNorm) !== -1) return true;
  if(shortNorm.length <= 24){
    var tolerance = Math.max(1, Math.floor(shortNorm.length/6));
    if(levenshtein(norm, shortNorm) <= tolerance) return true;
  }
  return false;
}

function buildOptions(card, pool){
  if(card.distractors && card.distractors.length){
    var opts = card.distractors.concat([card.short]);
    for(var i=opts.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = opts[i]; opts[i]=opts[j]; opts[j]=t;
    }
    return opts;
  }
  var others = pool.filter(function(c){ return c.id !== card.id && c.short !== card.short; });
  var cardKind = card.kind || "phrase";
  // Tiers of preference: same topic+kind, same kind, same topic, anything.
  var tierA = others.filter(function(c){ return c.topic === card.topic && (c.kind||"phrase") === cardKind; });
  var tierB = others.filter(function(c){ return (c.kind||"phrase") === cardKind && c.topic !== card.topic; });
  var tierC = others.filter(function(c){ return c.topic === card.topic && (c.kind||"phrase") !== cardKind; });
  var tierD = others.filter(function(c){ return c.topic !== card.topic && (c.kind||"phrase") !== cardKind; });
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  var ordered = shuffle(tierA).concat(shuffle(tierB)).concat(shuffle(tierC)).concat(shuffle(tierD));
  var picked = []; var usedShort = {};
  for(var i=0;i<ordered.length && picked.length<3;i++){
    var c = ordered[i];
    if(!usedShort[c.short] && c.short !== card.short){
      picked.push(c.short); usedShort[c.short]=1;
    }
  }
  while(picked.length<3){ picked.push("None of the above"); }
  var opts = picked.concat([card.short]);
  for(i=opts.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = opts[i]; opts[i]=opts[j]; opts[j]=t;
  }
  return opts;
}

function defaultState(){
  var cards = {};
  DATA.forEach(function(c){ cards[c.id] = {box:0, due: todayISO()}; });
  var enabledTopics = {};
  Object.keys(TOPICS).forEach(function(k){ enabledTopics[k] = true; });
  return {xp:0, streak:0, lastDate:null, cards:cards, enabledTopics:enabledTopics, gradeKey:"dan4", currentKup:0, patternDan:4};
}

function loadState(cb){
  if(window.storage){
    window.storage.get(STORAGE_KEY, false).then(function(res){
      if(!res || !res.value){ cb(defaultState()); return; }
      try{
        var parsed = JSON.parse(res.value);
        var base = defaultState();
        DATA.forEach(function(c){ if(parsed.cards && parsed.cards[c.id]) base.cards[c.id] = parsed.cards[c.id]; });
        base.xp = parsed.xp || 0;
        base.streak = parsed.streak || 0;
        base.lastDate = parsed.lastDate || null;
        if(parsed.enabledTopics){ Object.keys(parsed.enabledTopics).forEach(function(k){ if(base.enabledTopics.hasOwnProperty(k)) base.enabledTopics[k] = parsed.enabledTopics[k]; }); }
        base.gradeKey = parsed.gradeKey || "dan4";
        var opt = gradeOption(base.gradeKey);
        base.currentKup = opt.currentKup;
        base.patternDan = opt.patternDan;
        cb(base);
      }catch(e){ cb(defaultState()); }
    }).catch(function(){ cb(defaultState()); });
    return;
  }
  // Standalone fallback: use the browser's own localStorage (works with no Claude account,
  // no publish step — just opening the file directly in a browser).
  try{
    var raw = window.localStorage.getItem(STORAGE_KEY);
    if(!raw){ cb(defaultState()); return; }
    var parsed = JSON.parse(raw);
    var base = defaultState();
    DATA.forEach(function(c){ if(parsed.cards && parsed.cards[c.id]) base.cards[c.id] = parsed.cards[c.id]; });
    base.xp = parsed.xp || 0;
    base.streak = parsed.streak || 0;
    base.lastDate = parsed.lastDate || null;
    if(parsed.enabledTopics){ Object.keys(parsed.enabledTopics).forEach(function(k){ if(base.enabledTopics.hasOwnProperty(k)) base.enabledTopics[k] = parsed.enabledTopics[k]; }); }
    base.gradeKey = parsed.gradeKey || "dan4";
    var opt = gradeOption(base.gradeKey);
    base.currentKup = opt.currentKup;
    base.patternDan = opt.patternDan;
    cb(base);
  }catch(e){ cb(defaultState()); }
}

function saveState(state){
  if(window.storage){
    window.storage.set(STORAGE_KEY, JSON.stringify(state), false).catch(function(){});
    return;
  }
  try{ window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function resetProgress(){
  var cards = {};
  DATA.forEach(function(c){ cards[c.id] = {box:0, due: todayISO()}; });
  state.cards = cards;
  state.xp = 0;
  state.streak = 0;
  state.lastDate = null;
  saveState(state);
}

var state = null;
var view = "loading";
var session = null;

function levelForXP(xp){
  var idx = 0;
  for(var i=0;i<LEVEL_THRESHOLDS.length;i++){ if(xp >= LEVEL_THRESHOLDS[i]) idx = i; }
  return Math.min(idx, LEVELS.length-1);
}

function isCardRelevant(c){
  if(state.enabledTopics[c.topic] === false) return false;
  if((c.kup||0) < state.currentKup) return false;
  if(c.topic === "patterns" && c.dan && c.dan > (state.patternDan - 1)) return false;
  if(c.topic === "combinations" && c.dan && c.dan !== state.patternDan) return false;
  return true;
}

function relevantCards(){
  return DATA.filter(isCardRelevant);
}

function relevantMasteryPercent(){
  var cards = relevantCards();
  if(cards.length === 0) return 0;
  var sum = 0;
  cards.forEach(function(c){ var p = state.cards[c.id]; sum += p ? p.box : 0; });
  return Math.round((sum/(cards.length*5))*100);
}

function bandForPercent(pct){
  for(var i=0;i<LEVEL_BANDS.length;i++){ if(pct <= LEVEL_BANDS[i].maxLevel) return LEVEL_BANDS[i].name; }
  return LEVEL_BANDS[LEVEL_BANDS.length-1].name;
}

function buildSession(){
  var today = todayISO();
  var due = [];
  var fresh = [];
  DATA.forEach(function(c){
    if(state.enabledTopics[c.topic] === false) return;
    if((c.kup||0) < state.currentKup) return;
    if(c.topic === "patterns" && c.dan && c.dan > (state.patternDan - 1)) return;
    if(c.topic === "combinations" && c.dan && c.dan !== state.patternDan) return;
    var prog = state.cards[c.id];
    if(!prog){ fresh.push(c); return; }
    if(prog.box === 0 && !prog._seenEver){ fresh.push(c); }
    else if(prog.due <= today){ due.push({card:c, box:prog.box}); }
  });
  due.sort(function(a,b){ return a.box - b.box; });
  var pool = due.map(function(x){return x.card;});
  var seen = {}; pool.forEach(function(c){seen[c.id]=1;});
  fresh.forEach(function(c){ if(!seen[c.id]) pool.push(c); });
  for(var i=pool.length-1;i>0;i--){
    if(Math.random()<0.35){
      var j = Math.floor(Math.random()*(i+1));
      var t = pool[i]; pool[i]=pool[j]; pool[j]=t;
    }
  }
  return pool.slice(0, SESSION_SIZE);
}

function topicMastery(topicKey){
  var items = DATA.filter(function(c){return c.topic===topicKey;});
  var total = items.length, sum = 0;
  items.forEach(function(c){ var p = state.cards[c.id]; sum += p ? p.box : 0; });
  return Math.round((sum/(total*5))*100);
}

function overallDueCount(){
  var today = todayISO();
  return DATA.filter(function(c){
    if(state.enabledTopics[c.topic] === false) return false;
    if((c.kup||0) < state.currentKup) return false;
    if(c.topic === "patterns" && c.dan && c.dan > (state.patternDan - 1)) return false;
    if(c.topic === "combinations" && c.dan && c.dan !== state.patternDan) return false;
    var p = state.cards[c.id]; return p && p.due <= today;
  }).length;
}

function anyTopicEnabled(){
  return Object.keys(state.enabledTopics).some(function(k){ return state.enabledTopics[k] !== false; });
}

function render(){
  var root = document.getElementById('root');
  if(view==="session" && session && session.idx >= session.queue.length){ view = "summary"; }
  if(view==="loading"){ root.innerHTML = ""; return; }
  if(view==="home"){ root.innerHTML = renderHome(); attachHomeHandlers(); return; }
  if(view==="session"){ root.innerHTML = renderSession(); attachSessionHandlers(); return; }
  if(view==="summary"){ root.innerHTML = renderSummary(); attachSummaryHandlers(); return; }
}

function progressBar(progressPct){
  return '<div style="flex:1;height:20px;border-radius:10px;overflow:hidden;position:relative;background:var(--ink-3);border:1px solid var(--line-strong);">'+
      '<div style="position:absolute;inset:0;background:repeating-linear-gradient(115deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 7px);"></div>'+
      '<div style="height:100%;width:'+progressPct+'%;background:linear-gradient(90deg, #4F8A0F, var(--accent));transition:width .4s ease;"></div>'+
    '</div>';
}

function renderHome(){
  var pct = relevantMasteryPercent();
  var band = bandForPercent(pct);
  var gradeLabel = gradeOption(state.gradeKey).label;
  var due = overallDueCount();
  var streakHTML = state.streak > 0
    ? '<span class="voice-caps" style="font-size:20px;font-weight:900;color:var(--accent);">'+state.streak+'</span> <span style="font-size:13px;color:var(--dobok-dim);">day streak</span>'
    : '<span style="font-size:13px;color:var(--dobok-faint);">Start a streak today</span>';

  var topicRows = Object.keys(TOPICS).map(function(k){
    var m = topicMastery(k);
    var on = state.enabledTopics[k] !== false;
    return '<div class="topic-row'+(on?"":" off")+'" style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);">'+
      '<button class="topic-toggle'+(on?" on":"")+'" data-topic="'+k+'"><span class="knob"></span></button>'+
      '<div style="flex:1;">'+
        '<div style="font-size:13.5px;font-weight:600;">'+TOPICS[k].name+'</div>'+
      '</div>'+
      '<div style="width:56px;height:5px;border-radius:3px;background:var(--ink-3);overflow:hidden;">'+
        '<div style="height:100%;width:'+m+'%;background:var(--accent);"></div>'+
      '</div>'+
      '<div style="font-size:11.5px;color:var(--dobok-faint);width:30px;text-align:right;">'+m+'%</div>'+
    '</div>';
  }).join("");

  return ''+
  '<div class="fade-in">'+
    '<div class="eyebrow">Sohn Jip &middot; Theory Progress</div>'+

function attachHomeHandlers(){
  var btn = document.getElementById('start-btn');
  if(btn) btn.onclick = function(){
    if(!anyTopicEnabled()) return;
    session = { queue: buildSession(), idx:0, answered:false, wasCorrect:false, selected:null, typedVal:"", typedErr:false, correct:0, xpGained:0, startXP: state.xp, startPct: relevantMasteryPercent(), retryQueue: [], options:null };
    if(session.queue.length===0){ return; }
    view = "session"; render();
  };
  document.querySelectorAll('.topic-toggle[data-topic]').forEach(function(el){
    el.onclick = function(){
      var k = el.getAttribute('data-topic');
      state.enabledTopics[k] = !(state.enabledTopics[k] !== false);
      saveState(state);
      render();
    };
  });
  var allOnBtn = document.getElementById('all-on-btn');
  if(allOnBtn) allOnBtn.onclick = function(){
    Object.keys(state.enabledTopics).forEach(function(k){ state.enabledTopics[k] = true; });
    saveState(state);
    render();
  };
  var allOffBtn = document.getElementById('all-off-btn');
  if(allOffBtn) allOffBtn.onclick = function(){
    Object.keys(state.enabledTopics).forEach(function(k){ state.enabledTopics[k] = false; });
    saveState(state);
    render();
  };
  var resetBtn = document.getElementById('reset-btn');
  if(resetBtn) resetBtn.onclick = function(){
    var ok = window.confirm("Reset all progress? This clears your XP, streak, level, and per-card history. Your grade and section settings stay as they are. This can't be undone.");
    if(ok){ resetProgress(); render(); }
  };
  var gradeSelect = document.getElementById('grade-select');
  if(gradeSelect) gradeSelect.onchange = function(){
    var opt = gradeOption(gradeSelect.value);
    state.gradeKey = opt.key;
    state.currentKup = opt.currentKup;
    state.patternDan = opt.patternDan;
    saveState(state);
    render();
  };

}

function renderSession(){
  if(!session || session.idx >= session.queue.length){
    view="summary"; return renderSummary();
  }
  var card = session.queue[session.idx];
  var total = session.queue.length;
  var dots = "";
  for(var i=0;i<total;i++){
    var st = i < session.idx ? "var(--accent)" : (i===session.idx ? "var(--dobok)" : "var(--line-strong)");
    dots += '<div style="width:6px;height:6px;border-radius:50%;background:'+st+';"></div>';
  }

  var useType = !card.mcOnly;
  var bodyHTML = "";

  if(!useType){
    if(!session.options) session.options = buildOptions(card, DATA);
    bodyHTML = session.options.map(function(opt, i){
      var cls = "opt";
      if(session.answered){
        if(opt === card.short) cls += " correct";
        else if(opt === session.selected) cls += " wrong";
        else cls += " dim";
      }
      return '<button class="'+cls+'" data-opt="'+i+'" '+(session.answered?"disabled":"")+'>'+opt+'</button>';
    }).join("");
  } else {
    var inputVal = session.typedVal || "";
    var inputCls = "type-input" + (session.answered ? (session.wasCorrect ? " correct" : " wrong") : "");
    bodyHTML = '<input type="text" id="type-input" class="'+inputCls+'" placeholder="Type your answer" value="'+inputVal.replace(/"/g,"&quot;")+'" '+(session.answered?"disabled":"")+' autocomplete="off">';
    if(session.typedErr){ bodyHTML += '<div class="err">Enter an answer first.</div>'; }
    if(session.answered){
      var resultCls = session.wasCorrect ? "correct" : "wrong";
      var resultText = session.wasCorrect ? "Correct" : "Incorrect";
      bodyHTML += '<div class="result-label '+resultCls+'">'+resultText+'</div>';
      if(!session.wasCorrect){
        bodyHTML += '<div class="opt wrong" style="margin-top:6px;">Correct answer: '+card.short+'</div>';
      }
    }
  }

  var explainHTML = session.answered
    ? '<div class="fade-in" style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line-strong);font-size:14.5px;line-height:1.5;color:var(--dobok-dim);">'+card.a+'</div>'
    : '';

  var hookHTML = (session.answered && !session.wasCorrect && card.hook)
    ? '<div class="fade-in" style="margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent-line);">'+
        '<div style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:4px;">Memory hook</div>'+
        '<div style="font-size:14px;line-height:1.5;color:var(--dobok);">'+card.hook+'</div>'+
      '</div>'
    : '';

  var speakTerm = (card.kind === "korean") ? card.short : (card.korean || null);
  var speakLabel = (card.kind === "korean") ? ('Hear \u201c'+speakTerm+'\u201d') : "Hear this combination";
  var speakHTML = (session.answered && speakTerm && ("speechSynthesis" in window))
    ? '<button id="speak-btn" data-term="'+speakTerm.replace(/"/g,"&quot;")+'" style="display:flex;align-items:center;gap:6px;margin-top:12px;padding:9px 14px;border-radius:10px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;">'+
        '<span style="font-size:15px;">&#128266;</span> '+speakLabel+
      '</button>'
    : '';

  var actionHTML = "";
  if(!session.answered){
    if(useType) actionHTML = '<button id="submit-btn" class="btn-primary" style="margin-top:16px;">Check answer</button>';
  } else {
    actionHTML = '<button id="continue-btn" class="btn-primary" style="margin-top:18px;">Continue</button>';
  }

  return ''+
  '<div class="fade-in">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;">'+
      '<button id="exit-btn" style="font-size:13px;color:var(--dobok);font-weight:600;">Exit</button>'+
      '<div style="display:flex;gap:5px;">'+dots+'</div>'+
      '<div style="width:28px;"></div>'+
    '</div>'+
    '<div class="eyebrow" style="margin-top:24px;">'+TOPICS[card.topic].name+'</div>'+
    '<div class="card" style="margin-top:10px;">'+
      '<div class="voice" style="font-size:19px;font-weight:600;line-height:1.4;">'+card.q+'</div>'+
      '<div style="margin-top:6px;">'+bodyHTML+'</div>'+
      explainHTML+
      hookHTML+
      speakHTML+
    '</div>'+
    actionHTML+
  '</div>';
}

function commitAnswer(correct){
  var card = session.queue[session.idx];
  var prog = state.cards[card.id] || {box:0, due: todayISO()};
  if(correct){
    prog.box = Math.min(prog.box+1, BOX_INTERVALS.length-1);
    session.correct++;
    session.xpGained += 10;
    state.xp += 10;
  } else {
    prog.box = 0;
    session.xpGained += 2;
    state.xp += 2;
    if(session.retryQueue.indexOf(card.id) === -1){
      session.queue.push(card);
      session.retryQueue.push(card.id);
    }
  }
  var interval = BOX_INTERVALS[prog.box];
  var d = new Date();
  d.setDate(d.getDate()+interval);
  prog.due = d.toISOString().slice(0,10);
  prog._seenEver = true;
  state.cards[card.id] = prog;
}

function attachSessionHandlers(){
  var exitBtn = document.getElementById('exit-btn');
  if(exitBtn) exitBtn.onclick = function(){ saveState(state); view="home"; render(); };

  var speakBtn = document.getElementById('speak-btn');
  if(speakBtn) speakBtn.onclick = function(){
    if(!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    var utter = new SpeechSynthesisUtterance(speakBtn.getAttribute('data-term'));
    utter.lang = "ko-KR";
    utter.rate = 0.8;
    var voices = window.speechSynthesis.getVoices();
    var koVoice = voices.find(function(v){ return v.lang === "ko-KR"; }) || voices.find(function(v){ return v.lang && v.lang.indexOf("ko") === 0; });
    if(koVoice) utter.voice = koVoice;
    window.speechSynthesis.speak(utter);
  };

  document.querySelectorAll('.opt[data-opt]').forEach(function(el){
    el.onclick = function(){
      if(session.answered) return;
      var card = session.queue[session.idx];
      var chosen = session.options[parseInt(el.getAttribute('data-opt'),10)];
      session.selected = chosen;
      session.wasCorrect = (chosen === card.short);
      session.answered = true;
      commitAnswer(session.wasCorrect);
      saveState(state);
      render();
    };
  });

  var submitBtn = document.getElementById('submit-btn');
  if(submitBtn) submitBtn.onclick = function(){
    var input = document.getElementById('type-input');
    var val = input ? input.value : "";
    if(!val || !val.trim()){
      session.typedErr = true; render(); return;
    }
    session.typedErr = false;
    session.typedVal = val;
    var card = session.queue[session.idx];
    session.wasCorrect = checkTyped(val, card);
    session.answered = true;
    commitAnswer(session.wasCorrect);
    saveState(state);
    render();
  };

  var typeInput = document.getElementById('type-input');
  if(typeInput){
    typeInput.focus();
    typeInput.oninput = function(){ session.typedVal = typeInput.value; };
    typeInput.onkeydown = function(e){ if(e.key==="Enter"){ var b=document.getElementById('submit-btn'); if(b) b.click(); } };
  }

  var continueBtn = document.getElementById('continue-btn');
  if(continueBtn) continueBtn.onclick = function(){
    session.idx++;
    session.answered=false; session.selected=null; session.typedVal=""; session.typedErr=false; session.options=null;
    render();
  };
}

function renderSummary(){
  var today = todayISO();
  if(state.lastDate !== today){
    var wasYesterday = state.lastDate && daysBetween(state.lastDate, today) === 1;
    state.streak = wasYesterday ? state.streak+1 : 1;
    state.lastDate = today;
    saveState(state);
  }
  var pctNow = relevantMasteryPercent();
  var bandNow = bandForPercent(pctNow);
  var bandBefore = bandForPercent(session.startPct);
  var bandChanged = bandNow !== bandBefore;

  var promoHTML = bandChanged
    ? '<div class="fade-in card" style="margin-top:16px;border-color:var(--accent-line);background:var(--accent-soft);text-align:center;">'+
        '<div class="eyebrow" style="color:var(--accent);">New tier reached</div>'+
        '<div class="voice-caps" style="font-size:22px;font-weight:900;margin-top:4px;">'+bandNow+'</div>'+
        '<div style="font-size:12.5px;color:var(--accent);font-weight:700;margin-top:2px;">'+pctNow+'% known</div>'+
        '<div style="font-size:11px;color:var(--dobok-faint);margin-top:6px;">Reflects recall of book content only</div>'+
      '</div>'
    : '';

  return ''+
  '<div class="fade-in" style="text-align:center;padding-top:20px;">'+
    '<div class="eyebrow">Session complete</div>'+
    '<div class="voice-caps" style="font-size:40px;font-weight:900;margin-top:10px;color:var(--accent);">+'+session.xpGained+'</div>'+
    '<div style="font-size:13px;color:var(--dobok-dim);margin-top:2px;">xp earned</div>'+
    '<div style="display:flex;gap:10px;margin-top:22px;">'+
      '<div class="card" style="flex:1;">'+
        '<div style="font-size:22px;font-weight:600;">'+session.correct+'/'+session.queue.length+'</div>'+
        '<div style="font-size:12px;color:var(--dobok-faint);margin-top:2px;">correct</div>'+
      '</div>'+
      '<div class="card" style="flex:1;">'+
        '<div style="font-size:22px;font-weight:600;">'+state.streak+'</div>'+
        '<div style="font-size:12px;color:var(--dobok-faint);margin-top:2px;">day streak</div>'+
      '</div>'+
    '</div>'+
    promoHTML+
    '<button id="again-btn" class="btn-primary" style="margin-top:24px;">Another round</button>'+
    '<button id="done-btn" class="btn-ghost" style="margin-top:10px;">Done for now</button>'+
  '</div>';
}

function attachSummaryHandlers(){
  var again = document.getElementById('again-btn');
  if(again) again.onclick = function(){
    session = { queue: buildSession(), idx:0, answered:false, wasCorrect:false, selected:null, typedVal:"", typedErr:false, correct:0, xpGained:0, startXP: state.xp, startPct: relevantMasteryPercent(), retryQueue: [], options:null };
    if(session.queue.length===0){ view="home"; render(); return; }
    view="session"; render();
  };
  var done = document.getElementById('done-btn');
  if(done) done.onclick = function(){ view="home"; render(); };
}

loadState(function(s){
  state = s;
  view = "home";
  render();
});

</script>
</body>
</html>
