<style>
  :root{
    --ink:#15171C;
    --ink-2:#1D2027;
    --ink-3:#262A33;
    --line: rgba(237,233,223,0.10);
    --line-strong: rgba(237,233,223,0.18);
    --dobok:#E7E3D6;
    --dobok-dim: rgba(231,227,214,0.90);
    --dobok-faint: rgba(231,227,214,0.70);
    --gold:#C79A3E;
    --gold-soft: rgba(199,154,62,0.16);
    --gold-line: rgba(199,154,62,0.45);
    --red:#A6433A;
    --red-soft: rgba(166,67,58,0.18);
    --green:#5C7A4F;
    --green-soft: rgba(92,122,79,0.18);
    --radius: 16px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--dobok);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .voice{font-family:'Fraunces',serif;}
  #root{max-width:480px;margin:0 auto;min-height:100vh;padding:20px 20px 40px;position:relative;}
  h1,h2,h3{margin:0;font-weight:600;}
  p{margin:0;}
  button{font-family:'Inter',sans-serif;cursor:pointer;border:none;background:none;color:inherit;}
  input[type=text]{font-family:'Inter',sans-serif;}
  .eyebrow{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--dobok-faint);font-weight:600;}
  .btn-primary{background:var(--gold);color:#241B0A;font-weight:700;font-size:15px;padding:15px 20px;border-radius:12px;width:100%;text-align:center;transition:transform .15s ease;}
  .btn-primary:active{transform:scale(0.97);}
  .btn-primary:disabled{opacity:0.4;}
  .btn-ghost{background:transparent;border:1px solid var(--line-strong);color:var(--dobok);font-weight:600;font-size:14px;padding:13px 18px;border-radius:12px;width:100%;text-align:center;}
  .btn-ghost:active{background:var(--ink-3);}
  .chip{padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid var(--line-strong);color:var(--dobok-dim);}
  .chip.active{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold);}
  .card{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
  .opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line-strong);background:var(--ink-3);font-size:14.5px;margin-top:9px;}
  .opt.correct{background:var(--green-soft);border-color:rgba(92,122,79,0.5);color:#D3E6C8;}
  .opt.wrong{background:var(--red-soft);border-color:rgba(166,67,58,0.5);color:#F0BDB6;}
  .opt.dim{opacity:0.45;}
  .type-input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line-strong);background:var(--ink-3);color:var(--dobok);font-size:15px;margin-top:14px;}
  .type-input:focus{outline:none;border-color:var(--gold-line);}
  .type-input.correct{background:var(--green-soft);border-color:rgba(92,122,79,0.6);color:#D3E6C8;}
  .type-input.wrong{background:var(--red-soft);border-color:rgba(166,67,58,0.6);color:#F0BDB6;}
  .result-label{font-size:13px;font-weight:700;margin-top:10px;letter-spacing:0.02em;}
  .result-label.correct{color:#8FC97D;}
  .result-label.wrong{color:#E29A92;}
  .err{font-size:12.5px;color:#F0BDB6;margin-top:6px;}
  .fade-in{animation:fadeIn .35s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  ::selection{background:var(--gold-soft);}
</style>

<script>

var TOPICS = {
  tenets: {name:"Tenets", kr:"Jungshin"},
  definition: {name:"Definition", kr:"Jung Eui"},
  composition: {name:"Composition", kr:"Goosung"},
  power: {name:"Theory of Power", kr:"Him Ui Wolli"},
  rank: {name:"System of Rank", kr:"Dan Gup Jedo"},
  test: {name:"Test", kr:"Simsa"},
  patterns: {name:"Patterns", kr:"Tul"},
  stance: {name:"Stance", kr:"Sogi"},
  tools: {name:"Attacking/Blocking Tools", kr:"Boowi"},
  vitals: {name:"Vital Spots", kr:"Kupso"},
  history: {name:"History", kr:"Yoksa"},
  philosophy: {name:"Philosophy", kr:"Chul Hak"}
};

var DATA = [
{id:"t01",topic:"tenets",q:"What are the five tenets of Taekwon-Do, in order?",a:"Courtesy, Integrity, Perseverance, Self-Control, Indomitable Spirit.",short:"Courtesy, Integrity, Perseverance, Self-Control, Indomitable Spirit",mcOnly:true,hook:"Acronym: C-I-P-S-I. \"Careful Instructors Praise Strong Individuals.\"",distractors:["Courtesy, Honesty, Perseverance, Self-Control, Indomitable Spirit","Courtesy, Integrity, Patience, Self-Control, Indomitable Spirit","Respect, Integrity, Perseverance, Self-Control, Fighting Spirit"]},
{id:"t02",topic:"tenets",q:"Korean term for the Tenets of Taekwon-Do as a whole?",a:"Taekwon-Do Jungshin.",short:"Taekwon-Do Jungshin",accept:["jungshin"],kind:"korean",hook:"Jungshin = whole spirit. Think \"genuine\" spirit — Jung-shin, genu-ine."},
{id:"t03",topic:"tenets",q:"Korean term for Courtesy?",a:"Ye Ui.",short:"Ye Ui",accept:["ye ui","yeui"],kind:"korean",hook:"Ye Ui — sounds like \"Yay, you!\" — the polite greeting."},
{id:"t04",topic:"tenets",q:"Korean term for Integrity?",a:"Yom Chi.",short:"Yom Chi",accept:["yom chi","yomchi"],kind:"korean",hook:"Yom Chi — think \"true chi\", your inner energy staying honest."},
{id:"t05",topic:"tenets",q:"Korean term for Perseverance?",a:"In Nae.",short:"In Nae",accept:["in nae","innae"],kind:"korean",hook:"In Nae — sounds like \"innate\" — perseverance as something built-in, not given up on."},
{id:"t06",topic:"tenets",q:"Korean term for Self-Control?",a:"Guk Gi.",short:"Guk Gi",accept:["guk gi","gukgi"],kind:"korean",hook:"Guk Gi — sounds like \"cookie\". Self-control = not eating the cookie."},
{id:"t07",topic:"tenets",q:"Korean term for Indomitable Spirit?",a:"Baekjul Boolgul.",short:"Baekjul Boolgul",accept:["baekjul","boolgul","boogul"],kind:"korean",hook:"Baekjul Boolgul — imagine a bull (\"bool\") charging at its goal, unbreakable."},
{id:"t08",topic:"tenets",q:"How many elements of courtesy does the encyclopaedia list for students to practise?",a:"Nine.",short:"Nine",accept:["nine","9"],kind:"number",hook:"Nine elements — same sacred number as the 9 Dan degrees (3×3)."},
{id:"t09",topic:"tenets",q:"Whose story illustrates Perseverance — learning from a spider before freeing Scotland?",a:"Robert the Bruce.",short:"Robert the Bruce",accept:["robert","bruce"],kind:"name",hook:"The spider spun its web six times before succeeding — try, try again."},
{id:"t10",topic:"tenets",q:"Lao-Tzu is quoted on Self-Control: the stronger is the person who wins over ___?",a:"Oneself, rather than someone else.",short:"Oneself",accept:["oneself","himself","yourself","self"],hook:"Lao-Tzu's line: beating your own reflection in the mirror matters more than beating others."},
{id:"t11",topic:"tenets",q:"What historical last stand illustrates Indomitable Spirit?",a:"Leonidas and the 300 Spartans at Thermopylae.",short:"Leonidas and the 300 Spartans",accept:["leonidas","300 spartans","spartans","thermopylae"],kind:"name",hook:"The film \"300\" — vastly outnumbered, still didn't yield. That's the image."},
{id:"t12",topic:"tenets",q:"Confucius is quoted on Indomitable Spirit — what does he call an act of cowardice?",a:"Failing to speak out against injustice.",short:"Failing to speak out against injustice",mcOnly:true,hook:"Staying silent while someone's wronged is itself framed as the coward's act.",distractors:["Losing a sparring match without complaint","Bowing incorrectly to a senior instructor","Forgetting the words of a pattern"]},
{id:"t13",topic:"tenets",q:"Name one example the text gives of an instructor lacking Integrity.",a:"Any of: misrepresenting techniques from lack of knowledge, camouflaging bad technique with a luxurious school or flattery, teaching for materialistic gain.",short:"Teaching for materialistic gain",mcOnly:true,hook:"Picture an instructor with dollar signs where the black belt should be.",distractors:["Training students too hard physically","Failing to demonstrate a technique perfectly","Losing to a lower grade in sparring"]},

{id:"d01",topic:"definition",q:"What does \"Tae\" mean?",a:"To jump or fly — to kick or smash with the foot.",short:"Jump or fly — kick with the foot",accept:["jump","fly","kick"],hook:"\"Tae\" — like \"take off\": leaping to kick."},
{id:"d02",topic:"definition",q:"What does \"Kwon\" mean?",a:"The fist — to punch or destroy with hand or fist.",short:"The fist — to punch",accept:["fist","punch"],hook:"\"Kwon\" — think Bruce Lee's fist, a striking \"Kwon\"."},
{id:"d03",topic:"definition",q:"What does \"Do\" mean?",a:"An art or way — the right way, built and paved by the sages of the past.",short:"An art or way",accept:["art","way"],hook:"\"Do\" — same suffix as Judo, Hapkido: \"the Way\", not just technique."},
{id:"d04",topic:"definition",q:"Taken together, what does \"Taekwon-Do\" indicate?",a:"The mental training and techniques of unarmed combat for self-defence and health.",short:"Mental training and unarmed combat techniques",mcOnly:true,hook:"Chain the three roots together: Tae (kick) + Kwon (fist) + Do (way) = the mental art of unarmed combat.",distractors:["Physical conditioning and weapons training","Meditation and armed combat techniques","Competitive sport and self-defence law"]},
{id:"d05",topic:"definition",q:"The encyclopaedia says the nearest description of Taekwon-Do is almost a ___?",a:"A cult.",short:"A cult",accept:["cult"],hook:"An oddly strong word choice — \"cult\" level devotion, not just a hobby."},
{id:"d06",topic:"definition",q:"What must always be stressed, to prevent Taekwon-Do being misused as a lethal weapon?",a:"Mental training.",short:"Mental training",accept:["mental training"],hook:"Same answer as what Tae+Kwon+Do point to together — the mental half of the art."},
{id:"d07",topic:"definition",q:"True or false — the text claims mastery lets you kill a wild bull bare-handed.",a:"False. It explicitly says that is not what mastery implies.",short:"False",accept:["false"],kind:"yesno",hook:"No bull — literally. A myth the book explicitly shoots down."},

{id:"c01",topic:"composition",q:"What five elements compose Taekwon-Do?",a:"Fundamental Movements, Patterns, Dallyon, Sparring, Self-Defence Techniques.",short:"Fundamental Movements, Patterns, Dallyon, Sparring, Self-Defence",mcOnly:true,hook:"Acronym: F-P-D-S-S. \"Fit Panthers Do Special Stunts.\"",distractors:["Fundamental Movements, Patterns, Meditation, Sparring, Self-Defence","Stances, Patterns, Dallyon, Sparring, Self-Defence","Fundamental Movements, Patterns, Dallyon, Competition, Self-Defence"]},
{id:"c02",topic:"composition",q:"Korean term for Composition of Taekwon-Do?",a:"Taekwon-Do Goosung.",short:"Taekwon-Do Goosung",accept:["goosung"],kind:"korean",hook:"Goosung — sounds like \"goose song\" — the whole composition sung as one piece."},
{id:"c03",topic:"composition",q:"In the military parallel, what does Fundamental Movements correspond to?",a:"An individual soldier's basic training.",short:"Individual soldier's basic training",accept:["basic training","individual"],hook:"Same as boot camp — basic training before anything else."},
{id:"c04",topic:"composition",q:"In the military parallel, what does Dallyon correspond to?",a:"Maintenance of equipment.",short:"Maintenance of equipment",accept:["maintenance","equipment"],hook:"Dallyon — sounds like \"the loan\" you keep maintained, like gear you're renting from your own body."},
{id:"c05",topic:"composition",q:"In the military parallel, what does Patterns correspond to?",a:"Platoon tactics.",short:"Platoon tactics",accept:["platoon"],hook:"Patterns = choreographed platoon movements, drilled as a unit."},
{id:"c06",topic:"composition",q:"In the military parallel, what does Sparring correspond to?",a:"Field exercises in simulated combat.",short:"Field exercises in simulated combat",accept:["field exercise","simulated combat"],hook:"Sparring = simulated combat, i.e. war games before the real thing."},
{id:"c07",topic:"composition",q:"In the military parallel, what does Self-Defence correspond to?",a:"Actual combat.",short:"Actual combat",accept:["actual combat","combat"],hook:"Self-defence = no more practice — this is the real deal."},
{id:"c08",topic:"composition",q:"The cycle of Taekwon-Do's composition is said to have no beginning or end, like what?",a:"The Deity.",short:"The Deity",accept:["deity","god"],hook:"Picture an infinity symbol — no start, no end, same as how a deity is described."},

{id:"p01",topic:"power",q:"What percentage of their potential does the average person use, per the Theory of Power?",a:"10 to 20 percent.",short:"10 to 20 percent",accept:["10","20"],kind:"number",hook:"Same idea as the old \"we only use 10% of our brain\" myth — applied to physical power here."},
{id:"p02",topic:"power",q:"Name the six factors that produce power.",a:"Reaction Force, Concentration, Equilibrium, Breath Control, Mass, Speed.",short:"Reaction Force, Concentration, Equilibrium, Breath Control, Mass, Speed",mcOnly:true,hook:"Acronym: R-C-E-B-M-S. \"Really Cool Elephants Breathe Mighty Sighs.\"",distractors:["Reaction Force, Concentration, Balance, Breath Control, Mass, Speed","Reaction Force, Focus, Equilibrium, Breath Control, Mass, Speed","Reaction Force, Concentration, Equilibrium, Timing, Mass, Speed"]},
{id:"p03",topic:"power",q:"Korean term for Reaction Force?",a:"Bandong Ryok.",short:"Bandong Ryok",accept:["bandong"],kind:"korean",hook:"Bandong Ryok — \"Bandong\" sounds like \"bound on\" — force bounces straight back."},
{id:"p04",topic:"power",q:"What physical law underlies Reaction Force?",a:"Newton's Law — every force has an equal and opposite force.",short:"Newton's Law",accept:["newton"],hook:"Newton's 3rd law — the same one everyone learns in school: equal and opposite."},
{id:"p05",topic:"power",q:"In a reverse punch, what does the pulling hand do to add reaction force?",a:"It's pulled sharply back to the hip at the moment of impact.",short:"Pulled sharply to the hip",accept:["hip"],hook:"Like a slingshot — pulling one hand back loads the other's launch."},
{id:"p06",topic:"power",q:"Korean term for Concentration?",a:"Jip Joong.",short:"Jip Joong",accept:["jip joong","dip joong"],kind:"korean",hook:"Jip Joong — sounds like \"zip\" — zip the fist to one tight point."},
{id:"p07",topic:"power",q:"Why does a smaller water-hose outlet produce a stronger jet — and how does that relate to Concentration?",a:"Force focused on a smaller area increases its effect; blows are concentrated onto the smallest possible target area of the tool.",short:"Force on a smaller area is stronger",mcOnly:true,hook:"The garden-hose trick — cover the end with your thumb, the jet gets stronger.",distractors:["Force spread over a wider area is stronger","Speed matters more than target size","Larger tools always generate more force"]},
{id:"p08",topic:"power",q:"Korean term for Equilibrium?",a:"Kyun Hyung.",short:"Kyun Hyung",accept:["kyun hyung"],kind:"korean",hook:"Kyun Hyung — \"Kyun\" sounds like \"keen\" — staying keenly balanced."},
{id:"p09",topic:"power",q:"What two types of stability make up Equilibrium?",a:"Dynamic stability and static stability.",short:"Dynamic and static stability",accept:["dynamic","static"],hook:"Static TV noise (still) vs. a dynamic duo (moving) — two kinds of stability."},
{id:"p10",topic:"power",q:"At the point of impact, where should the heel of the rear foot be?",a:"Never off the ground.",short:"Never off the ground",accept:["ground","floor"],hook:"\"Roots planted\" — like a tree, the heel never lifts."},
{id:"p11",topic:"power",q:"Korean term for Breath Control?",a:"Hohup Jojul.",short:"Hohup Jojul",accept:["hohup"],kind:"korean",hook:"Hohup Jojul — \"Ho-hup!\" is basically the sound of a sharp exhale."},
{id:"p12",topic:"power",q:"What is the key breathing rule at the moment of impact?",a:"Never inhale while focusing a block or blow — exhale sharply instead.",short:"Never inhale at impact",accept:["exhale","inhale"],hook:"Same idea as a kiai shout — always sharp exhale, never a gasp in."},
{id:"p13",topic:"power",q:"Korean term for Mass?",a:"Zilyang.",short:"Zilyang",accept:["zilyang"],kind:"korean",hook:"Zilyang — picture a weightlifter groaning under heavy \"z\" mass."},
{id:"p14",topic:"power",q:"How is body weight increased during a blow, per the Mass principle?",a:"By turning the hip and using a springing knee action — raising the hip, then dropping it at impact.",short:"Hip rotation and knee spring",mcOnly:true,hook:"Same motion as a baseball swing — hip torque driving the follow-through.",distractors:["Shoulder rotation and elbow snap","Forward lean and arm extension","Foot pivot and ankle flex"]},
{id:"p15",topic:"power",q:"To properly increase body weight, the moving foot should trace which shape — sine wave or sawtooth wave?",a:"A sine wave.",short:"Sine wave",accept:["sine"],hook:"Literally a wave shape — smooth ocean swell, not jagged sawteeth."},
{id:"p16",topic:"power",q:"Korean term for Speed?",a:"Sokdo.",short:"Sokdo",accept:["sokdo"],kind:"korean",hook:"Sokdo — sounds like \"sock, dough\" — a fast sock to the face."},
{id:"p17",topic:"power",q:"What is the power formula given in the Theory of Power?",a:"P = 1/2 MV\u00b2 — power equals half of mass times velocity squared.",short:"P = 1/2 MV\u00b2",accept:["mv","1/2","half"],hook:"Same formula shape as kinetic energy in physics class — half mass times velocity squared."},
{id:"p18",topic:"power",q:"If speed triples while mass stays constant, by what factor does power increase?",a:"By a factor of nine (speed is squared in the formula).",short:"Nine",accept:["nine","9"],kind:"number",hook:"Speed is squared in the formula: 3² = 9."},
{id:"p19",topic:"power",q:"If mass triples while speed stays constant, by what factor does power increase?",a:"By a factor of three.",short:"Three",accept:["three","3"],kind:"number",hook:"Mass isn't squared — tripling it just triples the power, no more."},
{id:"p20",topic:"power",q:"The 1973 MIT Strobo experiment found kick execution time was shorter than what?",a:"Normal human reflex time — meaning some kicks can't be blocked by reaction alone.",short:"Normal reflex time",accept:["reflex"],hook:"Faster than you can blink — that's the whole point of the finding."},
{id:"p21",topic:"power",q:"What was normal reflex time found to be, at the quickest?",a:"About two-tenths (0.2) of a second.",short:"About 0.2 seconds",accept:["0.2","2/10","0,2"],kind:"number",hook:"About the time it takes to blink an eye."},
{id:"p22",topic:"power",q:"Why should a student watch the opponent's eyes rather than their limbs?",a:"Because technique execution can be faster than reflex time, so the attack must be read before it starts.",short:"Technique is faster than reflex — must be read early",mcOnly:true,hook:"Poker players read eyes, not hands — same logic here.",distractors:["Reflex is always faster than technique","Eye contact has no tactical value","Watching the hands gives the earliest warning"]},

{id:"r01",topic:"rank",q:"Korean term for System of Rank?",a:"Dan Gup Jedo.",short:"Dan Gup Jedo",accept:["dan gup jedo","dan gup"],kind:"korean",hook:"Dan Gup Jedo — \"Dan, Gup\" — sounds like counting down grades before you're \"done\"."},
{id:"r02",topic:"rank",q:"How many total ranks make up the promotional scale?",a:"Nineteen — ten gups and nine dans.",short:"Nineteen",accept:["19","nineteen"],kind:"number",hook:"10 gups + 9 dans = 19 — one shy of 20, always still climbing."},
{id:"r03",topic:"rank",q:"Which gup is lowest, and which is highest?",a:"10th grade is lowest, 1st grade is highest.",short:"10th lowest, 1st highest",accept:["10th","1st"],kind:"number",hook:"Countdown like a rocket launch: 10...9...8... — closer to 1 means closer to black belt."},
{id:"r04",topic:"rank",q:"Why is the number 9 considered significant for the degree system?",a:"9 is 3 x 3, and 3 is the most esteemed number in Oriental philosophy — heaven, mortals, earth.",short:"3 x 3 — three is the most esteemed number",accept:["3","three","9"],hook:"3×3 — same triple structure as the trigrams on the Korean flag (heaven, earth, human)."},
{id:"r05",topic:"rank",q:"What mathematical property of 9 does the text point out?",a:"Multiply 9 by any single digit and the resulting digits always sum to 9.",short:"Digits of any multiple of 9 sum to 9",mcOnly:true,hook:"The classic school math trick: any multiple of 9, digits always sum back to 9.",distractors:["Digits of any multiple of 3 sum to 9","9 cannot be divided evenly by any number","Multiples of 9 always end in an even digit"]},
{id:"r06",topic:"rank",q:"Per the text, is a 1st degree black belt an expert or a novice?",a:"A novice — merely a starting point, the foundation only.",short:"Novice",accept:["novice"],hook:"Getting your black belt is like tying your shoes for the first proper run — the start, not the finish."},
{id:"r07",topic:"rank",q:"At which degree does a student cross into the \"expert\" class?",a:"4th degree.",short:"4th degree",accept:["4th","fourth"],hook:"4 legs make a stable table — 4th degree is where the foundation becomes solid enough to call \"expert\"."},
{id:"r08",topic:"rank",q:"Which degrees make up the \"masters\" class?",a:"7th through 9th degree.",short:"7th to 9th degree",accept:["7th","9th","seventh","ninth"],hook:"Like the 9th inning — the final stretch, reserved for masters closing out the game."},
{id:"r09",topic:"rank",q:"Total hours required by the 18-month course (1.5 hrs/day, 6 days/week)?",a:"702 hours.",short:"702 hours",accept:["702"],kind:"number",hook:"702 — treat it like a memorable phone code, three digits at a glance."},
{id:"r10",topic:"rank",q:"Total hours required by the 12-month course (4 hrs/day, 6 days/week)?",a:"1248 hours.",short:"1248 hours",accept:["1248"],kind:"number",hook:"1248 — a doubling sequence: 1, 2, 4, 8."},

{id:"e01",topic:"test",q:"Who conducts grade (gup) testing?",a:"The student's own gym or dojang.",short:"The student's own gym",accept:["gym","dojang"],hook:"Same as any school test set by your own teacher — no external board involved yet."},
{id:"e02",topic:"test",q:"Who conducts degree testing up to 3rd Dan?",a:"A promotion board of 3 to 7 members from the national association or federation.",short:"A board of 3 to 7 members",accept:["3","7","board"],hook:"Picture a small judging panel, like a handful of competition judges."},
{id:"e03",topic:"test",q:"Who tests 4th to 8th degree?",a:"The promotion committee of the International Taekwon-Do Federation.",short:"ITF promotion committee",accept:["itf","international taekwon-do federation","promotion committee"],hook:"Once you hit 4th degree, your test \"goes international\" — local gym to global federation."},
{id:"e04",topic:"test",q:"How is 9th degree granted?",a:"By unanimous consent of a 9-member special committee, all holders of 7th or 8th degree.",short:"9 members, 7th/8th degree holders",accept:["9","nine","unanimous"],hook:"Mirrors a supreme-court-style council — a small high-ranking panel."},
{id:"e05",topic:"test",q:"Is the power test permitted for children?",a:"No — it's strictly prohibited, due to risk of bone or muscle damage.",short:"No",accept:["no"],kind:"yesno",hook:"Obvious child-safety logic — same reasoning as a seatbelt law."},
{id:"e06",topic:"test",q:"How high may an instructor test students, relative to their own degree?",a:"Up to half their own degree — e.g. a 4th Dan may test up to 2nd.",short:"Half their own degree",accept:["half"],hook:"An instructor can only pass on half of what they hold."},
{id:"e07",topic:"test",q:"What is the passing mark for a grade or degree test?",a:"60 points.",short:"60 points",accept:["60"],kind:"number",hook:"Same as school grading — 60% is a classic pass line."},
{id:"e08",topic:"test",q:"What happens for every 10 points above or below the passing mark?",a:"Automatic promotion or reduction accordingly.",short:"Automatic promotion or reduction",accept:["promotion","reduction","10"],hook:"Like a video game — score thresholds bump your level up or down automatically."},
{id:"e09",topic:"test",q:"What is the highest gup a 1st Dan instructor may teach?",a:"5th grade.",short:"5th grade",accept:["5th"],kind:"number",hook:"1st Dan = half of the entry grade (10th) → 5th."},
{id:"e10",topic:"test",q:"What is the highest gup a 3rd Dan instructor may teach?",a:"1st grade.",short:"1st grade",accept:["1st"],kind:"number",hook:"3rd Dan almost reaches the very top gup (1st) — same half-your-degree logic scaled up."},
{id:"e11",topic:"test",q:"What's the minimum degree to qualify as an International (Class A) umpire?",a:"4th degree, plus passing the ITF umpire course and having match experience.",short:"4th degree",accept:["4th"],kind:"number",hook:"Same \"4th = expert\" marker as the rank system — expert enough to judge internationally."},
{id:"e12",topic:"test",q:"What's the minimum degree to qualify as a National (Class B) umpire?",a:"2nd degree, qualified by the parent association.",short:"2nd degree",accept:["2nd"],kind:"number",hook:"National umpire — one tier below the international bar."},
{id:"e13",topic:"test",q:"What must an umpire wear when judging?",a:"White long-sleeved shirt, solid blue tie, blue pants, white shoes, white socks.",short:"White shirt, blue tie, blue pants, white shoes",mcOnly:true,hook:"Think of a referee's kit — clean, formal, blue-and-white like the ITF flag.",distractors:["Black shirt, red tie, black pants, white shoes","White shirt, black tie, white pants, black shoes","Blue shirt, white tie, blue pants, black shoes"]},
{id:"pn01",topic:"patterns",q:"What does the pattern CHON-JI mean, and how many movements does it have?",a:"\"Heaven and Earth\" — interpreted as the creation of the world. It has 19 movements and is the first pattern, practised from 9th grade.",short:"Heaven and Earth, 19 movements",kind:"korean",hook:"Literally: heaven (Chon) and earth (Ji) — the very beginning, fittingly the first pattern taught."},
{id:"pn02",topic:"patterns",q:"Who is the pattern DAN-GUN named after?",a:"Dan-Gun, the legendary founder of Korea, said to have founded the nation in 2333 BC.",short:"The legendary founder of Korea",kind:"phrase",hook:"Same name as the pattern — the founder of the whole nation, fittingly an early pattern."},
{id:"pn03",topic:"patterns",q:"Who is the pattern DO-SAN named after, and what do its 24 movements represent?",a:"The patriot Ahn Chang-Ho (1876–1938); the 24 movements represent his life devoted to Korean education and independence.",short:"Ahn Chang-Ho",kind:"phrase",hook:"Dan-Gun's own legend: he began the nation, so his pattern begins the black-belt-bound journey through the syllabus."},
{id:"pn04",topic:"patterns",q:"Who was Won-Hyo, and when did he introduce Buddhism to the Silla Dynasty?",a:"The noted monk who introduced Buddhism to the Silla Dynasty in 686 AD.",short:"A monk who introduced Buddhism to Silla, 686 AD",kind:"phrase",hook:"\"Do-San\" sounds like \"Dawn-san\" — a new dawn for Korean education and independence."},
{id:"pn05",topic:"patterns",q:"Who is YUL-GOK named after, and what do its 38 movements represent?",a:"The pseudonym of philosopher and scholar Yi I (1536–1584), \"the Confucius of Korea\"; the 38 movements refer to his birthplace on the 38th parallel.",short:"Yi I, 38th parallel",kind:"number",hook:"38 movements, 38th parallel — the number is literally his birthplace latitude."},
{id:"pn06",topic:"patterns",q:"Who is JOONG-GUN named after, and what do the 32 movements represent?",a:"Patriot Ahn Joong-Gun, who assassinated Hiro-Bumi Ito, first Japanese governor-general of Korea; the 32 movements represent his age at execution.",short:"Ahn Joong-Gun, age 32 at execution",kind:"number",hook:"32 = his age at execution. A short, unfinished number for a life cut short."},
{id:"pn07",topic:"patterns",q:"Who is TOI-GYE named after, and what do its 37 movements represent?",a:"Pen name of scholar Yi Hwang (16th century), authority on neo-Confucianism; the 37 movements refer to his birthplace on the 37th parallel.",short:"Yi Hwang, 37th parallel",kind:"number",hook:"Toi-Gye, Yul-Gok — both scholar patterns encode their birthplace latitude directly into the movement count."},
{id:"pn08",topic:"patterns",q:"What does the pattern HWA-RANG refer to, and what do its 29 movements represent?",a:"The Hwa-Rang youth group from the Silla Dynasty (early 7th century); the 29 movements refer to the 29th Infantry Division, where Taekwon-Do matured.",short:"Hwa-Rang youth group, 29th Infantry Division",kind:"phrase",hook:"29th Infantry Division is where Taekwon-Do matured — same number as the pattern's movements."},
{id:"pn09",topic:"patterns",q:"Who is CHOONG-MOO named after, and why does the pattern end with a left-hand attack?",a:"Admiral Yi Soon-Sin, inventor of the first armoured battleship (Kobukson) in 1592; it ends left-handed to symbolize his death before his full potential could be shown.",short:"Admiral Yi Soon-Sin",kind:"phrase",hook:"Kobukson — the \"turtle ship\" — is considered a forerunner of the modern submarine."},
{id:"pn10",topic:"patterns",q:"Who is KWANG-GAE named after, and what do its 39 movements represent?",a:"Kwang-Gae-Toh-Wang, 19th King of the Koguryo Dynasty, who regained lost territories including much of Manchuria; the 39 movements refer to 391 AD, the year he took the throne.",short:"19th King of Koguryo, 391 AD",kind:"number",hook:"391 AD → \"39\" movements. Chop off the last digit of the year and you get the count."},
{id:"pn11",topic:"patterns",q:"Who is PO-EUN named after?",a:"Chong Mong-Chu (1400), a loyal subject, poet, and pioneer in physics, famed for a poem about unwavering loyalty.",short:"Chong Mong-Chu",kind:"phrase",hook:"Po-Eun's poem about unwavering loyalty is one of Korea's most quoted lines — loyalty is the whole story here."},
{id:"pn12",topic:"patterns",q:"Who is GE-BAEK named after?",a:"A great general in the Baek Je Dynasty (660 AD), known for severe and strict military discipline.",short:"A general in the Baek Je Dynasty",kind:"phrase",hook:"660 AD, Baek Je — a general remembered purely for iron discipline."},
{id:"pn13",topic:"patterns",q:"Who is EUI-AM named after, and what do the 45 movements represent?",a:"Son Byong Hi, leader of the March 1, 1919 independence movement; the 45 movements refer to his age when he renamed Dong Hak to Chondo Kyo in 1905.",short:"Son Byong Hi, age 45",kind:"number",hook:"45 = his age when he renamed his movement — a name change marking a turning point."},
{id:"pn14",topic:"patterns",q:"Who is CHOONG-JANG named after, and why does it end with a left-hand attack?",a:"General Kim Duk Ryang of the Lee Dynasty; it ends left-handed to symbolize his tragic death at 27, before reaching full maturity.",short:"General Kim Duk Ryang, died at 27",kind:"number",hook:"27 — a tragically young number, matching the pattern's mournful left-hand ending."},
{id:"pn15",topic:"patterns",q:"What does the philosophical idea of JUCHE represent?",a:"That man is the master of everything and decides his own destiny; the diagram represents Baekdu Mountain.",short:"Man is the master of his own destiny",kind:"phrase",hook:"Juche — \"you check\" your own destiny. Self-determination is the whole idea."},
{id:"pn16",topic:"patterns",q:"What historical date does SAM-IL denote, and what do its 33 movements represent?",a:"March 1, 1919, the start of Korea's independence movement; the 33 movements stand for the 33 patriots who planned it.",short:"March 1, 1919; 33 patriots",kind:"number",hook:"33 patriots, March 1st — the date is baked directly into the movement count."},
{id:"pn17",topic:"patterns",q:"Who is YOO-SIN named after, and what do the 68 movements represent?",a:"General Kim Yoo Sin, a Silla Dynasty commander; the 68 movements refer to 668 AD, the year Korea was united.",short:"General Kim Yoo Sin, 668 AD",kind:"number",hook:"668 AD unification → \"68\" movements. Same trick as Kwang-Gae: last two digits of the year."},
{id:"pn18",topic:"patterns",q:"Who is CHOI-YONG named after?",a:"General Choi Yong, Premier and Commander-in-Chief during the 14th-century Koryo Dynasty, executed by his own subordinate commanders.",short:"General Choi Yong",kind:"phrase",hook:"Choi Yong — betrayed by his own men. A general undone from within."},
{id:"pn19",topic:"patterns",q:"Who is YON-GAE named after, and what do the 49 movements represent?",a:"General Yon Gae Somoon of the Koguryo Dynasty; the 49 movements refer to 649 AD, when he forced the Tang Dynasty out after destroying nearly 300,000 of their troops.",short:"General Yon Gae Somoon, 649 AD",kind:"number",hook:"649 AD, ~300,000 troops destroyed — the movement count (49) is the year's last two digits again."},
{id:"pn20",topic:"patterns",q:"Who is UL-JI named after, and what do the 42 movements represent?",a:"General Ul-Ji Moon Dok, who defeated a nearly one-million-strong Tang invasion force in 612 AD using guerrilla tactics; the 42 movements represent the author's age when he designed the pattern.",short:"General Ul-Ji Moon Dok",kind:"phrase",hook:"612 AD, ~1 million invaders — but here the movement count (42) is the founder's own age, not the year."},
{id:"pn21",topic:"patterns",q:"Who is MOON-MOO named after, and what do the 61 movements represent?",a:"The 30th king of the Silla Dynasty, buried at sea by his own will to defend Korea against Japan; the 61 movements refer to 661 AD, when he took the throne.",short:"The 30th king of Silla, 661 AD",kind:"number",hook:"661 AD → \"61\" movements — same last-two-digits pattern as several others."},
{id:"pn22",topic:"patterns",q:"Who is SO-SAN named after, and what do the 72 movements represent?",a:"The monk Choi Hyong Ung (1520–1604), who organized a corps of monk soldiers; the 72 movements represent his age when he did so.",short:"Monk Choi Hyong Ung, age 72",kind:"number",hook:"72 = his age organizing monk soldiers — a late-life act of resistance."},
{id:"pn23",topic:"patterns",q:"Who is SE-JONG named after, and what do its 24 movements represent?",a:"King Se-Jong, who invented the Korean alphabet in 1443; the 24 movements refer to the 24 letters of that alphabet.",short:"King Se-Jong, 24 Korean letters",kind:"number",hook:"24 letters, 24 movements — the alphabet and the pattern mirror each other exactly."},
{id:"pn24",topic:"patterns",q:"What does the pattern TONG-IL denote?",a:"The resolution of the unification of Korea, which has been divided since 1945.",short:"Unification of Korea",kind:"phrase",hook:"Tong-Il = \"unification\" — the very last pattern in the syllabus, symbolizing the end goal."},
{id:"pn25",topic:"patterns",q:"How many patterns are there in Taekwon-Do in total?",a:"Twenty-four.",short:"Twenty-four",kind:"number",hook:"24 patterns for 24 hours — same number as the letters in Se-Jong's alphabet, easy to cross-reference."},
{id:"pn26",topic:"patterns",q:"Why are there specifically 24 patterns?",a:"The 24 patterns represent 24 hours — one full day — symbolizing the founder's entire life.",short:"They represent 24 hours, one day",kind:"phrase",hook:"24 hours = 24 patterns = one full day = a symbolic whole life."},
{id:"pn27",topic:"patterns",q:"What is the Korean word for \"Pattern\"?",a:"Tul.",short:"Tul",kind:"korean",hook:"Tul — short, blunt word, like a tool being drawn and used."},
{id:"pn28",topic:"patterns",q:"All pattern diagrams in the encyclopaedia assume the student is facing which direction?",a:"Direction \"D\".",short:"Direction D",kind:"phrase",mcOnly:true,hook:"Picture a compass — the student is always oriented toward point D on the diagram."},
{id:"st01",topic:"stance",q:"What is the Korean word for Stance?",a:"Sogi.",short:"Sogi",kind:"korean",hook:"Sogi — sounds like \"so-key\", the starting-point/key posture of every move."},
{id:"st02",topic:"stance",q:"Korean term for Close Stance (feet together)?",a:"Moa Sogi.",short:"Moa Sogi",kind:"korean",hook:"Moa Sogi — \"Moa\" sounds like \"more\" — feet drawn in as close together as possible."},
{id:"st03",topic:"stance",q:"Korean term for Parallel Stance?",a:"Narani Sogi.",short:"Narani Sogi",kind:"korean",hook:"Narani Sogi — \"Narani\" sounds like \"in a row\" — feet parallel, side by side."},
{id:"st04",topic:"stance",q:"Korean term for Walking Stance?",a:"Gunnun Sogi.",short:"Gunnun Sogi",kind:"korean",hook:"Gunnun Sogi — sounds like \"gun in\" — a strong, loaded stance for front/rear attack."},
{id:"st05",topic:"stance",q:"Korean term for L-Stance?",a:"Niunja Sogi.",short:"Niunja Sogi",kind:"korean",hook:"Niunja Sogi — the stance shape resembles the Korean letter it's named after."},
{id:"st06",topic:"stance",q:"Korean term for Fixed Stance?",a:"Gojung Sogi.",short:"Gojung Sogi",kind:"korean",hook:"Gojung Sogi — \"Go-jung\" sounds like \"go, stay\" — a fixed, unmoving stance."},
{id:"st07",topic:"stance",q:"Korean term for Sitting Stance?",a:"Annun Sogi.",short:"Annun Sogi",kind:"korean",hook:"Annun Sogi — \"Annun\" sounds like \"a-known\" position — a low, settled sit."},
{id:"st08",topic:"stance",q:"Korean term for Diagonal Stance?",a:"Sasun Sogi.",short:"Sasun Sogi",kind:"korean",hook:"Sasun Sogi — \"Sasun\" rhymes with \"the sun\" — angled diagonally like a sundial's shadow."},
{id:"st09",topic:"stance",q:"Korean term for Crouched Stance?",a:"Oguryo Sogi.",short:"Oguryo Sogi",kind:"korean",hook:"Oguryo Sogi — \"Oguryo\" sounds like \"awkward-yo\" — a tucked, crouched shape."},
{id:"st10",topic:"stance",q:"Korean term for X-Stance?",a:"Kyocha Sogi.",short:"Kyocha Sogi",kind:"korean",hook:"Kyocha Sogi — \"Kyocha\" sounds like \"cross-a\" — the legs literally cross."},
{id:"st11",topic:"stance",q:"Korean term for Rear Foot Stance?",a:"Dwitbal Sogi.",short:"Dwitbal Sogi",kind:"korean",hook:"Dwitbal Sogi — \"Dwit\" = rear/behind, \"bal\" = foot. Rear-foot stance, literally."},
{id:"st12",topic:"stance",q:"Korean term for Low Stance?",a:"Nachuo Sogi.",short:"Nachuo Sogi",kind:"korean",hook:"Nachuo Sogi — \"Nachuo\" sounds like \"lower\" — dropped low to the ground."},
{id:"st13",topic:"stance",q:"Korean term for Vertical Stance?",a:"Soojik Sogi.",short:"Soojik Sogi",kind:"korean",hook:"Soojik Sogi — \"Soojik\" sounds like \"so-erect\" — straight up and vertical."},
{id:"st14",topic:"stance",q:"Korean term for Open Stance?",a:"Palja Sogi.",short:"Palja Sogi",kind:"korean",hook:"Palja Sogi — feet splayed open, like the letter \"V\"."},
{id:"st15",topic:"stance",q:"In a Walking Stance, roughly how wide apart should the feet be (between the big toes)?",a:"About one and a half shoulder widths.",short:"One and a half shoulder widths",kind:"phrase",hook:"1.5 shoulder widths — halfway between a normal stride and doing the splits."},
{id:"st16",topic:"stance",q:"In a Walking Stance, how far outward should the rear foot's toes point at most?",a:"25 degrees — beyond that weakens the leg joint against a rear attack.",short:"25 degrees",kind:"number",hook:"25 degrees — think of a slightly-open door, not fully swung out."},
{id:"tl01",topic:"tools",q:"Korean term for Forefist?",a:"Ap Joomuk.",short:"Ap Joomuk",kind:"korean",hook:"Ap Joomuk — \"Ap\" = front, the front-knuckle fist."},
{id:"tl02",topic:"tools",q:"Korean term for Back Fist?",a:"Dung Joomuk.",short:"Dung Joomuk",kind:"korean",hook:"Dung Joomuk — \"Dung\" = back, so literally back-of-fist."},
{id:"tl03",topic:"tools",q:"Korean term for Knife-Hand?",a:"Sonkal.",short:"Sonkal",kind:"korean",hook:"Sonkal — \"Son\" = hand, \"kal\" = knife. Literally hand-knife."},
{id:"tl04",topic:"tools",q:"Korean term for Palm?",a:"Sonbadak.",short:"Sonbadak",kind:"korean",hook:"Sonbadak — \"Son\" = hand, \"badak\" = floor/surface — the flat surface of the hand."},
{id:"tl05",topic:"tools",q:"Korean term for Footsword?",a:"Balkal.",short:"Balkal",kind:"korean",hook:"Balkal — same \"kal\" (knife) as Sonkal, but for the foot (\"Bal\")."},
{id:"tl06",topic:"tools",q:"Korean term for Ball of the Foot?",a:"Apkumchi.",short:"Apkumchi",kind:"korean",hook:"Apkumchi — \"Ap\" = front, the front pad of the foot."},
{id:"tl07",topic:"tools",q:"Korean term for Instep?",a:"Baldung.",short:"Baldung",kind:"korean",hook:"Baldung — \"Bal\" = foot, \"dung\" = back — the back/top of the foot."},
{id:"tl08",topic:"tools",q:"Korean term for Back Heel?",a:"Dwichook.",short:"Dwichook",kind:"korean",hook:"Dwichook — \"Dwi\" = rear/back, the back of the heel."},
{id:"tl09",topic:"tools",q:"Korean term for Knee (as an attacking tool)?",a:"Moorup.",short:"Moorup",kind:"korean",hook:"Moorup — think \"more up\" — the knee drives upward into the target."},
{id:"tl10",topic:"tools",q:"Korean term for Elbow?",a:"Palkup.",short:"Palkup",kind:"korean",hook:"Palkup — sounds like \"pull up\" — the elbow snaps in tight."},
{id:"tl11",topic:"tools",q:"Korean term for Forearm?",a:"Palmok.",short:"Palmok",kind:"korean",hook:"Palmok — \"Pal\" = arm, \"mok\" = neck/section — the arm's own \"neck\" segment."},
{id:"tl12",topic:"tools",q:"Korean term for Thumb?",a:"Umji.",short:"Umji",kind:"korean",hook:"Umji — short, blunt word for a short, blunt digit: the thumb."},
{id:"tl13",topic:"tools",q:"Korean term for Fingertips?",a:"Sonkut.",short:"Sonkut",kind:"korean",hook:"Sonkut — \"Son\" = hand, \"kut\" = end/tip — the very tip of the hand."},
{id:"tl14",topic:"tools",q:"What is the Korean term for \"attacking tools\"?",a:"Gong Gyok Boowi.",short:"Gong Gyok Boowi",kind:"korean",hook:"Gong Gyok Boowi — \"Gong Gyok\" sounds aggressive, like \"go get\" — the attacking side."},
{id:"tl15",topic:"tools",q:"What is the Korean term for \"blocking tools\"?",a:"Makgi Boowi.",short:"Makgi Boowi",kind:"korean",hook:"Makgi Boowi — same \"Makgi\" as in block names elsewhere — the blocking side."},
{id:"tl16",topic:"tools",q:"Attacking and blocking tools are divided into which three categories?",a:"Hand parts, foot parts, and miscellaneous parts.",short:"Hand parts, foot parts, miscellaneous parts",kind:"phrase",mcOnly:true,hook:"Hand, foot, misc — the same three-way split used everywhere else in the book's structure."},
{id:"vs01",topic:"vitals",q:"What is the Korean term for Vital Spots?",a:"Kupso.",short:"Kupso",kind:"korean",hook:"Kupso — sounds like \"cup so\" — a small, cupped-in vulnerable point."},
{id:"vs02",topic:"vitals",q:"Vital spots are divided into which two groups?",a:"Major and minor.",short:"Major and minor",kind:"phrase",mcOnly:true,hook:"Major/minor — same split used in music, easy to reuse mentally."},
{id:"vs03",topic:"vitals",q:"How is a \"major\" vital spot defined?",a:"Injury to it can lead to death or permanent disability.",short:"Can lead to death or permanent disability",kind:"phrase",mcOnly:true,hook:"Death or permanent disability — the worst-case category, remember it as the \"red flag\" one."},
{id:"vs04",topic:"vitals",q:"How is a \"minor\" vital spot defined?",a:"Injury to it isn't life-threatening but causes pain and temporary disability.",short:"Pain and temporary disability, not life-threatening",kind:"phrase",mcOnly:true,hook:"Pain but temporary — the \"you'll live\" category."},
{id:"vs05",topic:"vitals",q:"How many bones make up the human skull, per the encyclopaedia?",a:"28 bones.",short:"28",kind:"number",hook:"28 skull bones — same as the days in a lunar month, an easy peg."},
{id:"vs06",topic:"vitals",q:"How many of the skull's bones protect the brain specifically?",a:"Eight.",short:"Eight",kind:"number",hook:"8 of 28 bones guard the brain — less than a third of the skull is doing the heavy lifting."},
{id:"vs07",topic:"vitals",q:"How many vertebrae make up the cervical (neck) spine?",a:"Seven.",short:"Seven",kind:"number",hook:"7 cervical vertebrae — humans and giraffes both have exactly 7, regardless of neck length."},
{id:"vs08",topic:"vitals",q:"How many vertebrae make up the lumbar (abdominal) spine?",a:"Five.",short:"Five",kind:"number",hook:"5 lumbar vertebrae — one for each finger on a hand resting on the lower back."},
{id:"vs09",topic:"vitals",q:"Korean term for the Head (as a vital-spot region)?",a:"Mori.",short:"Mori",kind:"korean",hook:"Mori — same word used for \"Head\" back in the Attacking Tools section (the head as a misc. tool)."},
{id:"vs10",topic:"vitals",q:"Korean term for the Neck (as a vital-spot region)?",a:"Mok.",short:"Mok",kind:"korean",hook:"Mok — short and sharp, like the neck itself: a narrow, vulnerable point."},
{id:"vs11",topic:"vitals",q:"Korean term for the Chest (as a vital-spot region)?",a:"Gasum.",short:"Gasum",kind:"korean",hook:"Gasum — sounds like \"gas 'em\" — but actually the chest, the body's engine room."},
{id:"vs12",topic:"vitals",q:"Korean term for the Abdomen (as a vital-spot region)?",a:"Bokboo.",short:"Bokboo",kind:"korean",hook:"Bokboo — \"Bok\" appears in other body-related Korean terms tied to the torso."},
{id:"hs01",topic:"history",q:"Who founded Taekwon-Do?",a:"General Choi Hong Hi.",short:"General Choi Hong Hi",kind:"name",hook:"Same surname as pattern Choi-Yong — different Choi, but the name recurs through the book."},
{id:"hs02",topic:"history",q:"When was General Choi Hong Hi born?",a:"November 9th, 1918.",short:"November 9, 1918",kind:"number",hook:"1918 — same era as the end of WWI, easy historical peg."},
{id:"hs03",topic:"history",q:"What martial art did the founder learn as a teenager, before Karate?",a:"Taek Kyon, learned at age 15.",short:"Taek Kyon",kind:"phrase",hook:"Taek Kyon first, Karate second — native art before foreign influence, in that order."},
{id:"hs04",topic:"history",q:"What martial art did the founder study while in Japan, becoming a black belt in it?",a:"Karate.",short:"Karate",kind:"phrase",hook:"Japan → Karate → black belt — a straight line of cause and effect."},
{id:"hs05",topic:"history",q:"On what date was the name \"Taekwon-Do\" officially given?",a:"April 11, 1955.",short:"April 11, 1955",kind:"number",hook:"April 11, 1955 — think \"4-11\" like an emergency call sign for the art's \"birth\"."},
{id:"hs06",topic:"history",q:"What year was Korea liberated from Japanese occupation?",a:"1945.",short:"1945",kind:"number",hook:"1945 — same year as WWII's end, a natural double-peg."},
{id:"hs07",topic:"history",q:"What incident led to the founder's imprisonment by the Japanese?",a:"The Pyongyang Student Soldier's Incident, a national liberation movement he initiated.",short:"Pyongyang Student Soldier's Incident",kind:"phrase",hook:"\"Pyongyang Student Soldier\" — a movement started by a student soldier, in Pyongyang."},
{id:"hs08",topic:"history",q:"In 1959, the founder led a military demonstration team on tour to which two countries?",a:"South Vietnam and Taiwan.",short:"South Vietnam and Taiwan",kind:"phrase",mcOnly:true,hook:"Vietnam and Taiwan — both are Asian nations the founder visited to spread the art abroad."},
{id:"hs09",topic:"history",q:"How many basic ideals did the founder formulate during the 1959 tour?",a:"Three.",short:"Three",kind:"number",hook:"Three ideals, like a three-legged stool — self-confidence, brotherhood, peace."},
{id:"ph01",topic:"philosophy",q:"What is stated as the utmost purpose of Taekwon-Do?",a:"To eliminate fighting by discouraging the stronger's oppression of the weaker, built on humanity, justice, morality, wisdom and faith.",short:"Eliminate fighting; stop the strong oppressing the weak",mcOnly:true,hook:"The whole point in one line: stop the strong preying on the weak."},
{id:"ph02",topic:"philosophy",q:"How many philosophical guidelines/cornerstones does the founder set out for serious students?",a:"Nine.",short:"Nine",kind:"number",hook:"9 guidelines — same sacred number as the 9 Dan degrees."},
{id:"ph03",topic:"philosophy",q:"Complete the guideline: \"Be gentle to the ___, tough to the ___.\"",a:"Be gentle to the weak, tough to the strong.",short:"Weak; strong",hook:"Weak gets gentleness, strong gets toughness — the opposite of a bully's instinct."},
{id:"ph04",topic:"philosophy",q:"Complete the guideline: \"Always finish what you begin, be it ___ or ___.\"",a:"Large or small.",short:"Large or small",hook:"Large or small — no task is too small to finish properly."},
{id:"ph05",topic:"philosophy",q:"Complete the guideline: \"Teach attitude and skill with ___ rather than words.\"",a:"Action.",short:"Action",hook:"Actions, not words — \"show, don't tell\" applied to teaching."}

function normalize(s){
  return (s||"").toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
}

function levenshtein(a,b){
  var m=a.length,n=b.length;
  var dp=[]; for(var i=0;i<=m;i++){dp.push([i]);}
  for(var j=0;j<=n;j++){dp[0][j]=j;}
  for(i=1;i<=m;i++){
    for(j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
    }
  }
  return dp[m][n];
}

function checkTyped(input, card){
  var norm = normalize(input);
  if(!norm) return false;
  if(card.accept){
    for(var i=0;i<card.accept.length;i++){
      if(norm.indexOf(normalize(card.accept[i])) !== -1) return true;
    }
  }
  var shortNorm = normalize(card.short);
  if(norm === shortNorm) return true;
  if(shortNorm.length <= 24){
    var tolerance = Math.max(1, Math.floor(shortNorm.length/6));
    if(levenshtein(norm, shortNorm) <= tolerance) return true;
  }
  return false;
}

function buildOptions(card, pool){
  if(card.distractors && card.distractors.length){
    var opts = card.distractors.concat([card.short]);
    for(var i=opts.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = opts[i]; opts[i]=opts[j]; opts[j]=t;
    }
    return opts;
  }
  var others = pool.filter(function(c){ return c.id !== card.id && c.short !== card.short; });
  var cardKind = card.kind || "phrase";
  // Tiers of preference: same topic+kind, same kind, same topic, anything.
  var tierA = others.filter(function(c){ return c.topic === card.topic && (c.kind||"phrase") === cardKind; });
  var tierB = others.filter(function(c){ return (c.kind||"phrase") === cardKind && c.topic !== card.topic; });
  var tierC = others.filter(function(c){ return c.topic === card.topic && (c.kind||"phrase") !== cardKind; });
  var tierD = others.filter(function(c){ return c.topic !== card.topic && (c.kind||"phrase") !== cardKind; });
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  var ordered = shuffle(tierA).concat(shuffle(tierB)).concat(shuffle(tierC)).concat(shuffle(tierD));
  var picked = []; var usedShort = {};
  for(var i=0;i<ordered.length && picked.length<3;i++){
    var c = ordered[i];
    if(!usedShort[c.short] && c.short !== card.short){
      picked.push(c.short); usedShort[c.short]=1;
    }
  }
  while(picked.length<3){ picked.push("None of the above"); }
  var opts = picked.concat([card.short]);
  for(i=opts.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = opts[i]; opts[i]=opts[j]; opts[j]=t;
  }
  return opts;
}

function defaultState(){
  var cards = {};
  DATA.forEach(function(c){ cards[c.id] = {box:0, due: todayISO()}; });
  return {xp:0, streak:0, lastDate:null, cards:cards};
}

function loadState(cb){
  if(window.storage){
    window.storage.get(STORAGE_KEY, false).then(function(res){
      if(!res || !res.value){ cb(defaultState()); return; }
      try{
        var parsed = JSON.parse(res.value);
        var base = defaultState();
        DATA.forEach(function(c){ if(parsed.cards && parsed.cards[c.id]) base.cards[c.id] = parsed.cards[c.id]; });
        base.xp = parsed.xp || 0;
        base.streak = parsed.streak || 0;
        base.lastDate = parsed.lastDate || null;
        cb(base);
      }catch(e){ cb(defaultState()); }
    }).catch(function(){ cb(defaultState()); });
    return;
  }
  // Standalone fallback: use the browser's own localStorage (works with no Claude account,
  // no publish step — just opening the file directly in a browser).
  try{
    var raw = window.localStorage.getItem(STORAGE_KEY);
    if(!raw){ cb(defaultState()); return; }
    var parsed = JSON.parse(raw);
    var base = defaultState();
    DATA.forEach(function(c){ if(parsed.cards && parsed.cards[c.id]) base.cards[c.id] = parsed.cards[c.id]; });
    base.xp = parsed.xp || 0;
    base.streak = parsed.streak || 0;
    base.lastDate = parsed.lastDate || null;
    cb(base);
  }catch(e){ cb(defaultState()); }
}

function saveState(state){
  if(window.storage){
    window.storage.set(STORAGE_KEY, JSON.stringify(state), false).catch(function(){});
    return;
  }
  try{ window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

var state = null;
var view = "loading";
var session = null;

function levelForXP(xp){
  var idx = 0;
  for(var i=0;i<LEVEL_THRESHOLDS.length;i++){ if(xp >= LEVEL_THRESHOLDS[i]) idx = i; }
  return Math.min(idx, LEVELS.length-1);
}

function buildSession(){
  var today = todayISO();
  var due = [];
  var fresh = [];
  DATA.forEach(function(c){
    var prog = state.cards[c.id];
    if(!prog){ fresh.push(c); return; }
    if(prog.box === 0 && !prog._seenEver){ fresh.push(c); }
    else if(prog.due <= today){ due.push({card:c, box:prog.box}); }
  });
  due.sort(function(a,b){ return a.box - b.box; });
  var pool = due.map(function(x){return x.card;});
  var seen = {}; pool.forEach(function(c){seen[c.id]=1;});
  fresh.forEach(function(c){ if(!seen[c.id]) pool.push(c); });
  for(var i=pool.length-1;i>0;i--){
    if(Math.random()<0.35){
      var j = Math.floor(Math.random()*(i+1));
      var t = pool[i]; pool[i]=pool[j]; pool[j]=t;
    }
  }
  return pool.slice(0, SESSION_SIZE);
}

function topicMastery(topicKey){
  var items = DATA.filter(function(c){return c.topic===topicKey;});
  var total = items.length, sum = 0;
  items.forEach(function(c){ var p = state.cards[c.id]; sum += p ? p.box : 0; });
  return Math.round((sum/(total*5))*100);
}

function overallDueCount(){
  var today = todayISO();
  return DATA.filter(function(c){ var p = state.cards[c.id]; return p && p.due <= today; }).length;
}

function render(){
  var root = document.getElementById('root');
  if(view==="session" && session && session.idx >= session.queue.length){ view = "summary"; }
  if(view==="loading"){ root.innerHTML = ""; return; }
  if(view==="home"){ root.innerHTML = renderHome(); attachHomeHandlers(); return; }
  if(view==="session"){ root.innerHTML = renderSession(); attachSessionHandlers(); return; }
  if(view==="summary"){ root.innerHTML = renderSummary(); attachSummaryHandlers(); return; }
}

function progressBar(progressPct){
  return '<div style="flex:1;height:20px;border-radius:10px;overflow:hidden;position:relative;background:var(--ink-3);border:1px solid var(--line-strong);">'+
      '<div style="position:absolute;inset:0;background:repeating-linear-gradient(115deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 7px);"></div>'+
      '<div style="height:100%;width:'+progressPct+'%;background:linear-gradient(90deg, #9C7A31, var(--gold));transition:width .4s ease;"></div>'+
    '</div>';
}

function renderHome(){
  var lvlIdx = levelForXP(state.xp);
  var lvl = LEVELS[lvlIdx];
  var floor = LEVEL_THRESHOLDS[lvlIdx];
  var ceil = LEVEL_THRESHOLDS[lvlIdx+1] || (floor+1);
  var pct = Math.min(100, Math.round(((state.xp-floor)/(ceil-floor))*100));
  var due = overallDueCount();
  var streakHTML = state.streak > 0
    ? '<span class="voice" style="font-size:20px;font-weight:900;color:var(--gold);">'+state.streak+'</span> <span style="font-size:13px;color:var(--dobok-dim);">day streak</span>'
    : '<span style="font-size:13px;color:var(--dobok-faint);">Start a streak today</span>';

  var topicRows = Object.keys(TOPICS).map(function(k){
    var m = topicMastery(k);
    return '<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);">'+
      '<div style="flex:1;">'+
        '<div style="font-size:13.5px;font-weight:600;">'+TOPICS[k].name+'</div>'+
      '</div>'+
      '<div style="width:72px;height:5px;border-radius:3px;background:var(--ink-3);overflow:hidden;">'+
        '<div style="height:100%;width:'+m+'%;background:var(--gold);"></div>'+
      '</div>'+
      '<div style="font-size:11.5px;color:var(--dobok-faint);width:30px;text-align:right;">'+m+'%</div>'+
    '</div>';
  }).join("");

  return ''+
  '<div class="fade-in">'+
    '<div class="eyebrow">Sohn Jip &middot; Theory Progress</div>'+
    '<h1 class="voice" style="font-size:26px;font-style:italic;font-weight:900;margin-top:4px;">'+lvl.label+'</h1>'+
    '<div style="font-size:13px;color:var(--dobok-dim);margin-top:2px;">'+state.xp+' xp</div>'+
    '<div style="font-size:11.5px;color:var(--dobok-faint);margin-top:2px;">Theory recall only — not your real grade</div>'+
    '<div style="margin-top:16px;">'+progressBar(pct)+'</div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:22px;">'+
      '<div>'+streakHTML+'</div>'+
      '<div style="font-size:13px;color:var(--dobok-dim);">'+due+' due today</div>'+
    '</div>'+
    '<button id="start-btn" class="btn-primary" style="margin-top:22px;">'+(due>0 ? "Start session" : "Study anyway")+'</button>'+
    '<div style="margin-top:30px;">'+
      '<div class="eyebrow" style="margin-bottom:6px;">Mastery by section</div>'+
      topicRows+
    '</div>'+
  '</div>';
}

function attachHomeHandlers(){
  var btn = document.getElementById('start-btn');
  if(btn) btn.onclick = function(){
    session = { queue: buildSession(), idx:0, answered:false, wasCorrect:false, selected:null, typedVal:"", typedErr:false, correct:0, xpGained:0, startXP: state.xp, retryQueue: [], options:null };
    if(session.queue.length===0){ return; }
    view = "session"; render();
  };

}

function renderSession(){
  if(!session || session.idx >= session.queue.length){
    view="summary"; return renderSummary();
  }
  var card = session.queue[session.idx];
  var total = session.queue.length;
  var dots = "";
  for(var i=0;i<total;i++){
    var st = i < session.idx ? "var(--gold)" : (i===session.idx ? "var(--dobok)" : "var(--line-strong)");
    dots += '<div style="width:6px;height:6px;border-radius:50%;background:'+st+';"></div>';
  }

  var useType = !card.mcOnly;
  var bodyHTML = "";

  if(!useType){
    if(!session.options) session.options = buildOptions(card, DATA);
    bodyHTML = session.options.map(function(opt, i){
      var cls = "opt";
      if(session.answered){
        if(opt === card.short) cls += " correct";
        else if(opt === session.selected) cls += " wrong";
        else cls += " dim";
      }
      return '<button class="'+cls+'" data-opt="'+i+'" '+(session.answered?"disabled":"")+'>'+opt+'</button>';
    }).join("");
  } else {
    var inputVal = session.typedVal || "";
    var inputCls = "type-input" + (session.answered ? (session.wasCorrect ? " correct" : " wrong") : "");
    bodyHTML = '<input type="text" id="type-input" class="'+inputCls+'" placeholder="Type your answer" value="'+inputVal.replace(/"/g,"&quot;")+'" '+(session.answered?"disabled":"")+' autocomplete="off">';
    if(session.typedErr){ bodyHTML += '<div class="err">Enter an answer first.</div>'; }
    if(session.answered){
      var resultCls = session.wasCorrect ? "correct" : "wrong";
      var resultText = session.wasCorrect ? "Correct" : "Incorrect";
      bodyHTML += '<div class="result-label '+resultCls+'">'+resultText+'</div>';
      if(!session.wasCorrect){
        bodyHTML += '<div class="opt wrong" style="margin-top:6px;">Correct answer: '+card.short+'</div>';
      }
    }
  }

  var explainHTML = session.answered
    ? '<div class="fade-in" style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line-strong);font-size:14.5px;line-height:1.5;color:var(--dobok-dim);">'+card.a+'</div>'
    : '';

  var hookHTML = (session.answered && !session.wasCorrect && card.hook)
    ? '<div class="fade-in" style="margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--gold-soft);border:1px solid var(--gold-line);">'+
        '<div style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:4px;">Memory hook</div>'+
        '<div style="font-size:14px;line-height:1.5;color:var(--dobok);">'+card.hook+'</div>'+
      '</div>'
    : '';

  var actionHTML = "";
  if(!session.answered){
    if(useType) actionHTML = '<button id="submit-btn" class="btn-primary" style="margin-top:16px;">Check answer</button>';
  } else {
    actionHTML = '<button id="continue-btn" class="btn-primary" style="margin-top:18px;">Continue</button>';
  }

  return ''+
  '<div class="fade-in">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;">'+
      '<button id="exit-btn" style="font-size:13px;color:var(--dobok);font-weight:600;">Exit</button>'+
      '<div style="display:flex;gap:5px;">'+dots+'</div>'+
      '<div style="width:28px;"></div>'+
    '</div>'+
    '<div class="eyebrow" style="margin-top:24px;">'+TOPICS[card.topic].name+'</div>'+
    '<div class="card" style="margin-top:10px;">'+
      '<div class="voice" style="font-size:19px;font-weight:600;line-height:1.4;">'+card.q+'</div>'+
      '<div style="margin-top:6px;">'+bodyHTML+'</div>'+
      explainHTML+
      hookHTML+
    '</div>'+
    actionHTML+
  '</div>';
}

function commitAnswer(correct){
  var card = session.queue[session.idx];
  var prog = state.cards[card.id] || {box:0, due: todayISO()};
  if(correct){
    prog.box = Math.min(prog.box+1, BOX_INTERVALS.length-1);
    session.correct++;
    session.xpGained += 10;
    state.xp += 10;
  } else {
    prog.box = 0;
    session.xpGained += 2;
    state.xp += 2;
    if(session.retryQueue.indexOf(card.id) === -1){
      session.queue.push(card);
      session.retryQueue.push(card.id);
    }
  }
  var interval = BOX_INTERVALS[prog.box];
  var d = new Date();
  d.setDate(d.getDate()+interval);
  prog.due = d.toISOString().slice(0,10);
  prog._seenEver = true;
  state.cards[card.id] = prog;
}

function attachSessionHandlers(){
  var exitBtn = document.getElementById('exit-btn');
  if(exitBtn) exitBtn.onclick = function(){ saveState(state); view="home"; render(); };

  document.querySelectorAll('.opt[data-opt]').forEach(function(el){
    el.onclick = function(){
      if(session.answered) return;
      var card = session.queue[session.idx];
      var chosen = session.options[parseInt(el.getAttribute('data-opt'),10)];
      session.selected = chosen;
      session.wasCorrect = (chosen === card.short);
      session.answered = true;
      commitAnswer(session.wasCorrect);
      saveState(state);
      render();
    };
  });

  var submitBtn = document.getElementById('submit-btn');
  if(submitBtn) submitBtn.onclick = function(){
    var input = document.getElementById('type-input');
    var val = input ? input.value : "";
    if(!val || !val.trim()){
      session.typedErr = true; render(); return;
    }
    session.typedErr = false;
    session.typedVal = val;
    var card = session.queue[session.idx];
    session.wasCorrect = checkTyped(val, card);
    session.answered = true;
    commitAnswer(session.wasCorrect);
    saveState(state);
    render();
  };

  var typeInput = document.getElementById('type-input');
  if(typeInput){
    typeInput.focus();
    typeInput.oninput = function(){ session.typedVal = typeInput.value; };
    typeInput.onkeydown = function(e){ if(e.key==="Enter"){ var b=document.getElementById('submit-btn'); if(b) b.click(); } };
  }

  var continueBtn = document.getElementById('continue-btn');
  if(continueBtn) continueBtn.onclick = function(){
    session.idx++;
    session.answered=false; session.selected=null; session.typedVal=""; session.typedErr=false; session.options=null;
    render();
  };
}

function renderSummary(){
  var today = todayISO();
  var leveledUp = false;
  if(state.lastDate !== today){
    var wasYesterday = state.lastDate && daysBetween(state.lastDate, today) === 1;
    state.streak = wasYesterday ? state.streak+1 : 1;
    state.lastDate = today;
    saveState(state);
  }
  var lvlIdxNow = levelForXP(state.xp);
  var lvlIdxBefore = levelForXP(session.startXP);
  leveledUp = lvlIdxNow > lvlIdxBefore;
  var lvl = LEVELS[lvlIdxNow];

  var promoHTML = leveledUp
    ? '<div class="fade-in card" style="margin-top:16px;border-color:var(--gold-line);background:var(--gold-soft);text-align:center;">'+
        '<div class="eyebrow" style="color:var(--gold);">Theory level up</div>'+
        '<div class="voice" style="font-size:22px;font-style:italic;font-weight:900;margin-top:4px;">'+lvl.label+'</div>'+
        '<div style="font-size:11px;color:var(--dobok-faint);margin-top:6px;">Reflects recall of book content only</div>'+
      '</div>'
    : '';

  return ''+
  '<div class="fade-in" style="text-align:center;padding-top:20px;">'+
    '<div class="eyebrow">Session complete</div>'+
    '<div class="voice" style="font-size:40px;font-weight:900;margin-top:10px;color:var(--gold);">+'+session.xpGained+'</div>'+
    '<div style="font-size:13px;color:var(--dobok-dim);margin-top:2px;">xp earned</div>'+
    '<div style="display:flex;gap:10px;margin-top:22px;">'+
      '<div class="card" style="flex:1;">'+
        '<div style="font-size:22px;font-weight:600;">'+session.correct+'/'+session.queue.length+'</div>'+
        '<div style="font-size:12px;color:var(--dobok-faint);margin-top:2px;">correct</div>'+
      '</div>'+
      '<div class="card" style="flex:1;">'+
        '<div style="font-size:22px;font-weight:600;">'+state.streak+'</div>'+
        '<div style="font-size:12px;color:var(--dobok-faint);margin-top:2px;">day streak</div>'+
      '</div>'+
    '</div>'+
    promoHTML+
    '<button id="again-btn" class="btn-primary" style="margin-top:24px;">Another round</button>'+
    '<button id="done-btn" class="btn-ghost" style="margin-top:10px;">Done for now</button>'+
  '</div>';
}

function attachSummaryHandlers(){
  var again = document.getElementById('again-btn');
  if(again) again.onclick = function(){
    session = { queue: buildSession(), idx:0, answered:false, wasCorrect:false, selected:null, typedVal:"", typedErr:false, correct:0, xpGained:0, startXP: state.xp, retryQueue: [], options:null };
    if(session.queue.length===0){ view="home"; render(); return; }
    view="session"; render();
  };
  var done = document.getElementById('done-btn');
  if(done) done.onclick = function(){ view="home"; render(); };
}

loadState(function(s){
  state = s;
  view = "home";
  render();
});

</script>
</body>
</html>
